<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DreamCar · Проєкти</title>
<script>
  // 08.10.2026: GENERAL злитий у розділ ПРОЄКТИ — старі посилання ведуть туди ж.
  (function () {
    var q = new URLSearchParams(location.search), p = q.get('p'), d = q.get('d');
    var m = (location.hash || '').match(/^#d-(\d{4}-\d{2}-\d{2})$/);
    if (m && !d) d = m[1];
    var url = '/projects/' + (d ? '?d=' + d : '') + (p ? '#project/' + p : '');
    location.replace(url);
  })();
</script>
</head>
