<style>
:root {
  --bg: #0a0a0a; --bg-2: #141414; --bg-3: #1b1b1b; --line: #222; --steel: #2a2a2a;

.user-chip { padding: 6px 10px; background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3); color: #10B981; font-size: 11px; border-radius: 6px; letter-spacing: .08em; }

.g-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.g-sched-row { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }

.g-chip.on { background: var(--red); border-color: var(--red); color: #fff; }

.g-btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--red); background: var(--red); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.g-btn.ghost { background: transparent; color: var(--white); border-color: var(--steel); font-weight: 500; }
.g-btn.ghost.danger { color: var(--red-soft); border-color: rgba(227,6,19,.4); }
.g-btn.sm { padding: 6px 10px; font-size: 12px; }

.g-days { display: flex; flex-direction: column; gap: 8px; }
.g-day { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; scroll-margin-top: 120px; }
.g-day.today { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.g-day.past { opacity: .62; }
.g-day-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.g-day-head b { font-size: 15px; }
.g-day-head > span { color: var(--ash); font-size: 12px; }
.g-day-head em { font-style: normal; font-size: 11px; color: #fff; background: var(--red); padding: 2px 7px; border-radius: 999px; }
.g-plus { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--steel); background: transparent; color: var(--white); font-size: 16px; cursor: pointer; }
.g-ban-mini { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--steel); color: var(--ash); }
.g-ban-mini.pending { color: var(--amber); border-color: rgba(245,158,11,.4); }
.g-ban-mini.approved, .g-ban-mini.live { color: var(--green-soft); border-color: rgba(52,211,153,.35); }
.g-day-body { display: grid; gap: 6px; }

.g-ev { text-align: left; display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); border-left: 4px solid var(--a-all); background: var(--bg-3); color: var(--white); font: inherit; cursor: pointer; }
.g-ev.a-ret { border-left-color: var(--a-ret); }
.g-ev.a-fort { border-left-color: var(--a-fort); }
.g-ev-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11px; }
.g-tag { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--red-soft); }
.a-ret .g-tag { color: var(--blue-soft); }
.a-fort .g-tag { color: var(--violet); }
.g-kind { color: var(--ash); }
.g-time { margin-left: auto; color: var(--ash); }
.g-ev-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
.g-ev-sub { font-size: 12px; color: var(--ash); }
.g-ev-ch { font-size: 12px; color: var(--blue-soft); }
.g-ev-note { font-size: 12px; color: var(--amber); }
.g-mark { font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--steel); color: var(--ash); }
.g-mark[role=button] { cursor: pointer; }
.g-mark.tbd { color: var(--amber); border-color: rgba(245,158,11,.45); }
.g-mark.wait { color: var(--amber); }
.g-ret { font-size: 12px; color: var(--ash); padding: 2px 2px 0; }

.g-sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.g-sec-head h2 { font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.g-list { display: flex; flex-direction: column; }
.g-li { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.g-li:first-child { border-top: 0; }
.g-role { font-size: 12px; color: var(--ash); }
.g-li-main { min-width: 0; word-break: break-word; }
.g-li-main small { display: block; color: var(--ash); font-size: 12px; margin-top: 2px; }
.g-li-act { display: flex; gap: 6px; }
.g-bst.pending { color: var(--amber); }
.g-bst.approved, .g-bst.live { color: var(--green-soft); }
.g-log { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow: auto; font-size: 13px; }
.g-log-row { border-top: 1px solid var(--line); padding-top: 8px; }
.g-log-row div { color: var(--ash); margin-top: 3px; word-break: break-word; }

.g-sheet { position: fixed; inset: 0; z-index: 10050; display: none; }
.g-sheet.show { display: block; }
.g-sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.g-sheet-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 94vw); max-height: 88vh; overflow: auto; background: var(--bg-2); border: 1px solid var(--steel); border-radius: 14px; padding: 18px; }
.g-sheet-x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--steel); background: transparent; color: var(--white); cursor: pointer; font-size: 16px; }
.g-sheet h3 { font-size: 18px; margin: 0 40px 12px 0; line-height: 1.3; }
.g-dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
.g-dl dt { color: var(--ash); }
.g-client { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--bg-3); border: 1px solid var(--line); }
.g-client span { display: block; font-size: 11px; color: var(--ash); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.g-client p { margin-bottom: 10px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.g-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.g-form { display: flex; flex-direction: column; gap: 10px; }
.g-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.g-f span { display: block; font-size: 12px; color: var(--ash); margin-bottom: 4px; }
.g-f input, .g-f select, .g-f textarea { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--steel); background: var(--bg); color: var(--white); font: inherit; font-size: 14px; }
.g-check { display: flex; gap: 8px; align-items: center; font-size: 13px; }

.g-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: #10B981; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 10100; pointer-events: none; max-width: 90vw; }
.g-toast.show { opacity: 1; transform: translateX(-50%); }
.g-toast.bad { background: var(--red); }

@media (max-width: 640px) {
  .topbar { padding: 10px 12px; }
  #gMain { padding: 12px 12px 80px; }
  .g-strip { grid-template-columns: 1fr 1fr; }
  .g-li { grid-template-columns: 1fr; gap: 4px; }
  .g-dl { grid-template-columns: 1fr; gap: 2px; }
  .g-dl dd { margin-bottom: 8px; }
  .g-sheet-panel { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: 100%; max-height: 90vh; border-radius: 16px 16px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .g-ev-title { font-size: 14px; }
}

<body>

<header class="topbar">
  <a href="/general/" class="brand-mark">DREAM<span class="red">CAR</span> · GENERAL</a>
  <div class="topbar-actions">
    <select id="gPicker" aria-label="Проєкт" onchange="G.pick(this.value)"></select>

  </div>
</header>

<div class="login-gate" id="loginGate" style="display:none;">
  <div class="login-card">
    <h1>GENERAL — ВХІД</h1>
    <p>План проєкту: акції по днях, лендинги, шапка сайту. Закрита система для команди.</p>
    <button class="login-btn" id="loginGoogle">УВІЙТИ ЧЕРЕЗ GOOGLE</button>
    <button class="login-btn ghost" id="loginTelegram">УВІЙТИ ЧЕРЕЗ TELEGRAM</button>
    <div class="login-status" id="loginStatus">Перевіряю сесію…</div>
  </div>
</div>

<main id="gMain" style="display:none;"></main>

<div class="g-sheet" id="gSheet" aria-modal="true" role="dialog">
  <div class="g-sheet-bg" onclick="G.close()"></div>
  <div class="g-sheet-panel"><button class="g-sheet-x" onclick="G.close()" aria-label="Закрити">✕</button><div id="gSheetBody"></div></div>
</div>
<div class="g-toast" id="gToast"></div>

<script type="module">
const SUPABASE_URL = 'https://wotghlaehnvxyeacznvv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvdGdobGFlaG52eHllYWN6bnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MDc4NjgsImV4cCI6MjA5NDE4Mzg2OH0.Se-y1WawsdSkMLXj7G_O-Kq-jVfjUOBD3KJOvemCR3A';
let supabase = null, started = false;
window.appState = { authUser: null, publicUser: null };

function setStatus(msg, cls) {
  const el = document.getElementById('loginStatus');
  if (el) { el.textContent = msg; el.className = 'login-status' + (cls ? ' ' + cls : ''); }
}

(async () => {
  try {
    setStatus('Завантажую SDK…');
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true, storage: window.dcStorage }
    });
    window.supabase = supabase;
    try {
      const m = location.hash.match(/#sso=([^&]+)/);
      if (m) {
        setStatus('Приймаю сесію з HQ…');
        const d = JSON.parse(atob(decodeURIComponent(m[1])));
        if (d.access_token && d.refresh_token) await supabase.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
        history.replaceState(null, '', location.pathname + location.search);
      }
    } catch (e) { console.warn('[sso]', e); }
    setStatus('Перевіряю сесію…');
    await checkAuth();
    supabase.auth.onAuthStateChange(() => checkAuth().catch(e => setStatus('Auth: ' + e.message, 'error')));
  } catch (e) { setStatus('❌ ' + e.message, 'error'); }
})();

async function checkAuth() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (session && session.user) {
    window.appState.authUser = session.user;
    let pu = null;
    try { const r = await supabase.rpc('resolve_user_by_auth', { p_auth_id: session.user.id }); pu = (r.data && r.data[0]) || null; } catch (_) {}
    window.appState.publicUser = pu;
    if (!pu) {
      setStatus('⚠ Профіль не знайдено для ' + session.user.email + '. Звернися до CEO.', 'error');
      document.getElementById('loginGate').style.display = 'flex';
      return;
    }
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('gMain').style.display = 'flex';
    document.getElementById('signOutBtn').style.display = 'inline-flex';
    const chip = document.createElement('span');
    chip.className = 'user-chip';
    chip.textContent = '✓ ' + String(pu.name || pu.email || '').toUpperCase().slice(0, 16);
    document.getElementById('authChip').replaceChildren(chip);
    if (!started) { started = true; window.__dcgReady = true; window.dispatchEvent(new CustomEvent('dcg-ready')); }
  } else {
    document.getElementById('loginGate').style.display = 'flex';
    document.getElementById('gMain').style.display = 'none';
    document.getElementById('signOutBtn').style.display = 'none';
    document.getElementById('authChip').replaceChildren();
    setStatus('Готово до входу.');
  }
}

document.getElementById('loginGoogle').onclick = async () => {
  if (!supabase) { setStatus('SDK ще не завантажився…', 'error'); return; }
  setStatus('Перенаправляю на Google…');
  const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/general/' } });
  if (error) setStatus('OAuth: ' + error.message, 'error');
};
document.getElementById('loginTelegram').onclick = () => {
  setStatus('Перенаправляю на TG через HQ…');
  window.location.href = '/hq/?next=' + encodeURIComponent('/general/');
};
document.getElementById('signOutBtn').onclick = async (e) => { e.preventDefault(); await supabase.auth.signOut(); location.reload(); };
</script>
