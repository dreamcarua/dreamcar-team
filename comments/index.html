<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>DreamCar · Учасники з коментарів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="/hq/config.js" defer></script>
<script src="/assets/auth-guard.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a;--bg-2:#131313;--bg-3:#1b1b1b;--line:#242424;--steel:#2f2f2f;
  --white:#fff;--text:#ececec;--ash:#8d8d8d;--grey:#b4b4b4;
  --red:#E30613;--red-deep:#B8050F;--red-soft:#FF6A7A;--gold:#FBBF24;--green:#10B981;--blue:#60A5FA;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--body);font-size:14px;line-height:1.5;padding:0 16px 48px}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--white);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:22px}
h3{font-size:15px;letter-spacing:.06em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--white)}
.brand .r{color:var(--red)}
.topbar .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--bg-3);border:1px solid var(--steel);color:var(--white);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--red)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.inp:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:hover{background:var(--red-deep)}
.btn.ok{border-color:rgba(16,185,129,.5);color:var(--green)}
.btn.no{border-color:rgba(255,106,122,.5);color:var(--red-soft)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:8px}
.hero h1{font-size:clamp(30px,5vw,58px);line-height:1}
.hero .lead{color:var(--grey);max-width:62ch;margin:14px 0 0;white-space:pre-line}
.rules{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules li b{font-family:var(--mono);font-size:11px;color:var(--ash);letter-spacing:.1em;min-width:74px;text-transform:uppercase}
.prizes{display:flex;flex-direction:column;gap:12px}
.prize{position:relative;background:var(--bg-2);border:1px solid var(--steel);border-radius:10px;padding:18px 18px 16px;overflow:hidden}
.prize::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--red))}
.prize .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.prize .amt{font-family:var(--display);font-size:24px;color:var(--white);font-weight:700;text-transform:uppercase}
.prize .how{font-size:12px;color:var(--ash);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.prize .lead-now{margin-top:10px;padding-top:10px;border-top:1px dashed var(--steel);font-size:13px;color:var(--grey);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.prize .lead-now a{color:var(--white);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--bg-2)}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--display);font-size:30px;color:var(--white);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.kpi .s{font-size:12px;color:var(--grey);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chartbox{position:relative;height:260px}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lb li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center}
.lb li.note{display:block;grid-template-columns:none;line-height:1.55}
.lb .rk{font-family:var(--mono);font-size:12px;color:var(--ash);text-align:right}
.lb li:first-child .rk{color:var(--gold)}
.lb .who{min-width:0}
.lb .who a{color:var(--white);text-decoration:none;font-weight:600}
.lb .who a:hover{color:var(--red-soft)}
.lb .txt{font-size:12px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px}
.lb .bar i{display:block;height:100%;background:var(--c,var(--gold));border-radius:2px}
.lb .num{font-family:var(--mono);font-size:13px;color:var(--white)}
.dist{display:flex;flex-direction:column;gap:8px}
.dist .r{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12px}
.dist .r .t{height:10px;background:var(--bg-3);border-radius:2px}
.dist .r .t i{display:block;height:100%;background:var(--red);border-radius:2px}
.dist .r .n{font-family:var(--mono);text-align:right;color:var(--white)}
.note{font-size:12px;color:var(--ash)}
.note b{color:var(--grey)}
.picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:linear-gradient(90deg,rgba(227,6,19,.14),rgba(227,6,19,0) 60%),var(--bg-2);border:1px solid var(--steel);border-radius:10px;padding:18px}
.picker .res{display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-width:0}
.picker .big{font-family:var(--display);font-size:54px;line-height:1;color:var(--white);min-width:3ch;font-variant-numeric:tabular-nums}
.picker .who{min-width:0}
.picker .who a{color:var(--white);font-weight:700;text-decoration:none;font-size:16px}
.picker .who .txt{color:var(--grey);font-size:13px;overflow-wrap:anywhere}
.picker .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.picker .acts .row2{display:flex;gap:8px}
.log{grid-column:1/-1;margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--grey)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,select,textarea{background:var(--bg);border:1px solid var(--steel);color:var(--white);border-radius:6px;padding:10px 12px;font-family:var(--body);font-size:14px}
textarea{resize:vertical;min-height:70px;width:100%}
.inp{flex:1 1 260px;min-width:0}
.form .inp{flex:none;width:100%}
select{font-family:var(--mono);font-size:12px}
.count{font-family:var(--mono);font-size:12px;color:var(--ash);margin-left:auto}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:960px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);background:var(--bg-2);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th[data-k]:hover{color:var(--white)}
th .ar{color:var(--red)}
tbody tr:hover{background:#111}
tbody tr.hl{background:rgba(227,6,19,.16);box-shadow:inset 4px 0 0 var(--gold)}
tbody tr.out td{opacity:.55}
td.n{font-family:var(--mono);color:var(--white);font-weight:700;white-space:nowrap}
td.dt{font-family:var(--mono);font-size:12px;color:var(--grey);white-space:nowrap}
td.acc a{color:var(--white);text-decoration:none;font-weight:600}
td.acc a:hover{color:var(--red-soft)}
td.tx{max-width:460px;overflow-wrap:anywhere}
td.tx mark{background:rgba(251,191,36,.25);color:var(--white);border-radius:2px;padding:0 2px}
td.lk{font-family:var(--mono);text-align:right;white-space:nowrap}
td.lk.hot{color:var(--gold);font-weight:700}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid var(--steel);color:var(--ash);white-space:nowrap}
.pill.reply{color:var(--blue);border-color:rgba(96,165,250,.4)}
.pill.chk{color:var(--gold);border-color:rgba(251,191,36,.4);text-decoration:none}
.pill.hid{color:var(--red-soft);border-color:rgba(255,106,122,.4)}
.pill.kw{color:var(--green);border-color:rgba(16,185,129,.4)}
.pill.st-ready{color:var(--green);border-color:rgba(16,185,129,.4)}
.pill.st-error{color:var(--red-soft);border-color:rgba(255,106,122,.4)}
.pill.st-fetching,.pill.st-queued{color:var(--gold);border-color:rgba(251,191,36,.4)}
.open{display:inline-flex;align-items:center;gap:6px;color:var(--white);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--steel);border-radius:5px;white-space:nowrap}
.open:hover{border-color:var(--red)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.foot{font-size:12px;color:var(--ash);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--grey)}
.form label.full{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 190px 40px;gap:8px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:border-color .15s}
.card:hover{border-color:var(--red)}
.card .t{font-family:var(--display);font-size:18px;color:var(--white);text-transform:uppercase}
.state{padding:40px;text-align:center;color:var(--grey)}
.spin{width:28px;height:28px;border:3px solid var(--steel);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--red-soft)}
.banner{border:1px solid var(--steel);border-radius:10px;padding:14px 18px;background:var(--bg-2);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.gold{border-color:var(--gold)}
.banner.green{border-color:rgba(16,185,129,.6)}
.banner b.t{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:16px}
/* ===== режим ефіру v2 ===== */
#live{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-io:cubic-bezier(0.77,0,0.175,1);position:fixed;inset:0;z-index:60;color:var(--text);
  background:radial-gradient(90% 70% at 50% 38%,rgba(227,6,19,.20),rgba(227,6,19,0) 60%),radial-gradient(60% 50% at 50% 100%,rgba(251,191,36,.06),rgba(0,0,0,0) 70%),#070707;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:18px clamp(16px,2.6vw,40px);gap:14px;overflow:hidden}
#live::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 72px);mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent)}
#live .lt{position:relative;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
#live .lt .brand{font-size:24px}
#live .chip{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);border:1px solid var(--steel);border-radius:999px;padding:6px 12px;background:rgba(0,0,0,.35)}
#live .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(227,6,19,.7);animation:lvPulse 1.6s ease-out infinite}
@keyframes lvPulse{0%{box-shadow:0 0 0 0 rgba(227,6,19,.6)}100%{box-shadow:0 0 0 10px rgba(227,6,19,0)}}
#live .lt .tools .btn{padding:7px 11px}
#live .body{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(250px,.9fr) minmax(0,2.2fr) minmax(250px,.9fr);gap:18px;min-height:0}
#live .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
#live .card{background:rgba(19,19,19,.82);border:1px solid #262626;border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
#live .card .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
#live .card .v{font-family:var(--display);font-size:clamp(26px,2.6vw,40px);color:var(--white);line-height:1.05;font-variant-numeric:tabular-nums}
#live .card .s{font-size:13px;color:var(--grey);margin-top:2px;overflow-wrap:anywhere}
#live .card .s b{color:var(--white)}
#live .bars{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#live .bars .r{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
#live .bars .r .l{position:relative;isolation:isolate;padding:3px 8px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--white)}
#live .bars .r .l i{position:absolute;inset:0 auto 0 0;background:rgba(227,6,19,.32);border-radius:4px;transform-origin:left;transform:scaleX(var(--w));z-index:-1}
#live .bars .r .l.ok i{background:rgba(16,185,129,.35)}
#live .bars .r .n{font-family:var(--mono);text-align:right;color:var(--grey)}
#live .spark{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:10px}
#live .spark i{flex:1;background:rgba(227,6,19,.5);border-radius:2px 2px 0 0;min-height:2px}
#live .spark i.pk{background:var(--red)}
#live .center{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;text-align:center}
#live .prz{font-family:var(--display);font-size:clamp(20px,min(3vw,5.5vh),44px);text-transform:uppercase;color:var(--white);letter-spacing:.02em}
#live .sub{font-family:var(--mono);font-size:clamp(11px,1.05vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
#live .reels{position:relative;display:flex;gap:clamp(8px,1vw,14px);padding:clamp(10px,1.4vw,18px);border-radius:20px;background:linear-gradient(180deg,#111,#0b0b0b);border:1px solid #2a2a2a;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 30px 80px -30px rgba(227,6,19,.45)}
#live .reel{position:relative;width:clamp(84px,9.5vw,150px);height:clamp(80px,21vh,230px);overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#050505,#151515 50%,#050505);
  mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
#live .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
#live .strip div{height:clamp(80px,21vh,230px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(58px,15vh,180px);color:var(--white);font-variant-numeric:tabular-nums}
#live .reel.lead .strip div{color:#2c2c2c}
#live .reels.win{border-color:rgba(251,191,36,.7);box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 0 0 1px rgba(251,191,36,.25),0 30px 90px -20px rgba(251,191,36,.45)}
#live .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(120px,26vh,260px);color:var(--red);pointer-events:none;opacity:0}
#live .flick{font-family:var(--mono);font-size:clamp(13px,1.2vw,17px);color:var(--ash);height:1.4em;letter-spacing:.06em}
#live .winner{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:clamp(60px,14vh,170px)}
#live .nick{font-family:var(--display);font-size:clamp(28px,min(4.6vw,7.5vh),72px);color:var(--gold);line-height:1}
#live .cmt{font-size:clamp(14px,min(1.6vw,2.6vh),24px);color:var(--white);max-width:900px;overflow-wrap:anywhere}
#live .cmt mark{background:rgba(251,191,36,.25);color:var(--white);border-radius:3px;padding:0 4px}
#live .facts2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#live .facts2 span{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--grey);border:1px solid #2a2a2a;border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.4)}
#live .facts2 span b{color:var(--white)}
#live .appear{animation:lvIn 420ms var(--ease-out) both}
#live .appear:nth-child(2){animation-delay:60ms}#live .appear:nth-child(3){animation-delay:120ms}#live .appear:nth-child(4){animation-delay:180ms}
@keyframes lvIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#live .bottom{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
#live .ticker{position:relative;height:48px;overflow:hidden;border:1px solid #262626;border-radius:10px;background:rgba(19,19,19,.8);display:flex;align-items:center;padding:0 16px;gap:12px}
#live .ticker .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);white-space:nowrap}
#live .ticker .tx{font-size:clamp(14px,1.3vw,18px);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity 260ms ease,transform 260ms var(--ease-out)}
#live .ticker .tx.out{opacity:0;transform:translateY(8px)}
#live .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#live .ctl .btn{font-size:13px;padding:13px 20px;transition:transform 160ms var(--ease-out),border-color .15s,background .15s}
#live .ctl .btn:active{transform:scale(.97)}
#live .ctl .btn.big{font-size:15px;padding:15px 28px}
#live .verdict-ok{color:var(--green)}
#live canvas.fx{position:absolute;inset:0;pointer-events:none;z-index:2}
#live .won{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);border:1px solid rgba(16,185,129,.5);border-radius:999px;padding:6px 14px}
@media (max-width:1100px){#live .body{grid-template-columns:minmax(0,1fr)} #live .side{display:none}}
/* ===== айфон з постом у режимі ефіру ===== */
#live .body.phone-on{grid-template-columns:minmax(250px,.85fr) minmax(0,2fr) auto}
#live .body.phone-on .side.right{display:none}
#live .phonewrap{display:none;align-items:center;justify-content:center;min-height:0}
#live .body.phone-on .phonewrap{display:flex;animation:lvPh 380ms cubic-bezier(0.23,1,0.32,1) both}
@keyframes lvPh{from{opacity:0;transform:translateX(24px) rotate(1.5deg)}to{opacity:1;transform:rotate(-2deg)}}
#live .phone{position:relative;height:min(100%,780px);aspect-ratio:9/19.3;border-radius:clamp(34px,5.2vh,54px);padding:clamp(7px,1.1vh,11px);
  background:linear-gradient(145deg,#3a3a3c,#1c1c1e 35%,#2c2c2e 70%,#48484a);box-shadow:0 0 0 1.5px #555 inset,0 40px 90px -30px rgba(0,0,0,.9),0 0 60px -20px rgba(227,6,19,.35);transform:rotate(-2deg)}
#live .phone::before{content:"";position:absolute;right:-3px;top:22%;width:3px;height:9%;border-radius:0 2px 2px 0;background:#2c2c2e}
#live .phone::after{content:"";position:absolute;left:-3px;top:18%;width:3px;height:6%;border-radius:2px 0 0 2px;background:#2c2c2e;box-shadow:0 calc(6vh + 14px) 0 #2c2c2e}
#live .scr{position:relative;width:100%;height:100%;border-radius:clamp(27px,4.3vh,44px);overflow:hidden;background:#000;display:flex;flex-direction:column;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#f5f5f5}

#live .ighd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #262626}

#live .igc .t{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}

<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/comments/">DREAM<span class="r">CAR</span> <span class="eyebrow" style="margin-left:8px">учасники з коментарів</span></a>
    <div class="meta" id="topMeta"><a class="btn" href="/info.html">← Team Hub</a></div>
  </header>
  <main id="app" class="wrap" style="gap:28px"><div class="state"><div class="spin"></div>Завантажую…</div></main>
</div>

<template id="tplHome">
  <section class="panel">
    <div class="hd"><h2>Новий пул з поста</h2><span class="eyebrow">вставте посилання і умови</span></div>
    <form id="newForm" class="form" autocomplete="off"></form>
  </section>
  <section class="panel">
    <div class="hd"><h2>Сторінки постів</h2><span class="eyebrow" id="listCount"></span></div>
    <div class="cards" id="list"></div>
  </section>
</template>

<script>
const FN = () => (window.HQ_CONFIG?.SUPABASE_URL || 'https://wotghlaehnvxyeacznvv.supabase.co') + '/functions/v1/comment-pool';
const DEFAULT_EXCLUDED = ['dreamcar.ua','ai.dreamcar.ua','club.dreamcar.ua','some_mario'];
const fmt = n => (n==null||n===''?'—':Number(n).toLocaleString('uk-UA'));
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prof = u => 'https://www.instagram.com/' + encodeURIComponent(u) + '/';
const kyiv = (ms, opt) => new Date(ms).toLocaleString('uk-UA', Object.assign({timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}, opt||{}));
const $ = id => document.getElementById(id);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}

let SESSION = null;
async function call(action, payload){
  if (!SESSION) { const { data } = await window.supabase.auth.getSession(); SESSION = data.session; }
  const r = await fetch(FN(), { method:'POST', headers:{ 'content-type':'application/json', authorization:'Bearer '+SESSION.access_token, apikey: window.HQ_CONFIG?.SUPABASE_ANON_KEY||'' }, body: JSON.stringify(Object.assign({action}, payload||{})) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok && r.status!==202) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

/* ---------- форма умов (нова і редагування) ---------- */
function formHTML(cfg, url, title, isEdit){
  cfg = cfg || {};
  const prizes = (cfg.prizes && cfg.prizes.length) ? cfg.prizes : [{label:'',method:'random'}];
  return `
    ${isEdit?'':`<label class="full">Посилання на пост Instagram
      <input class="inp" name="url" required placeholder="https://www.instagram.com/p/…" value="${esc(url||'')}"></label>`}
    <label class="full">Заголовок сторінки
      <input class="inp" name="title" placeholder="Напр.: 150 л пального за коментар" value="${esc(title||'')}"></label>
    <div class="full" style="grid-column:1/-1"><div class="eyebrow" style="margin-bottom:8px">Призи і спосіб вибору</div>
      <div id="prizeRows">${prizes.map(prizeRow).join('')}</div>
      <button class="btn" type="button" id="addPrize">+ Приз</button></div>
    <label>Умови (кожна з нового рядка)
      <textarea name="rules" placeholder="залишити коментар під постом&#10;бути підписаним на @dreamcar.ua">${esc((cfg.rules||[]).join('\n'))}</textarea></label>
    <label>Ключові слова правильної відповіді (кома або новий рядок)
      <textarea name="keywords" placeholder="range rover, рендж ровер">${esc((cfg.keywords||[]).join(', '))}</textarea></label>
    <label class="chk"><input type="checkbox" name="keywords_required" ${cfg.keywords_required?'checked':''}> У пул лише коментарі з ключовим словом</label>
    <label class="chk"><input type="checkbox" name="include_replies" ${cfg.include_replies===false?'':'checked'}> Відповіді на коментарі теж отримують номер</label>
    <label class="chk"><input type="checkbox" name="one_per_account" ${cfg.one_per_account?'checked':''}> Один номер на акаунт (перший коментар)</label>
    <label>Виключити акаунти (команда)
      <textarea name="excluded">${esc((cfg.excluded||DEFAULT_EXCLUDED).join(', '))}</textarea></label>
    <div class="full tools" style="grid-column:1/-1"><button class="btn primary" type="submit">${isEdit?'Зберегти умови':'Створити сторінку'}</button><span class="note" id="formMsg"></span></div>`;
}
function prizeRow(p){
  return `<div class="prow"><input class="inp" name="plabel" placeholder="Напр.: 100 л або 10 000 ₴" value="${esc(p.label||'')}">
    <select name="pmethod"><option value="random"${p.method!=='top_likes'?' selected':''}>Випадковий номер</option><option value="top_likes"${p.method==='top_likes'?' selected':''}>Найбільше лайків</option></select>
    <button class="btn" type="button" data-del title="Прибрати">✕</button></div>`;
}
function bindForm(form, onSubmit){
  form.addEventListener('click', e=>{
    if (e.target.id==='addPrize') form.querySelector('#prizeRows').insertAdjacentHTML('beforeend', prizeRow({method:'random'}));
    if (e.target.hasAttribute('data-del')) { const rows=form.querySelectorAll('.prow'); if (rows.length>1) e.target.closest('.prow').remove(); }
  });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(form);
    const labels=f.getAll('plabel'), methods=f.getAll('pmethod');
    const config = {
      prizes: labels.map((l,i)=>({label:String(l).trim(),method:methods[i]})).filter(p=>p.label),
      rules: String(f.get('rules')||'').split('\n').map(s=>s.trim()).filter(Boolean),
      keywords: String(f.get('keywords')||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean),
      keywords_required: !!f.get('keywords_required'),
      include_replies: !!f.get('include_replies'),
      one_per_account: !!f.get('one_per_account'),
      excluded: String(f.get('excluded')||'').split(/[\n,\s]+/).map(s=>s.trim().replace(/^@/,'')).filter(Boolean),
    };
    const btn = form.querySelector('[type=submit]'); btn.disabled=true; $('formMsg').textContent='Зберігаю…';
    try { await onSubmit({ url: f.get('url'), title: String(f.get('title')||'').trim(), config }); }
    catch(err){ $('formMsg').innerHTML='<span class="err">'+esc(err.message)+'</span>'; }
    btn.disabled=false;
  });
}

/* ---------- список ---------- */
const ST = {queued:'в черзі',fetching:'збираю коментарі',ready:'готово',error:'помилка'};
async function renderHome(){
  const app=$('app'); app.innerHTML=''; app.appendChild($('tplHome').content.cloneNode(true));
  const form=$('newForm'); form.innerHTML=formHTML({prizes:[{label:'',method:'random'}],include_replies:true,excluded:DEFAULT_EXCLUDED},new URLSearchParams(location.search).get('url')||'','',false);
  bindForm(form, async ({url,title,config})=>{
    const j = await call('create',{url,title,config});
    location.href='/comments/?id='+j.id;
  });
  try{
    const j = await call('list');
    const items=j.items||[];
    $('listCount').textContent = items.length + ' сторінок';
    $('list').innerHTML = items.map(p=>`<a class="card" href="/comments/?id=${p.id}">
      <div class="eyebrow">${esc(kyiv(Date.parse(p.created_at)))} · ${esc(p.created_by_name||'')}</div>
      <div class="t">${esc(p.title||p.shortcode)}</div>
      <div class="note">${esc(p.url)}</div>
      <div class="tools"><span class="pill st-${p.status}">${ST[p.status]||p.status}</span>
      ${p.api_total!=null?`<span class="pill">${fmt(p.api_total)} коментарів</span>`:''}
      ${p.at?'<span class="pill st-ready">🔒 зафіксовано</span>':''}${(p.draws||[]).length?`<span class="pill chk">спроб: ${(p.draws||[]).filter(d=>d.status==='picked').length}</span>`:''}</div></a>`).join('') || '<div class="note">Ще немає жодної сторінки. Створіть першу формою вище.</div>';
  }catch(e){ $('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}

/* ---------- сторінка поста ---------- */
let POOL=null, M=null, CHART=null, pollT=null, ME={};
function kwRegex(list){
  const k=(list||[]).map(s=>s.toLowerCase().trim()).filter(Boolean).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return k.length ? new RegExp('(^|[^\\p{L}\\p{N}])('+k.join('|')+')','iu') : null;
}
const BRANDS=['porsche','порш','mercedes','мерседес','мерс ','bmw','бмв','audi','ауді','ауди','volkswagen','фольксваген','touareg','туарег','jaguar','ягуар','volvo','вольво','lexus','лексус','toyota','тойота','ford','форд','ranger','рейнджер','ренджер','chevrolet','шевроле','ланос','lanos','defender','дефендер','discovery','дискавер','cadillac','кадилак','infiniti','genesis','bentley','бентлі','maybach','майбах','гелік','tesla','тесла','kia','hyundai','nissan','mazda','skoda','шкода','jeep','джип','lamborghini','ferrari','aston','maserati','rolls','cupra','zeekr','lixiang','li auto','byd'];
function model(pool){
  const cfg=pool.config||{}, sc=pool.shortcode, ex=new Set((cfg.excluded||[]).map(s=>s.toLowerCase()));
  const re=kwRegex(cfg.keywords);
  const all=(pool.rows||[]).map(r=>({id:String(r[0]),t:r[1],u:r[2],text:r[3],likes:r[4]==null?null:r[4],reply:!!r[5],hidden:!!r[6],parent:r[7]||null}));
  let excludedTeam=0; const exBy={};
  const rows=[];
  for(const r of all){
    r.url = r.reply && r.parent ? `https://www.instagram.com/p/${sc}/c/${r.parent}/r/${r.id}/` : `https://www.instagram.com/p/${sc}/c/${r.id}/`;
    if (ex.has(String(r.u).toLowerCase())) { excludedTeam++; exBy[r.u]=(exBy[r.u]||0)+1; continue; }
    r.kw = re ? re.test(r.text) : false;
    r.out = null; r.man = (cfg.manual||{})[r.id] || null;
    if (r.man==='out') r.out='виключено вручну';
    else if (r.man==='in') r.out=null;
    else if (!cfg.include_replies && r.reply) r.out='відповідь';
    else if (cfg.keywords_required && !r.kw) r.out='без ключового слова';
    rows.push(r);
  }
  rows.sort((a,b)=>a.t-b.t||a.id.localeCompare(b.id));
  if (cfg.one_per_account){ const s=new Set(); for(const r of rows){ if(r.out) continue; if(s.has(r.u)) r.out='повторний коментар акаунта'; else s.add(r.u); } }
  let n=0; for(const r of rows){ r.n = r.out ? null : ++n; }
  let outRows=rows, fcfg=cfg, fre=re;
  if (pool.frozen){
    // Зафіксований пул: номери з моменту фіксації, нові коментарі номер не отримують
    fcfg=pool.frozen.config||cfg; fre=kwRegex(fcfg.keywords);
    const byId=new Map(rows.map(r=>[r.id,r])); const fz=new Set();
    const fr=(pool.frozen.entries||[]).map(e=>{ const cur=byId.get(String(e[1])); fz.add(String(e[1]));
      const r=cur?Object.assign({},cur):{id:String(e[1]),t:e[4],u:e[2],text:e[3],likes:null,reply:false,hidden:false,parent:null,url:`https://www.instagram.com/p/${sc}/c/${e[1]}/`,kw:fre?fre.test(e[3]):false,gone:true};
      r.n=e[0]; r.out=null; r.man=null; return r; });
    const rest=rows.filter(r=>!fz.has(r.id)).map(r=>Object.assign({},r,{n:null,out:r.out||'після фіксації',man:null}));
    outRows=fr.concat(rest).sort((a,b)=>a.t-b.t||a.id.localeCompare(b.id));
  }
  const conflicts=BRANDS.filter(b=>!(fcfg.keywords||[]).some(k=>b.includes(k.toLowerCase())||k.toLowerCase().includes(b)));
  for(const r of outRows){ const t=String(r.text).toLowerCase();
    r.sus = !!(r.kw && (conflicts.some(b=>t.includes(b)) || /(^|[^\p{L}])(або|чи|или|or)([^\p{L}]|$)|\?|\//iu.test(t))); }
  const pool_=outRows.filter(r=>r.n).sort((a,b)=>a.n-b.n);
  return {cfg:fcfg, rows:outRows, pool:pool_, excludedTeam, exBy, re:fre, frozen:pool.frozen||null};
}

async function renderPool(id){
  clearTimeout(pollT);
  let j; try{ j=await call('get',{id}); }catch(e){ $('app').innerHTML='<div class="state err">'+esc(e.message)+'</div>'; return; }
  POOL=j.pool; ME=j.me||{};
  document.title = 'DreamCar · ' + (POOL.title||POOL.shortcode);
  $('topMeta').innerHTML = `<a class="btn" href="/comments/">← Усі пости</a><a class="btn" href="${esc(POOL.url)}" target="_blank" rel="noopener">Відкрити пост ↗</a>
    <button class="btn" id="refreshBtn" type="button">↻ Оновити коментарі</button><button class="btn" id="editBtn" type="button" ${POOL.frozen?'disabled title="Пул зафіксовано"':''}>Умови</button><button class="btn primary" id="liveBtn" type="button">▶ Режим ефіру</button>`;
  $('refreshBtn').onclick = async()=>{ $('refreshBtn').disabled=true; try{ await call('refresh',{id}); toast('Збираю коментарі заново…'); setTimeout(()=>renderPool(id),2500);}catch(e){toast(e.message);} };
  $('editBtn').onclick = ()=>{ if(!POOL.frozen) openEdit(); };
  $('liveBtn').onclick = ()=>{ if(M) openLive(); };
  if (POOL.status==='queued'||POOL.status==='fetching'){
    $('app').innerHTML = `<div class="state"><div class="spin"></div>Збираю коментарі з Instagram… Сторінка оновиться сама.${POOL.rows?.length?'<div class="note">Попередні дані: '+fmt(POOL.rows.length)+' коментарів</div>':''}</div>`;
    pollT=setTimeout(()=>renderPool(id),3000); return;
  }
  if (POOL.status==='error' && !(POOL.rows||[]).length){
    $('app').innerHTML = `<div class="state"><div class="err">Не вдалося зібрати коментарі: ${esc(POOL.error)}</div><p class="note">Перевірте посилання (пост має бути з акаунта @dreamcar.ua) і натисніть «Оновити коментарі».</p></div>`; return;
  }
  M=model(POOL); draw();
}

function openEdit(){
  const app=$('app');
  app.innerHTML=`<section class="panel"><div class="hd"><h2>Умови сторінки</h2><span class="eyebrow">номери перераховуються одразу</span></div><form id="editForm" class="form"></form></section>`;
  const f=$('editForm'); f.innerHTML=formHTML(POOL.config, POOL.url, POOL.title, true);
  if ((POOL.draws||[]).length) f.insertAdjacentHTML('afterbegin','<div class="full note err" style="grid-column:1/-1">Увага: спроби вибору вже були. Зміна умов змінить номери учасників.</div>');
  bindForm(f, async ({title,config})=>{ config.manual=(POOL.config||{}).manual||{}; await call('update',{id:POOL.id,title,config}); toast('Збережено'); renderPool(POOL.id); });
}

      ${['ceo','coo'].includes(ME.role)&&!picked?'<button class="btn" type="button" id="unfreezeBtn">Зняти фіксацію</button>':''}</div>`;
    const u=$('unfreezeBtn'); if(u) u.onclick=async()=>{ u.disabled=true; try{ await call('unfreeze',{id:POOL.id}); toast('Фіксацію знято'); renderPool(POOL.id);}catch(e){toast(e.message);u.disabled=false;} };

      <div class="tools"><button class="btn primary" type="button" id="freezeBtn" ${M.pool.length?'':'disabled'}>🔒 Зафіксувати пул</button><button class="btn" type="button" id="freezeYes" hidden>Так, зафіксувати ${fmt(M.pool.length)} номерів</button></div></div>`;

  }
}

function liveStats(){

  const all=rows.length, acc=new Set(rows.map(r=>r.u)).size;
  const first=pool[0]||null, last=pool[pool.length-1]||null;
  const mins=ms=>{ const m=Math.round(ms/60000); return m<60?`${m} хв`:m<1440?`${Math.floor(m/60)} год ${m%60} хв`:`${Math.floor(m/1440)} дн ${Math.floor(m%1440/60)} год`; };
  // активність по годинах
  const hrs={}; pool.forEach(r=>{const h=Math.floor(r.t/3600000); hrs[h]=(hrs[h]||0)+1;});
  const hk=Object.keys(hrs).map(Number).sort((a,b)=>a-b); const series=[]; if(hk.length){ for(let h=hk[0];h<=hk[hk.length-1]&&series.length<72;h++) series.push([h,hrs[h]||0]); }
  const peak=series.reduce((m,x)=>x[1]>m[1]?x:m,[0,0]);
  const firstHour=first?pool.filter(r=>r.t-first.t<3600000).length:0;

  const label={porsche:'Porsche','порш':'Porsche',mercedes:'Mercedes','мерседес':'Mercedes','мерс ':'Mercedes',bmw:'BMW','бмв':'BMW',audi:'Audi','ауді':'Audi','ауди':'Audi',volkswagen:'Volkswagen','фольксваген':'Volkswagen',touareg:'Volkswagen','туарег':'Volkswagen',jaguar:'Jaguar','ягуар':'Jaguar',volvo:'Volvo','вольво':'Volvo',lexus:'Lexus','лексус':'Lexus',toyota:'Toyota','тойота':'Toyota',ford:'Ford','форд':'Ford',ranger:'Ford','рейнджер':'Ford','ренджер':'Ford',chevrolet:'Chevrolet','шевроле':'Chevrolet','ланос':'Lanos',lanos:'Lanos',defender:'Defender','дефендер':'Defender',discovery:'Discovery','дискавер':'Discovery',cadillac:'Cadillac','кадилак':'Cadillac',bentley:'Bentley','бентлі':'Bentley',maybach:'Maybach','майбах':'Maybach','гелік':'Mercedes G',tesla:'Tesla','тесла':'Tesla',jeep:'Jeep','джип':'Jeep',lamborghini:'Lamborghini',ferrari:'Ferrari',aston:'Aston Martin',maserati:'Maserati',rolls:'Rolls-Royce',kia:'Kia',hyundai:'Hyundai',nissan:'Nissan',mazda:'Mazda',skoda:'Skoda','шкода':'Skoda',infiniti:'Infiniti',genesis:'Genesis',cupra:'Cupra',zeekr:'Zeekr',lixiang:'Li Auto','li auto':'Li Auto',byd:'BYD'};
  const other={}; rows.filter(r=>!r.n).forEach(r=>{ const t=String(r.text).toLowerCase(); const seen=new Set(); conflicts.forEach(b=>{ if(t.includes(b)){ const L=label[b]||b; if(!seen.has(L)){seen.add(L); other[L]=(other[L]||0)+1;} } }); });
  const otherTop=Object.entries(other).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byAcc={}; rows.forEach(r=>byAcc[r.u]=(byAcc[r.u]||0)+1); const topAcc=Object.entries(byAcc).sort((a,b)=>b[1]-a[1])[0];
  const longest=[...pool].sort((a,b)=>String(b.text).length-String(a.text).length)[0];
  const share=all?Math.round(pool.length/all*100):0;
  return {pub,all,acc,first,last,series,peak,firstHour,otherTop,topAcc,longest,share,mins,hasKw:!!(cfg.keywords||[]).length};
}
function factsList(S){
  const f=[];
  if(S.first) f.push(['Перший',`@${S.first.u} відповів ${S.pub?'через '+S.mins(S.first.t-S.pub)+' після публікації':kyiv(S.first.t)}`]);

  if(S.peak[1]) f.push(['Пік',`${new Date(S.peak[0]*3600000).toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'})}: ${fmt(S.peak[1])} учасників за годину`]);
  if(S.firstHour) f.push(['Швидкість',`за першу годину долучилось ${fmt(S.firstHour)} учасників`]);

  document.querySelectorAll('#live .reel').forEach((r,k)=>{ const s=r.querySelector('.strip'); s.getAnimations().forEach(x=>x.cancel());
    s.style.transform=`translateY(${-(10*(LOOPS-1)+ds[k])*h}px)`; r.classList.toggle('lead', n>0 && k<L-sig); }); }

  await Promise.all(reels.map((r,k)=>{ const s=r.querySelector('.strip');

function rnd(max){const a=new Uint32Array(1);const lim=Math.floor(0x100000000/max)*max;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%max+1}
function picks(){ return (POOL.draws||[]).filter(d=>d.status==='picked'); }
function drawnIds(){ return new Set(picks().map(d=>d.comment_id)); }
function skippedSet(){ const s=POOL.skipped||[]; return {ids:new Set(s.map(x=>x.comment_id)), acc:new Set(s.map(x=>String(x.username).toLowerCase()))}; }
// доступні для наступної спроби: без уже обраних і без відхилених (ні номера, ні акаунта)
function availFor(i){ const used=drawnIds(); const usedAcc=new Set(picks().map(d=>String(d.username).toLowerCase())); const sk=skippedSet();
  return M.pool.filter(r=>!used.has(r.id)&&!usedAcc.has(String(r.u).toLowerCase())&&!sk.ids.has(r.id)&&!sk.acc.has(String(r.u).toLowerCase())); }
function attempts(i){
  const label=M.cfg.prizes[i].label; const L=(POOL.draws||[]).filter(d=>d.prize===label);
  const out=[];
  for(const d of L){ if(d.status==='picked') out.push({pick:d,verdict:null}); else if(d.status==='confirmed'){ const a=[...out].reverse().find(x=>x.pick.comment_id===d.comment_id&&!x.verdict); if(a) a.verdict=d; } }
  return out;
}
function pendingAttempt(i){ const a=attempts(i); const last=a[a.length-1]; return last&&!last.verdict?last:null; }
function winnerOf(i){ return attempts(i).find(a=>a.verdict); }

  $('pickers').innerHTML = rnds.map(p=>`<section class="picker" data-i="${p.i}" style="margin-bottom:18px">
    <div class="res"><div class="big mono" id="pickN${p.i}">—</div>
      <div class="who" id="pickWho${p.i}"><div class="eyebrow">${esc(p.label)} · випадковий номер</div><div class="txt">Генератор бере номер від 1 до ${fmt(pool.length)} через crypto.getRandomValues, без повторів номера й акаунта. ✓ визначає отримувача, ✗ прибирає спробу з журналу, а учасника з наступних спроб.</div></div></div>
    <div class="acts"><button class="btn primary" type="button" data-pick="${p.i}">Обрати випадковий номер</button>
      <div class="row2" id="verdict${p.i}" hidden><button class="btn ok" type="button" data-v="confirmed">✓ Умови виконано</button><button class="btn no" type="button" data-v="rejected">✗ Не виконано</button></div></div>
    <ol class="log" id="log${p.i}"></ol></section>`).join('');
  rnds.forEach(p=>{ renderLog(p.i); pickerState(p.i); });
  $('pickers').onclick = e=>{
    const b=e.target.closest('[data-pick]'); if(b) return pick(+b.dataset.pick, b);
    const v=e.target.closest('[data-v]'); if(!v) return; const i=+v.closest('.picker').dataset.i;
    const a=v.dataset.lv!=null?attempts(i)[+v.dataset.lv]:pendingAttempt(i); if(!a) return;
    if(v.dataset.v==='confirmed') return verdictFor(i,a.pick,'confirmed');
    return removeAttempt(i,a.pick,v.dataset.v==='rejected');
  };
}
function pickerState(i){
  const b=document.querySelector(`[data-pick="${i}"]`); if(!b) return; const won=winnerOf(i), pend=pendingAttempt(i);
  $('verdict'+i).hidden=!pend;
  if(!M.frozen){ b.disabled=true; b.textContent='🔒 Спершу зафіксуйте пул'; }
  else if(won){ b.disabled=true; b.textContent='✓ Отримувача визначено'; }
  else if(pend){ b.disabled=true; b.textContent='Поставте вердикт ✓ або ✗'; }
  else { b.disabled=!availFor(i).length; b.textContent=attempts(i).length?'Наступна спроба':'Обрати випадковий номер'; }
}
function renderLog(i){
  const el=$('log'+i); if(!el) return;
  const A=attempts(i); const win=winnerOf(i);
  const t=ms=>esc(kyiv(ms,{second:'2-digit'}));
  const sk=(POOL.skipped||[]).filter(x=>x.prize===M.cfg.prizes[i].label).length;
  el.innerHTML = (A.length||sk?`<li style="margin-bottom:6px"><b style="color:${win?'var(--green)':'var(--gold)'}">${win?`Отримувач призу: @${esc(win.pick.username)} (№${win.pick.n})`:'Отримувача ще не визначено'}</b> <span class="note">· час за Києвом${sk?` · відхилено учасників: ${sk}`:''}</span></li>`:'')+
    A.map((a,k)=>`<li>Спроба ${k+1} · <span class="mono">${t(Date.parse(a.pick.at))}</span> · <b class="mono">№${a.pick.n}</b> з ${fmt(a.pick.pool_size)} · <a href="${esc(rowUrl(a.pick.comment_id))}" target="_blank" rel="noopener">@${esc(a.pick.username)}</a>
      · ${a.verdict?`<span style="color:var(--green)">✓ умови виконано</span> <span class="note">(вердикт: ${esc(a.verdict.by||'')})</span>`:`<span style="color:var(--gold)">без вердикту</span> <button class="btn ok" type="button" data-lv="${k}" data-v="confirmed" style="padding:4px 8px" title="Умови виконано">✓</button> <button class="btn no" type="button" data-lv="${k}" data-v="rejected" style="padding:4px 8px" title="Не виконав умови: спроба зникне, учасник не потрапить у наступні">✗</button> <button class="btn" type="button" data-lv="${k}" data-v="void" style="padding:4px 8px" title="Тестова спроба: зникне, учасник лишається в пулі">тест</button>`}
      <span class="note">· натиснув(ла): ${esc(a.pick.by||'—')}</span></li>`).join('');
  el.hidden=!(A.length||sk);
}
function rowUrl(cid){ const r=M.rows.find(x=>x.id===cid); return r?r.url:POOL.url; }
function choose(i){
  if(!M.frozen){ toast('Спершу зафіксуйте пул: кнопка «🔒 Зафіксувати пул» над вибором'); return null; }
  if(pendingAttempt(i)){ toast('Поставте вердикт ✓ або ✗ попередній спробі'); return null; }
  if(winnerOf(i)){ toast('Отримувача цього призу вже визначено'); return null; }
  const avail=availFor(i); if(!avail.length){ toast('Доступних учасників не лишилось'); return null; }
  return avail[rnd(avail.length)-1];
}
async function logPick(i, r){
  try{ const j=await call('log_draw',{id:POOL.id,entry:{prize:M.cfg.prizes[i].label,method:'random',n:r.n,pool_size:M.pool.length,comment_id:r.id,username:r.u,text:r.text,status:'picked'}}); POOL.draws=j.draws; }
  catch(e){ toast('Журнал не записано: '+e.message); }
}
async function verdictFor(i, pk, v){
  try{ const j=await call('log_draw',{id:POOL.id,entry:{prize:pk.prize,method:'random',n:pk.n,pool_size:pk.pool_size,comment_id:pk.comment_id,username:pk.username,text:'',status:v}}); POOL.draws=j.draws; }
  catch(e){ toast('Журнал не записано: '+e.message); }
  renderLog(i); pickerState(i);
}
async function removeAttempt(i, pk, skip){
  try{ const j=await call('remove_draw',{id:POOL.id,comment_id:pk.comment_id,prize:pk.prize,skip}); POOL.draws=j.draws; POOL.skipped=j.skipped; toast(skip?'Спробу прибрано, учасник не потрапить у наступні':'Тестову спробу прибрано'); }
  catch(e){ toast(e.message); }
  renderLog(i); pickerState(i); if($('pickN'+i)) $('pickN'+i).textContent='—';
}
async function pick(i, btn){
  const r=choose(i); if(!r) return;
  btn.disabled=true; $('verdict'+i).hidden=true;
  const out=$('pickN'+i); const reduce=REDUCE(); const steps=reduce?1:34; let k=0; const P=M.pool;
  await new Promise(res=>{(function tick(){ k++; out.textContent = k<steps ? P[rnd(P.length)-1].n : r.n; if(k<steps){ setTimeout(tick,30+Math.pow(k/steps,3)*460); } else res(); })();});
  await logPick(i, r);
  const cntA=P.filter(x=>x.u===r.u).length;
  $('pickWho'+i).innerHTML=`<div class="eyebrow">${esc(M.cfg.prizes[i].label)} · номер ${r.n} з ${fmt(P.length)}</div><a href="${esc(r.url)}" target="_blank" rel="noopener">@${esc(r.u)} ↗</a><div class="txt">${hl(r.text)}</div><div class="txt mono" style="font-size:11px;color:var(--ash)">${esc(kyiv(r.t,{second:'2-digit'}))} · ${fmt(r.likes)} ❤ · у акаунта ${cntA} ном. · підписку перевірити на <a href="${prof(r.u)}" target="_blank" rel="noopener" style="color:var(--gold)">профілі</a></div>`;
  renderLog(i); pickerState(i);
  focusRow(r);
}

/* ---------- таблиця ---------- */
let sortK='t', sortDir=1, page=0, highlight=null, view=[]; const PER=100;
function initTable(){
  document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.k; if(sortK===k) sortDir*=-1; else {sortK=k; sortDir=(k==='likes')?-1:1;} apply(); }));
  ['q','fPool','fType','fLikes'].forEach(id=>$(id).addEventListener('input',apply));
  $('prev').onclick=()=>{page--;render()}; $('next').onclick=()=>{page++;render()};
  $('tb').onclick=async e=>{ const b=e.target.closest('[data-man]'); if(!b) return;
    if ((POOL.draws||[]).some(d=>d.status==='picked')) { toast('Спроби вибору вже були: ручна зміна пулу змінить номери'); }
    b.disabled=true; const cfg=Object.assign({},POOL.config); cfg.manual=Object.assign({},cfg.manual||{});
    const r=M.rows.find(x=>x.id===b.dataset.man); const auto = r && !(cfg.keywords_required&&!r.kw) && !(!cfg.include_replies&&r.reply);
    if ((b.dataset.to==='in'&&auto)||(b.dataset.to==='out'&&!auto&&cfg.manual[b.dataset.man]==='in')) delete cfg.manual[b.dataset.man]; else cfg.manual[b.dataset.man]=b.dataset.to;
    try{ const j=await call('update',{id:POOL.id,config:cfg}); POOL.config=j.config; const keep={q:$('q').value,p:$('fPool').value,t:$('fType').value,l:$('fLikes').value,pg:page,sk:sortK,sd:sortDir};
      M=model(POOL); draw(); $('q').value=keep.q;$('fPool').value=keep.p;$('fType').value=keep.t;$('fLikes').value=keep.l;sortK=keep.sk;sortDir=keep.sd;apply();page=keep.pg;render(); toast(b.dataset.to==='in'?'Додано в пул':'Прибрано з пулу'); }
    catch(err){ toast(err.message); b.disabled=false; } };
  apply();
}
function apply(){
  const q=$('q').value.trim().toLowerCase().replace(/^@/,'').replace(/^[№#]\s*/,'');
  const fp=$('fPool').value, ft=$('fType').value, fl=+$('fLikes').value;
  view=M.rows.filter(r=>{
    if(fp==='in'&&!r.n) return false; if(fp==='out'&&r.n) return false; if(fp==='kw'&&!r.kw) return false; if(fp==='sus'&&!r.sus) return false;
    if(ft==='c'&&r.reply) return false; if(ft==='r'&&!r.reply) return false;
    if((r.likes||0)<fl) return false;
    if(!q) return true;
    if(/^\d+$/.test(q)) return String(r.n)===q;
    return r.u.toLowerCase().includes(q)||r.text.toLowerCase().includes(q);
  });
  const key=sortK==='n'?(r=>r.n??1e9):(r=>r[sortK]);
  view.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*sortDir||a.t-b.t;});
  page=0; render();
}
function render(){
  const pages=Math.max(1,Math.ceil(view.length/PER)); page=Math.min(Math.max(page,0),pages-1);
  const used=drawnIds(); const skipIds=skippedSet().ids;
  $('tb').innerHTML=view.slice(page*PER,page*PER+PER).map(r=>`<tr id="r${r.id}" class="${highlight===r.id?'hl':''}${r.n?'':' out'}">
    <td class="n">${r.n??'—'}</td><td class="dt">${esc(kyiv(r.t,{second:'2-digit'}))}</td>
    <td class="acc"><a href="${prof(r.u)}" target="_blank" rel="noopener">@${esc(r.u)}</a>${r.reply?' <span class="pill reply">відповідь</span>':''}${r.hidden?' <span class="pill hid">приховано</span>':''}${r.kw?' <span class="pill kw">ключове</span>':''}${r.sus?' <span class="pill hid" title="Згадує іншу марку, кілька варіантів або питання">сумнівно</span>':''}${r.gone?' <span class="pill hid">зник з Instagram</span>':''}${r.out?` <span class="pill">${esc(r.out)}</span>`:''}${used.has(r.id)?' <span class="pill chk">обрано</span>':''}${skipIds.has(r.id)?' <span class="pill hid">відхилено</span>':''}</td>
    <td class="tx">${hl(r.text)}</td><td class="lk${(r.likes||0)>=20?' hot':''}">${fmt(r.likes)}</td>
    <td><a class="pill chk" href="${prof(r.u)}" target="_blank" rel="noopener" title="Instagram не віддає підписки через API">перевірити</a></td>
    <td><a class="open" href="${esc(r.url)}" target="_blank" rel="noopener">Відкрити ↗</a></td>
    <td>${M.frozen?'<span class="note">🔒</span>':`<button class="btn${r.n?' no':' ok'}" type="button" data-man="${r.id}" data-to="${r.n?'out':'in'}" title="${r.n?'Прибрати з пулу':'Додати в пул'}">${r.n?'✗':'✓'}</button>${r.man?' <span class="pill">вручну</span>':''}`}</td></tr>`).join('')||'<tr><td colspan="8" style="color:var(--ash);padding:24px">Нічого не знайдено. Спробуйте номер, частину нікнейму або слово з коментаря.</td></tr>';
  $('count').textContent=`${fmt(view.length)} з ${fmt(M.rows.length)} · у пулі ${fmt(M.pool.length)}${M.cfg.keywords?.length?` · сумнівних ${fmt(M.rows.filter(r=>r.sus&&r.n).length)}`:''}`;
  $('pageInfo').textContent=`стор. ${page+1} / ${pages}`;
  $('prev').disabled=page===0; $('next').disabled=page>=pages-1;
  document.querySelectorAll('th[data-k] .ar').forEach(s=>s.textContent='');
  const th=document.querySelector(`th[data-k="${sortK}"] .ar`); if(th) th.textContent=sortDir>0?'↑':'↓';
}
function focusRow(r){
  highlight=r.id; sortK='n'; sortDir=1; $('q').value=String(r.n); $('fPool').value=''; $('fType').value=''; $('fLikes').value='0'; apply();
  const row=$('r'+r.id); if(row) row.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}

/* ---------- старт ---------- */
window.addEventListener('dc-auth-ok', ()=>{
  const id=new URLSearchParams(location.search).get('id');
  if (id) renderPool(id); else renderHome();
});
</script>
</body>
