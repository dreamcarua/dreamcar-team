name: Supabase Deploy

# =====================================================================
# ПЕРЕМІСТИ ЦЕЙ ФАЙЛ:
#   mv tasks/_workflows-to-install/supabase-deploy.yml .github/workflows/supabase-deploy.yml
#   git add -A && git commit -m "ci: install supabase deploy workflow" && git push
#
# (Claude не може писати у .github/workflows/ — потрібен PAT з workflow scope)
#
# Repo secrets (Settings → Secrets and variables → Actions → New):
#   SUPABASE_ACCESS_TOKEN   — https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    — Project → Settings → Database
#   SUPABASE_PROJECT_REF    — wotghlaehnvxyeacznvv
#
# Опційні (для синхронізації Edge runtime secrets):
#   TG_BOT_TOKEN, RESEND_API_KEY, TEAM_HUB_BASE, TG_GROUP_CHAT_ID, CLAUDE_API_KEY
# =====================================================================

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tasks/db/**'
      - 'tasks/supabase/**'
      - 'hq/db/**'
      - 'hq/supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_db_push:
        description: 'Skip migrations'
        type: boolean
        default: false
      skip_functions:
        description: 'Skip Edge Functions'
        type: boolean
        default: false
      function_name:
        description: 'Single function (empty = all)'
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::SUPABASE_PROJECT_REF missing"; exit 1; }

      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" || true

      - name: Consolidate migrations
        if: ${{ !inputs.skip_db_push }}
        run: |
          mkdir -p supabase/migrations
          for src in tasks/db/*.sql hq/db/*.sql; do
            [ -f "$src" ] || continue
            base=$(basename "$src" .sql)
            module=$(echo "$src" | cut -d/ -f1)
            case "$base" in
              reset|seed) continue ;;
            esac
            if ls supabase/migrations/*"${module}_${base}".sql >/dev/null 2>&1; then continue; fi
            ts=$(date -u +%Y%m%d%H%M%S)
            cp "$src" "supabase/migrations/${ts}_${module}_${base}.sql"
            sleep 1
          done

      - name: Push migrations
        if: ${{ !inputs.skip_db_push }}
        run: |
          if [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then echo "No migrations."; exit 0; fi
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Consolidate functions
        if: ${{ !inputs.skip_functions }}
        run: |
          mkdir -p supabase/functions
          for src in tasks/supabase/functions/*/ hq/supabase/functions/*/; do
            [ -d "$src" ] || continue
            name=$(basename "$src")
            mkdir -p "supabase/functions/$name"
            cp -r "$src"* "supabase/functions/$name/" 2>/dev/null || true
          done

      - name: Deploy functions
        if: ${{ !inputs.skip_functions }}
        run: |
          if [ -n "${{ inputs.function_name }}" ]; then
            supabase functions deploy "${{ inputs.function_name }}" --no-verify-jwt --project-ref "$PROJECT_REF"
            exit 0
          fi
          for d in supabase/functions/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            echo "→ Deploying $name"
            supabase functions deploy "$name" --no-verify-jwt --project-ref "$PROJECT_REF" || echo "::warning::failed: $name"
          done

      - name: Sync Edge runtime secrets
        if: ${{ !inputs.skip_functions }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_GROUP_CHAT_ID: ${{ secrets.TG_GROUP_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEAM_HUB_BASE: ${{ secrets.TEAM_HUB_BASE }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set +e
          [ -n "$TG_BOT_TOKEN" ] && supabase secrets set TG_BOT_TOKEN="$TG_BOT_TOKEN" --project-ref "$PROJECT_REF"
          [ -n "$TG_GROUP_CHAT_ID" ] && supabase secrets set TG_GROUP_CHAT_ID="$TG_GROUP_CHAT_ID" --project-ref "$PROJECT_REF"
          [ -n "$RESEND_API_KEY" ] && supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$PROJECT_REF"
          [ -n "$TEAM_HUB_BASE" ] && supabase secrets set TEAM_HUB_BASE="$TEAM_HUB_BASE" --project-ref "$PROJECT_REF"
          [ -n "$CLAUDE_API_KEY" ] && supabase secrets set CLAUDE_API_KEY="$CLAUDE_API_KEY" --project-ref "$PROJECT_REF"
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "### Supabase Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations: $(ls supabase/migrations 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Functions: $(ls -d supabase/functions/*/ 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
