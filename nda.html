<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamCar — NDA · Угода про нерозголошення</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* =================== SCREEN UI =================== */
body {
  font-family: 'Manrope', sans-serif;
  background: #0f0f1a;
  color: #fff;
  min-height: 100vh;
}

.page-header {
  background: #0a0a14;
  border-bottom: 1px solid #1a1a2e;
  padding: 18px 40px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-text { font-size: 15px; font-weight: 700; color: #cc0000; letter-spacing: 1px; }
.logo-sub  { font-size: 11px; color: #444; margin-top: 2px; }
.back-link {
  margin-left: auto;
  font-size: 11px;
  color: #555;
  text-decoration: none;
  border: 1px solid #222;
  padding: 6px 14px;
  border-radius: 6px;
  transition: color 0.15s, border-color 0.15s;
}
.back-link:hover { color: #ccc; border-color: #444; }

.main-wrap { max-width: 920px; margin: 0 auto; padding: 36px 24px 60px; }

.intro-box {
  background: #1a0000;
  border: 1px solid #330000;
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 28px;
}
