<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>DreamCar HQ · Стіл SMM</title>
<script src="config.js"></script>
<script type="module">
  // Lazy-load Supabase SDK тільки якщо є config
  if (window.HQ_CONFIG?.SUPABASE_URL && window.HQ_CONFIG?.SUPABASE_ANON_KEY) {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    window.supabase = createClient(
      window.HQ_CONFIG.SUPABASE_URL,
      window.HQ_CONFIG.SUPABASE_ANON_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );
    window.HQ_BACKEND = true;
  } else {
    window.HQ_BACKEND = false;
  }
  // Signal to the app that loader is done
  window.dispatchEvent(new Event('hq-loader-ready'));
</script>
<style>
  :root {
    --bg: #0a0a12;
    --bg-2: #11111a;
    --bg-3: #161624;
    --bg-4: #1c1c2e;
    --bg-hover: #1f1f33;
    --border: #232338;
    --border-2: #2e2e48;
    --red: #cc0000;
    --red-soft: #ff6577;
    --red-2: #ff9999;
    --red-dim: rgba(204,0,0,0.15);
    --gold: #fbbf24;
    --green: #4ade80;
    --green-soft: #6ee7b7;
    --green-dim: rgba(74,222,128,0.15);
    --blue: #93c5fd;
    --blue-soft: #7ab0ff;
    --orange: #fb923c;
    --purple: #c89af0;
    --grey: #8a8a99;
    --grey-2: #5a5a6a;
    --white: #fff;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: #e8e8f0;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
</style>
