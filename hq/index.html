<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>DreamCar HQ · Стіл SMM</title>
<style>
  :root {
    --bg: #0a0a12;
    --bg-2: #11111a;
    --bg-3: #161624;
    --bg-4: #1c1c2e;
    --bg-hover: #1f1f33;
    --border: #232338;
    --border-2: #2e2e48;
    --red: #cc0000;
    --red-soft: #ff6577;
    --red-2: #ff9999;
    --red-dim: rgba(204,0,0,0.15);
    --gold: #fbbf24;
    --green: #4ade80;
    --green-soft: #6ee7b7;
    --green-dim: rgba(74,222,128,0.15);
    --blue: #93c5fd;
    --blue-soft: #7ab0ff;
    --orange: #fb923c;
    --purple: #c89af0;
    --grey: #8a8a99;
    --grey-2: #5a5a6a;
    --white: #fff;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: #e8e8f0;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--grey-2); }

  /* ============ Layout ============ */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas: "logo topbar" "sidebar main";
    height: 100vh;
  }
  .logo {
    grid-area: logo;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 10px;
  }
  .logo-mark {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--red), var(--red-soft));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 4px 12px -3px rgba(204,0,0,0.5);
  }
  .logo-text { font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
  .logo-text .small { display: block; font-size: 10px; color: var(--grey); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }

  /* Topbar */
  .topbar {
    grid-area: topbar;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  .topbar .breadcrumb {
    font-size: 13px;
    color: var(--grey);
    font-weight: 500;
  }
  .topbar .breadcrumb b { color: #fff; font-weight: 600; }
  .topbar .search {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .topbar .search input {
    width: 100%;
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: #fff;
    padding: 9px 12px 9px 36px;
    border-radius: 8px;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .topbar .search input:focus { outline: none; border-color: var(--red); }
  .topbar .search::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
    pointer-events: none;
  }
  .topbar .actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar .bell {
    position: relative;
    background: var(--bg-3);
    border: 1px solid var(--border);
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .topbar .bell:hover { background: var(--bg-hover); }
  .topbar .bell .badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 8px;
    border: 2px solid var(--bg-2);
  }
  .topbar .role-switch {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  .topbar .role-switch:hover { background: var(--bg-hover); border-color: var(--red); }
  .topbar .role-switch .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #cc0000, #ff6577);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .topbar .role-switch .role-name { font-weight: 600; }
  .topbar .role-switch .role-tag {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--grey);
    padding-left: 6px;
    border-left: 1px solid var(--border-2);
    margin-left: 4px;
  }

  /* Sidebar */
  .sidebar {
    grid-area: sidebar;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    overflow-y: auto;
  }
  .sidebar .nav-section {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--grey-2);
    font-weight: 700;
    padding: 12px 12px 8px;
  }
  .sidebar a.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    color: #aaa;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s;
    position: relative;
  }
  .sidebar a.nav-item:hover { background: var(--bg-hover); color: #fff; }
  .sidebar a.nav-item.active { background: var(--red-dim); color: var(--red-soft); border-color: rgba(204,0,0,0.3); }
  .sidebar a.nav-item .ico { font-size: 16px; width: 20px; text-align: center; }
  .sidebar a.nav-item .count {
    margin-left: auto;
    background: var(--bg-4);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar a.nav-item.active .count { background: var(--red); }
  .sidebar a.nav-item.urgent .count { background: var(--red); color: #fff; }

  .sidebar .filters {
    margin-top: 8px;
    padding: 0 4px;
  }
  .sidebar .filter-group { margin-bottom: 14px; }
  .sidebar .filter-group .filter-label {
    font-size: 10px;
    color: var(--grey-2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    padding: 0 8px;
  }
  .sidebar .filter-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: #aaa;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar .filter-chip:hover { background: var(--bg-hover); color: #fff; }
  .sidebar .filter-chip.on { color: #fff; }
  .sidebar .filter-chip .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sidebar .filter-chip .cnt { margin-left: auto; font-size: 10px; color: var(--grey-2); }

  /* Main */
  .main {
    grid-area: main;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0;
    position: relative;
  }

  /* View header */
  .view-header {
    display: flex;
    align-items: center;
    padding: 18px 28px 14px;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .view-header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .view-header .view-meta { color: var(--grey); font-size: 13px; }
  .view-header .actions { margin-left: auto; display: flex; gap: 8px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    background: var(--bg-3);
    color: #ddd;
    border-color: var(--border);
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-2); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-primary:hover { background: #e60019; border-color: #e60019; color: #fff; }
  .btn-success { background: var(--green); color: #042814; border-color: var(--green); }
  .btn-success:hover { background: #67e88f; border-color: #67e88f; color: #042814; }
  .btn-warn { background: var(--orange); color: #2a1500; border-color: var(--orange); }
  .btn-warn:hover { background: #ff9c4d; border-color: #ff9c4d; }
  .btn-danger { background: transparent; color: var(--red-soft); border-color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }
  .btn-ghost { background: transparent; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 18px; font-size: 14px; }
  .btn-segmented { padding: 6px 14px; font-size: 12px; border-radius: 0; border-right: 1px solid var(--border); }
  .btn-segmented:first-child { border-radius: 8px 0 0 8px; }
  .btn-segmented:last-child { border-radius: 0 8px 8px 0; border-right: 1px solid var(--border); }
  .btn-segmented.on { background: var(--red); color: #fff; border-color: var(--red); }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .segmented .btn-segmented { border: none; border-right: 1px solid var(--border); }
  .segmented .btn-segmented:last-child { border-right: none; }

  /* Toast */
  .toast-stack {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    max-width: 360px;
  }
  .toast {
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    font-size: 13px;
    color: #fff;
    border-left: 3px solid var(--red);
    animation: toastIn 0.3s ease;
  }
  .toast.success { border-left-color: var(--green); }
  .toast.warn { border-left-color: var(--gold); }
  .toast.error { border-left-color: var(--red); }
  .toast.info { border-left-color: var(--blue-soft); }
  .toast b { display: block; margin-bottom: 2px; }
  .toast .toast-body { color: var(--grey); font-size: 12px; line-height: 1.5; }
  @keyframes toastIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    max-width: 1080px;
    width: 100%;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-sm { max-width: 480px; }
  .modal-md { max-width: 720px; }
  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .modal-head h2 { font-size: 17px; font-weight: 700; color: #fff; }
  .modal-head .modal-meta { color: var(--grey); font-size: 12px; }
  .modal-head .close {
    margin-left: auto;
    background: transparent; border: 1px solid var(--border);
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--grey);
    font-size: 18px;
    cursor: pointer;
  }
  .modal-head .close:hover { background: var(--bg-hover); color: #fff; }
  .modal-body {
    padding: 22px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-foot {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: var(--bg);
  }
  .modal-foot .left { margin-right: auto; display: flex; gap: 8px; }

  /* Form */
  .form-grid { display: grid; gap: 14px; }
  .form-row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .form-row-3 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr 1fr; }
  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--grey);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .field label .req { color: var(--red); }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=datetime-local],
  .field input[type=number], .field input[type=url], .field input[type=email], .field textarea, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: #fff;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--red); }
  .field textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .field .hint { font-size: 11px; color: var(--grey); margin-top: 4px; }
  .field.required input:invalid:not(:placeholder-shown) { border-color: var(--red); }

  /* Multi-select chips */
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: #ccc;
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
  }
  .chip:hover { background: var(--bg-hover); }
  .chip.on { background: var(--red-dim); border-color: var(--red); color: var(--red-soft); }

  /* Status badge */
  .status {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .status.draft     { background: #2a2a3a; color: #c8c8d6; border: 1px solid #3a3a4a; }
  .status.in_work   { background: #0a1a3a; color: var(--blue); border: 1px solid #1f3a7a; }
  .status.review    { background: #2a1f00; color: var(--gold); border: 1px solid #5a3f00; }
  .status.approved  { background: #0a2a14; color: var(--green-soft); border: 1px solid #1a5a2e; }
  .status.published { background: #0d5a1e; color: #d1fad7; border: 1px solid var(--green); }
  .status.rework    { background: #2a1a0a; color: var(--orange); border: 1px solid #5a3a1f; }

  /* ============ Calendar ============ */
  .calendar-wrap { padding: 18px 28px 28px; }
  .calendar-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cal-nav { display: flex; gap: 4px; align-items: center; }
  .cal-nav .month-label { font-size: 16px; font-weight: 700; color: #fff; min-width: 200px; text-align: center; }
  .cal-nav button {
    width: 32px; height: 32px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: #ddd;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .cal-nav button:hover { background: var(--bg-hover); border-color: var(--red); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .cal-weekday {
    background: var(--bg-2);
    padding: 10px 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--grey);
    font-weight: 700;
    text-align: center;
  }
  .cal-day {
    background: var(--bg);
    min-height: 120px;
    padding: 8px 8px 6px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal-day:hover { background: var(--bg-3); }
  .cal-day.other-month { background: #060610; opacity: 0.45; }
  .cal-day.today {
    background: rgba(204,0,0,0.06);
  }
  .cal-day.today .day-num {
    background: var(--red);
    color: #fff;
    border-radius: 50%;
    width: 24px; height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .cal-day.drop-over { background: rgba(74,222,128,0.1); border: 1px dashed var(--green); }
  .cal-day .day-num {
    font-size: 12px;
    font-weight: 700;
    color: #aaa;
    margin-bottom: 4px;
  }
  .cal-card {
    background: var(--bg-3);
    border-left: 3px solid var(--grey-2);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    color: #ddd;
    cursor: grab;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: transform 0.1s, border-color 0.15s;
  }
  .cal-card:hover { transform: translateX(2px); }
  .cal-card.dragging { opacity: 0.4; cursor: grabbing; }
  .cal-card.s-draft     { border-left-color: var(--grey); }
  .cal-card.s-in_work   { border-left-color: var(--blue); }
  .cal-card.s-review    { border-left-color: var(--gold); }
  .cal-card.s-approved  { border-left-color: var(--green-soft); }
  .cal-card.s-published { border-left-color: var(--green); }
  .cal-card.s-rework    { border-left-color: var(--orange); }
  .cal-card.urgent-yellow { box-shadow: inset 0 0 0 1px var(--gold); }
  .cal-card.urgent-red { box-shadow: inset 0 0 0 1px var(--red); animation: pulse 1.5s ease-in-out infinite; }
  .cal-card.missed { background: rgba(204,0,0,0.15); }
  @keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 0 1px var(--red); }
    50% { box-shadow: inset 0 0 0 1px var(--red), 0 0 8px rgba(204,0,0,0.4); }
  }
  .cal-card .platform-icons { display: inline-flex; gap: 1px; font-size: 9px; opacity: 0.7; }
  .cal-card .time { color: var(--grey); font-variant-numeric: tabular-nums; }
  .cal-card .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .cal-day .more {
    color: var(--grey);
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .cal-day .more:hover { color: var(--red-soft); }

  /* Week / Day view */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    min-height: 600px;
  }
  .week-col { background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .week-col .col-head { font-size: 11px; color: var(--grey); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-weight: 600; }
  .week-col .col-head.today { color: var(--red-soft); }
  .week-col .day-num { font-size: 18px; font-weight: 800; color: #fff; line-height: 1; }
  .week-col .day-name { text-transform: uppercase; letter-spacing: 1px; font-size: 9px; color: var(--grey); margin-top: 2px; }
  .week-card {
    background: var(--bg-3);
    border-left: 3px solid var(--grey-2);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .week-card:hover { background: var(--bg-hover); }
  .week-card.s-draft     { border-left-color: var(--grey); }
  .week-card.s-in_work   { border-left-color: var(--blue); }
  .week-card.s-review    { border-left-color: var(--gold); }
  .week-card.s-approved  { border-left-color: var(--green-soft); }
  .week-card.s-published { border-left-color: var(--green); }

  /* List view */

  .bulk-bar {

  /* ============ Board (Approvals) ============ */
  .board-wrap { padding: 18px 28px 28px; }

  .board-card {

  .board-card:hover { background: var(--bg-hover); border-color: var(--border-2); }

  .board-card .bc-head { display: flex; align-items: flex-start; gap: 10px; }

  @keyframes pulse2 { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Color swatches */

  }

  /* Dropdown */

  /* Mobile (basic) */
  @media (max-width: 900px) {

    .cal-day { min-height: 80px; padding: 4px; }
    .cal-card { font-size: 9px; padding: 2px 4px; }
  }
</style>
</head>

<script>
/* ====================================================================
   DreamCar HQ — Стіл SMM (Пілот)
   MVP як SPA: HTML + ванільний JS + localStorage
   Архітектура: hash-router → views (Calendar/Board/Library/Launches)
                Store wrapper над localStorage
                Seed-дані при першому старті
   ==================================================================== */

const PLATFORMS = [
  { id: 'ig', name: 'Instagram', icon: '📷', color: '#E1306C' },
  { id: 'tg', name: 'Telegram', icon: '✈️', color: '#0088cc' },
  { id: 'tt', name: 'TikTok', icon: '🎵', color: '#fe2c55' },
  { id: 'th', name: 'Threads', icon: '🧵', color: '#888' },
  { id: 'yt', name: 'YT Shorts', icon: '▶️', color: '#ff0000' },
  { id: 'fb', name: 'Facebook', icon: '📘', color: '#1877f2' },
];
const PLATFORM_BY_ID = Object.fromEntries(PLATFORMS.map(p => [p.id, p]));

const STATUSES = [
  { id: 'draft', label: 'Чернетка', color: 'var(--grey)' },
  { id: 'in_work', label: 'В роботі', color: 'var(--blue)' },
  { id: 'review', label: 'На погодженні', color: 'var(--gold)' },
  { id: 'approved', label: 'Погоджено', color: 'var(--green-soft)' },
  { id: 'published', label: 'Опубліковано', color: 'var(--green)' },
  { id: 'rework', label: 'На доопрацюванні', color: 'var(--orange)' },
];
const STATUS_BY_ID = Object.fromEntries(STATUSES.map(s => [s.id, s]));

const CONTENT_TYPES = ['Пост', 'Reels', 'Сторис', 'Карусель', 'Лонгрід'];
const ROLES = [
  { id: 'ceo',    label: 'CEO',         tag: 'CEO' },
  { id: 'coo',    label: 'COO',         tag: 'COO' },
  { id: 'lead',   label: 'Тимлід SMM',  tag: 'Тимлід' },
  { id: 'member', label: 'SMM-учасник', tag: 'Учасник' },
];

/* ============ Store ============ */
const STORE_KEY = 'dreamcar_hq_v1';

const Store = {
  _data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      this._data = raw ? JSON.parse(raw) : null;
    } catch(e) { this._data = null; }
    if (!this._data) { this._data = SEED(); this.save(); }
    return this._data;
  },
  save() { localStorage.setItem(STORE_KEY, JSON.stringify(this._data)); },
  reset() { localStorage.removeItem(STORE_KEY); this._data = null; this.load(); },
  data() { return this._data; },

  // Publications
  pubs() { return this._data.publications; },
  pub(id) { return this._data.publications.find(p => p.id === id); },
  upsertPub(pub) {
    const ix = this._data.publications.findIndex(p => p.id === pub.id);
    if (ix >= 0) this._data.publications[ix] = pub;
    else this._data.publications.push(pub);
    this.save();
  },
  deletePub(id) {
    this._data.publications = this._data.publications.filter(p => p.id !== id);
    this.save();
  },

  // Creatives
  creatives() { return this._data.creatives; },
  creative(id) { return this._data.creatives.find(c => c.id === id); },

  // Users
  users() { return this._data.users; },
  user(id) { return this._data.users.find(u => u.id === id); },

  // Rubrics
  rubrics() { return this._data.rubrics; },

  // Launches
  launches() { return this._data.launches; },

  // Current user
  currentUser() { return this.user(this._data.currentUserId); },
  setCurrentUser(id) { this._data.currentUserId = id; this.save(); },

  // History
  addHistory(pubId, action, detail = '') {
    const pub = this.pub(pubId);
    if (!pub) return;
    if (!pub.history) pub.history = [];
    pub.history.push({
      id: uid(),
      at: new Date().toISOString(),
      author: this._data.currentUserId,
      action,
      detail
    });
    this.save();
  },

  // Comments
  addComment(pubId, body) {
    const pub = this.pub(pubId);
    if (!pub) return;
    if (!pub.comments) pub.comments = [];
    pub.comments.push({
      id: uid(),
      at: new Date().toISOString(),
      author: this._data.currentUserId,
      body
    });
    this.save();
  },
};

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

/* ============ Seed ============ */
function SEED() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const userIds = {
    vadym: 'u_vadym', danil: 'u_danil', oleksandra: 'u_oleks', artem: 'u_artem', vira: 'u_vira',
  };
  const users = [
    { id: userIds.vadym,      name: 'Вадим',       role: 'ceo',    email: 'vg@dreamcar.ua',    initial: 'В' },
    { id: userIds.danil,      name: 'Даніл',       role: 'coo',    email: 'danil@dreamcar.ua', initial: 'Д' },

/* ============ Toast ============ */
function toast(msg, kind = 'success', body = '') {
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<b>${escapeHtml(msg)}</b>${body ? '<div class="toast-body">'+escapeHtml(body)+'</div>' : ''}`;
  stack.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all 0.3s'; }, 3000);
  setTimeout(() => el.remove(), 3400);
}

/* ============ Modal ============ */
const Modal = {
  open(html, size = '') {
    const bd = document.getElementById('modalBackdrop');
    const m = document.getElementById('modal');
    m.className = 'modal' + (size ? ' ' + size : '');
    m.innerHTML = html;
    bd.classList.add('open');
    bd.onclick = (e) => { if (e.target === bd) this.close(); };
    document.addEventListener('keydown', this._esc);
  },
  close() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.removeEventListener('keydown', this._esc);
    if (this.onClose) { this.onClose(); this.onClose = null; }
  },
  _esc: function(e) { if (e.key === 'Escape') Modal.close(); },
};

/* ============ Router ============ */
function parseHash() {
  const h = (location.hash || '#calendar').slice(1);
  const [route, ...args] = h.split('/');
  return { route, args };
}
function navigate() {
  const { route, args } = parseHash();
  App.view = route;
  document.querySelectorAll('.sidebar a.nav-item').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
  const main = document.getElementById('main');
  const bc = document.getElementById('breadcrumb');
  if (route === 'calendar') { bc.innerHTML = 'Стіл SMM · <b>Календар</b>'; renderCalendar(main); }
  else if (route === 'board') { bc.innerHTML = 'Стіл SMM · <b>Дошка погоджень</b>'; renderBoard(main); }
  else if (route === 'library') { bc.innerHTML = 'Стіл SMM · <b>Бібліотека креативів</b>'; renderLibrary(main); }
  else if (route === 'launches') { bc.innerHTML = 'Стіл SMM · <b>Запуски</b>'; renderLaunches(main); }
  else if (route === 'publication' && args[0]) { openCard(args[0]); }
  else { bc.innerHTML = 'Стіл SMM · <b>Календар</b>'; renderCalendar(main); }
  updateNavCounts();
}

/* ============ Apply filters ============ */
function filteredPubs() {
  let pubs = Store.pubs();
  if (App.filters.statuses.size > 0) pubs = pubs.filter(p => App.filters.statuses.has(p.status));
  if (App.filters.platforms.size > 0) pubs = pubs.filter(p => p.platforms.some(pl => App.filters.platforms.has(pl)));
  if (App.searchQuery) {
    const q = App.searchQuery.toLowerCase();
    pubs = pubs.filter(p => (p.title + ' ' + (p.text||'') + ' ' + (p.hashtags||[]).join(' ')).toLowerCase().includes(q));
  }
  return pubs;
}

/* ============ Helpers ============ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}
function fmtDate(d, opts = {}) {
  const dt = (d instanceof Date) ? d : new Date(d);
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const yyyy = dt.getFullYear();
  if (opts.short) return `${dd}.${mm}`;
  if (opts.long)  return dt.toLocaleDateString('uk-UA', { day:'numeric', month:'long', year:'numeric' });
  return `${dd}.${mm}.${yyyy}`;
}
function fmtTime(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
}
function fmtDateTime(d) { return fmtDate(d) + ' ' + fmtTime(d); }
function daysBetween(a, b) {
  const A = new Date(a); A.setHours(0,0,0,0);
  const B = new Date(b); B.setHours(0,0,0,0);
  return Math.round((B - A) / 86400000);
}
function urgencyClass(pub) {
  const dt = new Date(pub.dateTime);
  const today = new Date(); today.setHours(0,0,0,0);
  const dl = new Date(dt); dl.setHours(0,0,0,0);
  const diff = (dl - today) / 86400000;
  if (pub.status === 'published') return '';
  if (diff < 0) return 'missed';
  if (diff <= 1 && pub.status !== 'approved') return 'urgent-red';
  if (diff <= 3 && pub.status !== 'approved') return 'urgent-yellow';
  return '';
}
function platformIcons(ids) {
  return '<span class="platform-icons">' + ids.map(id => PLATFORM_BY_ID[id]?.icon || '').join('') + '</span>';
}

function navCal(delta) {
  if (App.calendarMode === 'month') {
    App.calendarDate = new Date(App.calendarDate.getFullYear(), App.calendarDate.getMonth() + delta, 1);
  } else if (App.calendarMode === 'week') {
    App.calendarDate = addDays(App.calendarDate, delta * 7);
  } else if (App.calendarMode === 'day') {
    App.calendarDate = addDays(App.calendarDate, delta);
  }
  renderCalBody();
}
function renderCalBody() {
  const body = document.getElementById('calBody');
  const meta = document.getElementById('calMeta');
  const label = document.getElementById('monthLabel');
  const pubs = filteredPubs();

  if (App.calendarMode === 'month') {
    const d = App.calendarDate;
    label.textContent = d.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });
    meta.textContent = `· ${pubs.length} публікацій`;
    body.innerHTML = renderMonth(d, pubs);
    attachCalendarHandlers();
  } else if (App.calendarMode === 'week') {
    const start = startOfWeek(App.calendarDate);
    const end = addDays(start, 6);
    label.textContent = `${fmtDate(start, {short:true})} — ${fmtDate(end, {short:true})}`;
    meta.textContent = '';
    body.innerHTML = renderWeek(start, pubs);
    attachWeekHandlers();
  } else if (App.calendarMode === 'day') {
    label.textContent = fmtDate(App.calendarDate, {long:true});
    meta.textContent = '';
    body.innerHTML = renderDay(App.calendarDate, pubs);
    attachWeekHandlers();
  } else if (App.calendarMode === 'list') {
    label.textContent = 'Усі публікації';
    meta.textContent = `· ${pubs.length} рядків`;
    body.innerHTML = renderList(pubs);
    attachListHandlers();
  }
}
function startOfWeek(d) {
  const x = new Date(d);
  const dayOfWeek = x.getDay() === 0 ? 7 : x.getDay();
  x.setDate(x.getDate() - (dayOfWeek - 1));
  x.setHours(0,0,0,0);
  return x;
}
function renderMonth(d, pubs) {
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = startOfWeek(first);
  const today = new Date(); today.setHours(0,0,0,0);
  const weekdays = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','НД'];
  let html = '<div class="calendar-grid">';
  for (const w of weekdays) html += `<div class="cal-weekday">${w}</div>`;
  for (let i = 0; i < 42; i++) {
    const day = addDays(start, i);
    const isOther = day.getMonth() !== d.getMonth();
    const isToday = day.getTime() === today.getTime();
    const dayPubs = pubs.filter(p => sameDate(p.dateTime, day)).sort((a,b)=> new Date(a.dateTime) - new Date(b.dateTime));
    const cards = dayPubs.slice(0,3).map(p => `
      <div class="cal-card s-${p.status} ${urgencyClass(p)}" draggable="true" data-id="${p.id}" title="${escapeHtml(p.title)}">
        <span class="time">${fmtTime(p.dateTime)}</span>
        ${platformIcons(p.platforms)}
        <span class="title">${escapeHtml(p.title)}</span>
      </div>
    `).join('');
    const more = dayPubs.length > 3 ? `<span class="more" data-date="${day.toISOString().slice(0,10)}">+${dayPubs.length-3} ще</span>` : '';
    html += `<div class="cal-day ${isOther?'other-month':''} ${isToday?'today':''}" data-date="${day.toISOString().slice(0,10)}">
      <div class="day-num">${day.getDate()}</div>${cards}${more}</div>`;
  }
  html += '</div>';
  return html;
}
function sameDate(a, b) {
  const A = new Date(a), B = new Date(b);
  return A.getFullYear() === B.getFullYear() && A.getMonth() === B.getMonth() && A.getDate() === B.getDate();
}
function attachCalendarHandlers() {
  // click on day = create
  document.querySelectorAll('.cal-day').forEach(el => {
    el.onclick = (e) => {
      if (e.target.classList.contains('cal-card') || e.target.closest('.cal-card')) return;
      if (e.target.classList.contains('more')) return;
      createPub(new Date(el.dataset.date + 'T12:00:00'));
    };
    // dragover/drop
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('drop-over'); };
    el.ondragleave = () => el.classList.remove('drop-over');
    el.ondrop = (e) => {
      e.preventDefault();
      el.classList.remove('drop-over');
      const pid = e.dataTransfer.getData('text/plain');
      const p = Store.pub(pid);
      if (!p) return;
      const oldDate = fmtDate(p.dateTime);
      const newDt = new Date(el.dataset.date + 'T' + fmtTime(p.dateTime) + ':00');
      p.dateTime = newDt.toISOString();
      p.updatedAt = new Date().toISOString();
      Store.upsertPub(p);
      Store.addHistory(p.id, 'move', `${oldDate} → ${fmtDate(newDt)}`);
      toast('Перенесено', 'success', `${p.title} → ${fmtDate(newDt)}`);
      renderCalBody();
    };
  });
  // drag start
  document.querySelectorAll('.cal-card[draggable]').forEach(el => {
    el.ondragstart = (e) => {
      e.dataTransfer.setData('text/plain', el.dataset.id);
      el.classList.add('dragging');
    };
    el.ondragend = () => el.classList.remove('dragging');
    el.onclick = (e) => { e.stopPropagation(); location.hash = '#publication/' + el.dataset.id; };
  });
  document.querySelectorAll('.more').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      App.calendarMode = 'day';
      App.calendarDate = new Date(el.dataset.date);
      renderCalendar(document.getElementById('main'));
    };
  });
}

      location.hash = '#publication/' + tr.dataset.id;

  });

  });

    if (selAll.checked) filteredPubs().forEach(p => App.selectedPubs.add(p.id));

  };
  // Bulk actions
  const bulkShift = document.getElementById('bulkShift');
  if (bulkShift) bulkShift.onclick = () => {
    const n = parseInt(prompt('Перенести на скільки днів? (+ вперед, − назад)', '7'), 10);
    if (!n) return;
    for (const id of App.selectedPubs) {
      const p = Store.pub(id); if (!p) continue;
      const d = new Date(p.dateTime); d.setDate(d.getDate() + n);
      p.dateTime = d.toISOString();
      Store.upsertPub(p);
      Store.addHistory(id, 'move', `Bulk shift ${n}d`);
    }
    toast(`Перенесено ${App.selectedPubs.size} публікацій`, 'success');
    App.selectedPubs.clear();
    renderCalBody();
  };
  const bulkDelete = document.getElementById('bulkDelete');
  if (bulkDelete) bulkDelete.onclick = () => {
    if (!confirm(`Видалити ${App.selectedPubs.size} публікацій? Це необоротно.`)) return;
    for (const id of App.selectedPubs) Store.deletePub(id);
    toast(`Видалено ${App.selectedPubs.size}`, 'warn');
    App.selectedPubs.clear();
    renderCalBody();
    updateNavCounts();
    renderSidebarFilters();
  };
  const bulkRubric = document.getElementById('bulkRubric');
  if (bulkRubric) bulkRubric.onclick = () => {
    const options = Store.rubrics().map(r => r.id + ' — ' + r.name).join('\n');
    const v = prompt('Введи ID нової рубрики:\n' + options, 'r_news');
    if (!v) return;
    if (!Store.rubrics().find(r=>r.id===v)) { toast('Невідомий ID', 'error'); return; }
    for (const id of App.selectedPubs) {
      const p = Store.pub(id); if (!p) continue;
      p.rubric = v;
      Store.upsertPub(p);
    }
    toast(`Змінено рубрику для ${App.selectedPubs.size}`, 'success');
    App.selectedPubs.clear();
    renderCalBody();
  };
  const bulkClear = document.getElementById('bulkClear');
  if (bulkClear) bulkClear.onclick = () => { App.selectedPubs.clear(); renderCalBody(); };
}

function boardCard(p) {
  const cr = (p.creatives||[]).map(id => Store.creative(id)).filter(Boolean);
  const thumb = cr[0] ? cr[0].preview : '📝';
  const urgency = urgencyClass(p);
  const dueLabel = (() => {
    const diff = daysBetween(new Date(), p.dateTime);
    if (diff < 0) return { txt: 'Пропущено: ' + fmtDate(p.dateTime), cls: 'due-now' };
    if (diff === 0) return { txt: 'Сьогодні о ' + fmtTime(p.dateTime), cls: 'due-now' };
    if (diff === 1) return { txt: 'Завтра ' + fmtTime(p.dateTime), cls: 'due-soon' };
    if (diff <= 3) return { txt: 'Через ' + diff + ' дні · ' + fmtDate(p.dateTime), cls: 'due-soon' };
    return { txt: fmtDate(p.dateTime) + ' · ' + fmtTime(p.dateTime), cls: '' };
  })();
  const respNames = (p.responsibles||[]).map(id => Store.user(id)?.name).filter(Boolean).join(', ');
  return `<div class="board-card ${urgency}" data-id="${p.id}">
    <div class="bc-head">
      <div class="bc-thumb">${thumb}</div>
      <div class="bc-body">
        <div class="bc-title">${escapeHtml(p.title)}</div>
        <div class="bc-meta">${platformIcons(p.platforms)} · ${p.contentType} · ${respNames}</div>
      </div>
    </div>
    <div class="bc-date ${dueLabel.cls}" style="margin-top:8px;">📅 ${dueLabel.txt}</div>
    <div class="bc-actions">
      <button class="btn btn-success btn-sm" data-action="approve" data-id="${p.id}">✓ Погодити</button>
      <button class="btn btn-warn btn-sm" data-action="reject" data-id="${p.id}">↩ Повернути</button>
      <button class="btn btn-sm" data-action="open" data-id="${p.id}">Відкрити</button>
    </div>
  </div>`;
}
function attachBoardHandlers() {
  document.querySelectorAll('.board-card').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('button')) return;
      location.hash = '#publication/' + el.dataset.id;
    };
  });
  document.querySelectorAll('.board-card [data-action]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const action = b.dataset.action;
      const id = b.dataset.id;
      if (action === 'open') location.hash = '#publication/' + id;
      else if (action === 'approve') approvePub(id);
      else if (action === 'reject') rejectPub(id);
    };
  });
}
function approvePub(id) {
  const p = Store.pub(id); if (!p) return;
  const me = Store.currentUser();
  if (!(p.approvers||[]).includes(me.id)) { toast('Тільки погоджувач може затвердити', 'error'); return; }
  const comment = prompt('Коментар (опційно):', '');
  p.status = 'approved'; p.updatedAt = new Date().toISOString();
  Store.upsertPub(p);
  Store.addHistory(id, 'approve', comment || '');
  if (comment) Store.addComment(id, comment);
  toast('Погоджено', 'success', p.title);
  navigate();
}
function rejectPub(id) {
  const p = Store.pub(id); if (!p) return;
  const me = Store.currentUser();
  if (!(p.approvers||[]).includes(me.id)) { toast('Тільки погоджувач може повернути', 'error'); return; }
  const comment = prompt('Чому повертаєш? (обов\'язково)', '');
  if (!comment || !comment.trim()) { toast('Коментар обов\'язковий', 'warn'); return; }
  p.status = 'rework'; p.updatedAt = new Date().toISOString();
  Store.upsertPub(p);
  Store.addHistory(id, 'reject', comment);
  Store.addComment(id, comment);
  toast('Повернено на доопрацювання', 'warn', p.title);
  navigate();
}

    platforms: [],
    rubric: '',
    contentType: 'Пост',
    text: '',
    hashtags: [],

    approvers: [Store.users().find(u=>u.role==='ceo').id],
    approverPolicy: 'all',

}

function renderCommentsTab(p) {
  const list = (p.comments||[]).map(c => {
    const u = Store.user(c.author);
    return `<div class="comment">
      <div class="c-head"><span class="c-author">${u?.name||'?'}</span><span class="c-time">${fmtDateTime(c.at)}</span></div>
      <div class="c-body">${escapeHtml(c.body)}</div>
    </div>`;
  }).join('') || '<div style="color:var(--grey);font-size:12px;padding:8px 0;">Немає коментарів.</div>';
  return `<div id="commentsList">${list}</div>
    <div class="comment-input">
      <input id="newComment" placeholder="Додати коментар…"/>
      <button class="btn btn-primary btn-sm" id="addCommentBtn">Надіслати</button>
    </div>`;
}
function renderHistoryTab(p) {
  const items = (p.history||[]).slice().reverse().map(h => {
    const u = Store.user(h.author);
    const actionMap = { create:'створив(ла) публікацію', status:'змінив(ла) статус →', approve:'погодив(ла)', reject:'повернув(ла) на доопрацювання', move:'переніс(ла) дату', edit:'відредагував(ла)' };
    return `<div class="history-item">
      <span class="h-time">${fmtDateTime(h.at)}</span>
      <span class="h-author">${u?.name||'?'}</span>
      <span class="h-action">${actionMap[h.action]||h.action}</span>
      ${h.detail?'<span class="h-detail">'+escapeHtml(h.detail)+'</span>':''}
    </div>`;
  }).join('') || '<div style="color:var(--grey);font-size:12px;padding:8px 0;">Історія порожня.</div>';
  return items;
}
function renderCardWorkflowButtons(p, me) {
  const transitions = [];
  const isResp = (p.responsibles||[]).includes(me.id) || me.role === 'lead';
  const isAppr = (p.approvers||[]).includes(me.id);
  if (p.status === 'draft' && isResp) transitions.push({ to:'in_work', label:'Взяти в роботу', cls:'btn' });
  if (p.status === 'in_work' && isResp) transitions.push({ to:'review', label:'→ На погодження', cls:'btn-primary' });
  if (p.status === 'review' && isAppr) {
    transitions.push({ to:'approved', label:'✓ Погодити', cls:'btn-success' });
    transitions.push({ to:'rework', label:'↩ Повернути', cls:'btn-warn' });
  }
  if (p.status === 'rework' && isResp) transitions.push({ to:'review', label:'→ На погодження', cls:'btn-primary' });
  if (p.status === 'approved' && (isResp || isAppr)) transitions.push({ to:'published', label:'🚀 Позначити опублікованою', cls:'btn-success' });
  return `<button class="btn" onclick="Modal.close()">Закрити</button>` +
    transitions.map(t => `<button class="btn ${t.cls}" data-transition="${t.to}">${t.label}</button>`).join('');
}
function attachCardHandlers(p) {
  // chips: platforms
  document.querySelectorAll('#f_platforms .chip').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.platform;
      const ix = p.platforms.indexOf(id);
      if (ix >= 0) p.platforms.splice(ix, 1);
      else p.platforms.push(id);
      c.classList.toggle('on');
      autosave(p);
    };
  });
  // chips: responsibles
  document.querySelectorAll('#f_resp .chip').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.user;
      const ix = p.responsibles.indexOf(id);
      if (ix >= 0) p.responsibles.splice(ix, 1);
      else p.responsibles.push(id);
      c.classList.toggle('on');
      autosave(p);
    };
  });
  // chips: approvers
  document.querySelectorAll('#f_appr .chip').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.user;
      const ix = p.approvers.indexOf(id);
      if (ix >= 0) p.approvers.splice(ix, 1);
      else p.approvers.push(id);
      c.classList.toggle('on');
      autosave(p);
    };
  });
  // simple fields
  const fields = [
    ['f_title','title','text'],['f_text','text','text'],['f_rubric','rubric','select'],
    ['f_contentType','contentType','select'],['f_deadline','deadline','date'],
    ['f_launch','launch','select'],
  ];
  fields.forEach(([fid, key]) => {
    const el = document.getElementById(fid);
    if (!el) return;
    el.oninput = () => { p[key] = el.value; autosave(p); };
    el.onchange = () => { p[key] = el.value; autosave(p); };
  });
  const dtEl = document.getElementById('f_dateTime');
  if (dtEl) dtEl.onchange = () => {
    p.dateTime = new Date(dtEl.value).toISOString();
    autosave(p);
  };
  const hashEl = document.getElementById('f_hashtags');
  if (hashEl) hashEl.oninput = () => {
    p.hashtags = hashEl.value.split(/\s+/).filter(Boolean);
    autosave(p);
  };
  const textCount = () => {
    const el = document.getElementById('f_textCount');
    if (el) el.textContent = (document.getElementById('f_text').value||'').length;
  };
  document.getElementById('f_text').oninput = () => { p.text = document.getElementById('f_text').value; textCount(); autosave(p); };

  // creatives strip
  document.querySelectorAll('#f_creatives .cs-remove').forEach(rb => {
    rb.onclick = (e) => {
      e.stopPropagation();
      const cid = rb.dataset.remove;
      p.creatives = (p.creatives||[]).filter(x => x !== cid);
      rb.closest('.cs-item').remove();
      autosave(p);
    };
  });
  document.getElementById('addCreativeBtn').onclick = () => openCreativePicker(p);

  // tabs
  document.querySelectorAll('#cardTabs .tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('#cardTabs .tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const cont = document.getElementById('tabContent');
      if (t.dataset.tab === 'comments') {
        cont.innerHTML = renderCommentsTab(p);
        bindComments(p);
      } else {
        cont.innerHTML = renderHistoryTab(p);
      }
    };
  });
  bindComments(p);

  // workflow buttons
  document.querySelectorAll('[data-transition]').forEach(b => {
    b.onclick = () => transitionStatus(p, b.dataset.transition);
  });

  // delete
  document.getElementById('btnDelete').onclick = () => {
    if (!confirm('Видалити публікацію «' + p.title + '»? Це необоротно.')) return;
    if (!p._isNew) Store.deletePub(p.id);
    Modal.close();
    toast('Видалено', 'warn');
    location.hash = '#calendar';
  };
}
function bindComments(p) {
  const btn = document.getElementById('addCommentBtn');
  const inp = document.getElementById('newComment');
  if (!btn || !inp) return;
  const submit = () => {
    const v = inp.value.trim();
    if (!v) return;
    Store.addComment(p.id, v);
    inp.value = '';
    // re-render comments
    const cont = document.getElementById('tabContent');
    cont.innerHTML = renderCommentsTab(p);
    bindComments(p);
    toast('Коментар додано', 'success');
  };
  btn.onclick = submit;
  inp.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
}
function openCreativePicker(p) {
  const used = new Set(p.creatives||[]);
  Modal.open(`
    <div class="modal-head">
      <h2>Обрати креатив</h2>
      <button class="close" onclick="reopenCard('${p.id}')">×</button>
    </div>
    <div class="modal-body">
      <div class="library-grid">
        ${Store.creatives().map(c => `
          <div class="lib-tile" data-pick="${c.id}" style="${used.has(c.id)?'opacity:0.5;outline:2px solid var(--green);':''}">
            <div class="lt-preview" style="background:linear-gradient(135deg, ${c.color}33, transparent)">${c.preview}<div class="lt-type-badge">${c.type}</div></div>
            <div class="lt-info">
              <div class="lt-name">${escapeHtml(c.name)}</div>
              <div class="lt-meta">${c.size}${c.duration?' · '+formatDur(c.duration):''}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="reopenCard('${p.id}')">Готово</button></div>
  `, 'modal-md');
  document.querySelectorAll('.lib-tile[data-pick]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.pick;
      if (used.has(id)) {
        p.creatives = (p.creatives||[]).filter(x => x !== id);
        used.delete(id);
        el.style.opacity = '1';
        el.style.outline = '';
      } else {
        p.creatives = [...(p.creatives||[]), id];
        used.add(id);
        el.style.outline = '2px solid var(--green)';
        el.style.opacity = '0.7';
      }
      autosave(p);
    };
  });
}
function reopenCard(id) { Modal.close(); setTimeout(()=>openCard(id), 100); }

function autosave(p) {
  const ind = document.getElementById('autosaveInd');
  const txt = document.getElementById('autosaveText');
  if (ind) { ind.className = 'autosave saving'; txt.textContent = 'Зберігаю…'; }
  if (cardAutosaveTimer) clearTimeout(cardAutosaveTimer);
  cardAutosaveTimer = setTimeout(() => {
    p.updatedAt = new Date().toISOString();
    if (p._isNew) { delete p._isNew; }
    Store.upsertPub(p);
    if (ind) { ind.className = 'autosave saved'; txt.textContent = 'Збережено о ' + fmtTime(new Date()); }
    // update title in header
    const ct = document.getElementById('cardTitle');
    if (ct) ct.textContent = p.title || 'Нова публікація';
  }, 700);
}

function transitionStatus(p, to) {
  // Validation
  if (to === 'review') {
    const missing = [];
    if (!p.title) missing.push('Назва');
    if (!p.platforms.length) missing.push('Майданчики');
    if (!p.rubric) missing.push('Рубрика');
    if (!p.text) missing.push('Текст');
    if (p.contentType !== 'Лонгрід' && (!p.creatives || !p.creatives.length)) missing.push('Креативи');
    if (missing.length) { toast('Не вистачає полів', 'error', missing.join(', ')); return; }
  }
  if (to === 'rework' || to === 'approved') {
    const me = Store.currentUser();
    if (!p.approvers.includes(me.id)) { toast('Тільки погоджувач може це робити', 'error'); return; }
  }
  if (to === 'rework') {
    const c = prompt('Чому повертаєш? (обов\'язково)', '');
    if (!c || !c.trim()) { toast('Коментар обов\'язковий', 'warn'); return; }
    Store.addComment(p.id, c);
    Store.addHistory(p.id, 'reject', c);
  } else if (to === 'approved') {
    const c = prompt('Коментар (опційно):', '');
    if (c) Store.addComment(p.id, c);
    Store.addHistory(p.id, 'approve', c||'');
  } else {
    Store.addHistory(p.id, 'status', `${STATUS_BY_ID[p.status].label} → ${STATUS_BY_ID[to].label}`);
  }
  p.status = to;
  p.updatedAt = new Date().toISOString();
  Store.upsertPub(p);
  toast('Статус: ' + STATUS_BY_ID[to].label, 'success');
  Modal.close();
  navigate();
}

function createPub(date) {
  const p = newPubObject();
  if (date) p.dateTime = new Date(date).toISOString();
  Store.upsertPub(p);
  delete p._isNew;
  location.hash = '#publication/' + p.id;
}

document.getElementById('roleSwitch').onclick = () => {
  // Build dropdown
  const me = Store.currentUser();
  const users = Store.users();
  const items = users.map(u => `<div class="dropdown-item" data-user="${u.id}">${avatarHtml(u.id, 22)} ${escapeHtml(u.name)} <span style="margin-left:auto;color:var(--grey);font-size:10px;text-transform:uppercase;">${ROLES.find(r=>r.id===u.role)?.tag}</span></div>`).join('');
  const w = `
    <div class="modal-head">
      <h2>Перемкнути роль (демо)</h2>
      <span class="modal-meta">Без реальної авторизації</span>
      <button class="close" onclick="Modal.close()">×</button>
    </div>
    <div class="modal-body" style="padding:8px;">${items}</div>
  `;
  Modal.open(w, 'modal-sm');
  document.querySelectorAll('.dropdown-item[data-user]').forEach(el => {
    el.onclick = () => {
      Store.setCurrentUser(el.dataset.user);
      renderRoleBadge();
      navigate();
      Modal.close();
      toast('Роль перемкнено', 'info', Store.currentUser().name);
    };
  });
};

/* ============ Bell (notifications mock) ============ */
document.getElementById('bellBtn').onclick = () => {
  const me = Store.currentUser();
  const board = Store.pubs().filter(p => p.status === 'review' && (p.approvers||[]).includes(me.id));
  const missed = Store.pubs().filter(p => urgencyClass(p) === 'missed');
  const urgent = Store.pubs().filter(p => urgencyClass(p) === 'urgent-red');
  const items = [];
  for (const p of board) items.push({ icon:'✅', title:'Чекає твого погодження', body:p.title, link:'#publication/'+p.id });
  for (const p of urgent) items.push({ icon:'🔥', title:'Горить, статус не «Погоджено»', body:p.title, link:'#publication/'+p.id });
  for (const p of missed) items.push({ icon:'⚠️', title:'Пропущена публікація', body:p.title, link:'#publication/'+p.id });
  if (!items.length) items.push({ icon:'🌿', title:'Усе тихо', body:'Жодних нових сповіщень', link:null });
  Modal.open(`
    <div class="modal-head"><h2>Сповіщення</h2><span class="modal-meta">${items.length} активних</span><button class="close" onclick="Modal.close()">×</button></div>
    <div class="modal-body" style="padding:8px;">
      ${items.map(i => `<div class="dropdown-item" ${i.link?`onclick="location.hash='${i.link}'; Modal.close()"`:''}>
        <div style="font-size:18px">${i.icon}</div>
        <div><div style="font-weight:600;color:#fff">${escapeHtml(i.title)}</div><div style="font-size:11px;color:var(--grey)">${escapeHtml(i.body)}</div></div>
      </div>`).join('')}
    </div>
  `, 'modal-sm');
};

/* ============ Search ============ */
document.getElementById('globalSearch').oninput = (e) => {
  App.searchQuery = e.target.value;
  if (['calendar','board','library'].includes(App.view)) navigate();
};

/* ============ Keyboard shortcuts ============ */
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'c' || e.key === 'C') { createPub(new Date()); }
  else if (e.key === '/') { e.preventDefault(); document.getElementById('globalSearch').focus(); }
  else if (e.key === '1') { App.calendarMode = 'month'; renderCalendar(document.getElementById('main')); }
  else if (e.key === '2') { App.calendarMode = 'week'; renderCalendar(document.getElementById('main')); }
  else if (e.key === '3') { App.calendarMode = 'day'; renderCalendar(document.getElementById('main')); }
  else if (e.key === '4') { App.calendarMode = 'list'; renderCalendar(document.getElementById('main')); }
});

/* ============ Bootstrap ============ */
Store.load();
renderRoleBadge();
renderSidebarFilters();
if (!location.hash) location.hash = '#calendar';
navigate();

// Reset for testing
window.HQ = {
  reset() { Store.reset(); location.reload(); },
  seed: SEED,
  store: Store,
};
console.log('%cDreamCar HQ %cv0.1', 'color:#cc0000;font-weight:800;font-size:14px;', 'color:#888;');
console.log('Команди консолі: HQ.reset() — скинути дані. HQ.store — інспектор.');
</script>
