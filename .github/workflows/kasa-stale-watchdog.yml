name: Kasa Stale-Sync Watchdog

# Щоденний вартовий застряглих банк-рахунків Каси.
# Викликає RPC kasa_stale_accounts (рахунки з живим балансом, але без нових
# транзакцій 3+ дн — тобто синк банку впав, а ФОП-надходження занижені).
# Якщо є — шле DM Вадиму через @dreamcar_team_bot (той самий бот, що cowork-notify).
#
# Чому окремий workflow, а не pg_cron: TG-доставка простіша з GitHub Actions
# (bot token у secrets, без зберігання в БД), і легко тестувати workflow_dispatch.
#
# Secrets (вже є в repo): TG_BOT_TOKEN, TG_CHAT_ID.
# SUPABASE_URL + anon key — публічні (RPC має GRANT anon, RLS не зачіпається).

on:
  schedule:
    - cron: '0 8 * * *'    # щоденно 08:00 UTC (~11:00 Kyiv)
  workflow_dispatch:        # ручний запуск для тесту

concurrency:
  group: kasa-stale-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query stale accounts and alert
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          SB_URL="https://wotghlaehnvxyeacznvv.supabase.co"
          SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvdGdobGFlaG52eHllYWN6bnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MDc4NjgsImV4cCI6MjA5NDE4Mzg2OH0.Se-y1WawsdSkMLXj7G_O-Kq-jVfjUOBD3KJOvemCR3A"

          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::error::Missing TG_BOT_TOKEN or TG_CHAT_ID"
            exit 1
          fi

          RESP=$(curl -s -X POST "$SB_URL/rest/v1/rpc/kasa_stale_accounts" \
            -H "apikey: $SB_ANON" \
            -H "Authorization: Bearer $SB_ANON" \
            -H "Content-Type: application/json" \
            -d '{"p_days":3}')
          echo "RPC response: $RESP"

          COUNT=$(echo "$RESP" | jq 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)
          if [ "$COUNT" = "0" ]; then
            echo "OK: no stale accounts"
            exit 0
          fi
          echo "Found $COUNT stale account(s) — alerting"

          NL=$'\n'
          LINES=$(echo "$RESP" | jq -r '.[] | "• <b>\(.name)</b>: тиша \(.days_stale) дн (остання \(.last_tx)), баланс живий \(.api_balance|floor)грн"')
          MSG="⚠️ <b>Каса · синк банку застряг</b>${NL}${NL}Рахунок не оновлюється 3+ дн — ФОП-надходження нижче реальних:${NL}${LINES}${NL}${NL}Перевір токен Автоклієнта Приват24 Бізнес для цього ФОП."

          HTTP=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true")
          if [ "$HTTP" != "200" ]; then
            echo "::warning::HTML send failed (HTTP $HTTP), fallback plain:"; cat /tmp/r.txt
            PLAIN=$(echo "$MSG" | sed -E 's|</?(b|i|u|s|a|code|pre|em|strong)[^>]*>||gi')
            HTTP2=$(curl -s -o /tmp/r2.txt -w "%{http_code}" \
              "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TG_CHAT_ID" \
              --data-urlencode "text=$PLAIN" \
              -d "disable_web_page_preview=true")
            if [ "$HTTP2" != "200" ]; then echo "::error::plain fallback failed (HTTP $HTTP2)"; cat /tmp/r2.txt; exit 1; fi
          fi
          echo "✅ Alert sent"
