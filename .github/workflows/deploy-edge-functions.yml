name: Deploy Edge Functions

# Auto-deploy ВСІХ Supabase Edge Functions при push у hq/supabase/functions/**
# Secrets потрібні:
#   SUPABASE_ACCESS_TOKEN — Personal Access Token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF=wotghlaehnvxyeacznvv

on:
  push:
    branches: [main]
    paths:
      - 'hq/supabase/functions/**'
      - 'tasks/supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Specific function name (or "all")'
        default: 'all'

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed functions
        id: changes
        run: |
          if [ "${{ github.event.inputs.function_name }}" = "all" ] || [ -z "${{ github.event.inputs.function_name }}" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '(hq|tasks)/supabase/functions/[^/]+/' | awk -F'/' '{print $4}' | sort -u | tr '\n' ' ')
            if [ -z "$CHANGED" ]; then
              CHANGED="all"
            fi
          else
            CHANGED="${{ github.event.inputs.function_name }}"
          fi
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT
          echo "Will deploy: $CHANGED"

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret не налаштований. Додай у Repo Settings → Secrets and variables → Actions"
            echo "::error::Generate token: https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          PROJECT_REF="${PROJECT_REF:-wotghlaehnvxyeacznvv}"
          FUNCS="${{ steps.changes.outputs.functions }}"
          for FN in $FUNCS; do
            # Шукаємо функцію у hq/ або tasks/
            if [ -d "hq/supabase/functions/$FN" ]; then
              DIR="hq/supabase/functions"
            elif [ -d "tasks/supabase/functions/$FN" ]; then
              DIR="tasks/supabase/functions"
            else
              echo "::warning::Function $FN not found in hq/ or tasks/ — skip"
              continue
            fi
            echo ""
            echo "=== Deploy $FN from $DIR ==="
            cd "$DIR/.."  # parent of functions/
            # supabase functions deploy потребує structure project/functions/<name>
            # Створюємо temp symlink якщо треба
            supabase functions deploy "$FN" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt || echo "::warning::Failed to deploy $FN"
            cd "$GITHUB_WORKSPACE"
          done
          echo ""
          echo "=== Done ==="
