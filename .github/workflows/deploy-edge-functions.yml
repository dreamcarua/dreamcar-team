name: Deploy Edge Functions

# Auto-deploy ВСІХ Supabase Edge Functions при push у hq/supabase/functions/**
on:
  push:
    branches: [main]
    paths:
      - 'hq/supabase/functions/**'
      - 'tasks/supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Specific function name (or "all")'
        default: 'all'

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed functions
        id: changes
        run: |
          INPUT_FN="${{ github.event.inputs.function_name }}"
          if [ "$INPUT_FN" = "all" ]; then
            CHANGED=""
            for D in hq/supabase/functions tasks/supabase/functions; do
              if [ -d "$D" ]; then
                for F in "$D"/*/; do
                  NAME=$(basename "$F")
                  if [ "$NAME" != "_shared" ] && [ -f "$F/index.ts" ]; then
                    CHANGED="$CHANGED $NAME"
                  fi
                done
              fi
            done
          elif [ -n "$INPUT_FN" ]; then
            CHANGED="$INPUT_FN"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '(hq|tasks)/supabase/functions/[^/]+/' | awk -F'/' '{print $4}' | sort -u | tr '\n' ' ')
          fi
          CHANGED=$(echo "$CHANGED" | xargs)
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT
          echo "Will deploy: $CHANGED"

      - name: Deploy functions (staging dir workaround)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing"
            exit 1
          fi
          PROJECT_REF="${PROJECT_REF:-wotghlaehnvxyeacznvv}"
          FUNCS="${{ steps.changes.outputs.functions }}"

          STAGE="/tmp/sb-deploy"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/supabase/functions"

          DEPLOY_OK=0
          DEPLOY_FAIL=0
          FAILED_LIST=""

          for FN in $FUNCS; do
            if [ -d "hq/supabase/functions/$FN" ]; then
              SRC="hq/supabase/functions/$FN"
            elif [ -d "tasks/supabase/functions/$FN" ]; then
              SRC="tasks/supabase/functions/$FN"
            else
              echo "::warning::Function $FN not found in hq/ or tasks/ — skip"
              continue
            fi

            if [ "$FN" = "_shared" ] || [ "$FN" = "import_map.json" ]; then
              continue
            fi

            if [ ! -f "$SRC/index.ts" ]; then
              echo "::warning::$SRC/index.ts not found — skip $FN"
              continue
            fi

            echo ""
            echo "=== Deploy $FN from $SRC ==="

            rm -rf "$STAGE/supabase/functions/$FN"
            mkdir -p "$STAGE/supabase/functions/$FN"
            cp -r "$SRC"/* "$STAGE/supabase/functions/$FN/"

            PARENT_DIR="$(dirname "$SRC")"
            if [ -d "$PARENT_DIR/_shared" ]; then
              rm -rf "$STAGE/supabase/functions/_shared"
              cp -r "$PARENT_DIR/_shared" "$STAGE/supabase/functions/_shared"
            fi

            cd "$STAGE"
            if supabase functions deploy "$FN" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt; then
              DEPLOY_OK=$((DEPLOY_OK+1))
              echo "✅ $FN deployed"
            else
              DEPLOY_FAIL=$((DEPLOY_FAIL+1))
              FAILED_LIST="$FAILED_LIST $FN"
              echo "::warning::Failed to deploy $FN"
            fi
            cd "$GITHUB_WORKSPACE"
          done

          echo ""
          echo "=== Summary === OK:$DEPLOY_OK FAIL:$DEPLOY_FAIL"
          [ -n "$FAILED_LIST" ] && echo "Failed:$FAILED_LIST"

          rm -rf "$STAGE"

          if [ "$DEPLOY_FAIL" -gt 0 ]; then
            exit 1
          fi
