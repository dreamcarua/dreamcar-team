name: TG Autopost Worker

# 28.07.2026: scheduled-запуск ВИМКНЕНО. Причина — GH Actions scheduled cron давав
# до 80хв затримки у пікові години (09/12/00:00). Автопост тепер іде ПРЯМО з Edge
# (autopost-tg-enqueue → tg-post-send, pg_cron кожні 2хв). Цей worker лишається лише
# як ручний backup (workflow_dispatch) — обробляє tg_autopost_queue, якщо туди щось
# потрапить legacy-шляхом.
on:
  workflow_dispatch:

concurrency:
  group: tg-autopost
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
      - name: Run worker
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.HQ_DB_URL }}
          SERVICE_KEY: ${{ secrets.HQ_DB_SERVICE_KEY }}
          WORKER_ID: gh-action-${{ github.run_id }}
        run: bash .github/scripts/tg-autopost-worker.sh
