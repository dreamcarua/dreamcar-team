name: TG Autopost Worker

# Picks up tg_autopost_queue items every 5 min, compresses videos with ffmpeg,
# posts them to Telegram channel via bot API.
#
# Required secrets:
#   - TG_BOT_TOKEN
#   - HQ_DB_URL (Supabase project URL — https://wotghlaehnvxyeacznvv.supabase.co)
#   - HQ_DB_SERVICE_KEY (Supabase service-role key)
#
# Triggers:
#   - schedule: every 5 min (UTC)
#   - workflow_dispatch: manual trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-autopost
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Install ffmpeg + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          ffmpeg -version | head -n 1
          jq --version

      - name: Claim and process jobs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.HQ_DB_URL }}
          SERVICE_KEY: ${{ secrets.HQ_DB_SERVICE_KEY }}
          WORKER_ID: gh-action-${{ github.run_id }}
        shell: bash
        run: |
          set -e
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Missing TG_BOT_TOKEN / HQ_DB_URL / HQ_DB_SERVICE_KEY secrets"
            exit 1
          fi

          # Claim up to 5 jobs atomically via RPC
          echo "→ Claiming jobs as $WORKER_ID..."
          CLAIMED=$(curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/claim_autopost_jobs" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"worker_name\":\"$WORKER_ID\",\"max_jobs\":5}")

          echo "Claimed payload: $CLAIMED"
          JOB_COUNT=$(echo "$CLAIMED" | jq 'length')
          echo "→ Got $JOB_COUNT jobs"

          if [ "$JOB_COUNT" = "0" ]; then
            echo "Nothing to process."
            exit 0
          fi

          # Process each job
          for i in $(seq 0 $(($JOB_COUNT - 1))); do
            JOB=$(echo "$CLAIMED" | jq -c ".[$i]")
            JOB_ID=$(echo "$JOB" | jq -r '.id')
            PUB_ID=$(echo "$JOB" | jq -r '.publication_id')
            CHAT_ID=$(echo "$JOB" | jq -r '.target_chat_id')

            echo ""
            echo "═══ Job $JOB_ID · pub $PUB_ID → chat $CHAT_ID ═══"

            # Fetch pub details + first creative
            PUB=$(curl -sS "$SUPABASE_URL/rest/v1/publications?id=eq.$PUB_ID&select=id,title,text_body,hashtags" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | jq -c '.[0]')

            if [ "$PUB" = "null" ] || [ -z "$PUB" ]; then
              echo "::error::Pub not found"
              curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/fail_autopost_job" \
                -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"job_id\":\"$JOB_ID\",\"pub_id\":\"$PUB_ID\",\"err_msg\":\"pub not found\"}"
              continue
            fi

            TITLE=$(echo "$PUB" | jq -r '.title // ""')
            TEXT=$(echo "$PUB" | jq -r '.text_body // ""')
            HASHTAGS=$(echo "$PUB" | jq -r '.hashtags | if . then map(if startswith("#") then . else "#" + . end) | join(" ") else "" end')

            FULL_CAPTION="$TEXT"
            if [ -n "$HASHTAGS" ]; then
              FULL_CAPTION="${FULL_CAPTION}

${HASHTAGS}"
            fi

            # Get first creative (sort_order ASC)
            CREATIVE=$(curl -sS "$SUPABASE_URL/rest/v1/creative_publications?publication_id=eq.$PUB_ID&order=sort_order.asc&limit=1&select=creative_id,creatives(id,type,thumbnail_url,drive_file_id,name)" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | jq -c '.[0].creatives')

            CRE_TYPE=$(echo "$CREATIVE" | jq -r '.type // ""')
            CRE_URL=$(echo "$CREATIVE" | jq -r '.thumbnail_url // ""')

            echo "Creative type: $CRE_TYPE, url: $CRE_URL"

            HTTP=""
            RESPONSE=""

            if [ -z "$CRE_TYPE" ] || [ "$CRE_TYPE" = "null" ]; then
              # Text-only post
              echo "→ Text-only sendMessage"
              RESPONSE=$(curl -sS -o /tmp/tg-resp.json -w "%{http_code}" \
                "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" \
                --data-urlencode "text=${TITLE}

${FULL_CAPTION}" \
                -d "parse_mode=HTML" \
                -d "disable_web_page_preview=false")
              HTTP="$RESPONSE"
            elif [ "$CRE_TYPE" = "photo" ]; then
              # Photo: download + sendPhoto via file upload (max quality)
              echo "→ Photo: downloading $CRE_URL"
              curl -sS -o /tmp/photo.bin -L "$CRE_URL"
              PHOTO_SIZE=$(stat -c%s /tmp/photo.bin)
              echo "Photo size: $PHOTO_SIZE bytes"

              RESPONSE=$(curl -sS -o /tmp/tg-resp.json -w "%{http_code}" \
                "https://api.telegram.org/bot$TG_BOT_TOKEN/sendPhoto" \
                -F "chat_id=$CHAT_ID" \
                -F "photo=@/tmp/photo.bin" \
                -F "caption=${TITLE}

${FULL_CAPTION}" \
                -F "parse_mode=HTML")
              HTTP="$RESPONSE"
            elif [ "$CRE_TYPE" = "video" ]; then
              # Video: download + ffmpeg compress + sendVideo (file-upload, supports_streaming)
              echo "→ Video: downloading $CRE_URL"
              curl -sS -o /tmp/input.mp4 -L "$CRE_URL"
              IN_SIZE=$(stat -c%s /tmp/input.mp4)
              IN_SIZE_MB=$((IN_SIZE / 1024 / 1024))
              echo "Input video: $IN_SIZE bytes ($IN_SIZE_MB MB)"

              # Probe video
              PROBE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration,r_frame_rate -of json /tmp/input.mp4)
              VWIDTH=$(echo "$PROBE" | jq -r '.streams[0].width // 1920')
              VHEIGHT=$(echo "$PROBE" | jq -r '.streams[0].height // 1080')
              VDURATION=$(echo "$PROBE" | jq -r '.streams[0].duration // "0"' | awk '{printf "%.0f", $1}')
              echo "Probed: ${VWIDTH}x${VHEIGHT}, ${VDURATION}s"

              # Generate thumbnail (1s mark)
              ffmpeg -y -v error -i /tmp/input.mp4 -ss 00:00:01 -vframes 1 -vf "scale='min(320,iw)':-2" /tmp/thumb.jpg 2>/dev/null || \
                ffmpeg -y -v error -i /tmp/input.mp4 -vframes 1 -vf "scale='min(320,iw)':-2" /tmp/thumb.jpg

              # Compress strategy:
              # — If <45MB and well-encoded → just remux (faststart, no re-encode)
              # — Else: re-encode with CRF 20 (visually lossless)
              # — If still >45MB → escalate CRF to 23, then 26
              # — Final fallback: sendDocument (lossless, no inline preview)

              OUT_SIZE=99999999
              FINAL_FILE=""

              if [ "$IN_SIZE" -le $((45 * 1024 * 1024)) ]; then
                echo "→ Remux only (faststart, no re-encode)"
                ffmpeg -y -v error -i /tmp/input.mp4 -c copy -movflags +faststart /tmp/out.mp4 2>&1 || true
                if [ -f /tmp/out.mp4 ]; then
                  OUT_SIZE=$(stat -c%s /tmp/out.mp4)
                  FINAL_FILE=/tmp/out.mp4
                  echo "Remuxed size: $OUT_SIZE bytes ($((OUT_SIZE / 1024 / 1024)) MB)"
                fi
              fi

              if [ "$OUT_SIZE" -gt $((47 * 1024 * 1024)) ]; then
                for CRF in 20 23 26; do
                  echo "→ Re-encoding with CRF=$CRF, preset=slow, max-side=1920"
                  ffmpeg -y -v error -i /tmp/input.mp4 \
                    -c:v libx264 -preset slow -crf "$CRF" \
                    -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)'" \
                    -c:a aac -b:a 192k \
                    -movflags +faststart \
                    -pix_fmt yuv420p \
                    /tmp/out.mp4
                  OUT_SIZE=$(stat -c%s /tmp/out.mp4)
                  OUT_SIZE_MB=$((OUT_SIZE / 1024 / 1024))
                  echo "CRF=$CRF result: $OUT_SIZE bytes (${OUT_SIZE_MB} MB)"
                  if [ "$OUT_SIZE" -le $((47 * 1024 * 1024)) ]; then
                    FINAL_FILE=/tmp/out.mp4
                    break
                  fi
                done
              fi

              # Re-probe final file for width/height/duration (after potential downscale)
              if [ -n "$FINAL_FILE" ]; then
                FPROBE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of json "$FINAL_FILE")
                FW=$(echo "$FPROBE" | jq -r '.streams[0].width // 1920')
                FH=$(echo "$FPROBE" | jq -r '.streams[0].height // 1080')
                FD=$(echo "$FPROBE" | jq -r '.streams[0].duration // "0"' | awk '{printf "%.0f", $1}')
              fi

              # Final size check + send strategy
              if [ -n "$FINAL_FILE" ] && [ "$OUT_SIZE" -le $((49 * 1024 * 1024)) ]; then
                echo "→ sendVideo via file-upload (size=$OUT_SIZE)"
                RESPONSE=$(curl -sS -o /tmp/tg-resp.json -w "%{http_code}" --connect-timeout 60 --max-time 600 \
                  "https://api.telegram.org/bot$TG_BOT_TOKEN/sendVideo" \
                  -F "chat_id=$CHAT_ID" \
                  -F "video=@$FINAL_FILE" \
                  -F "thumbnail=@/tmp/thumb.jpg" \
                  -F "width=$FW" \
                  -F "height=$FH" \
                  -F "duration=$FD" \
                  -F "supports_streaming=true" \
                  -F "caption=${TITLE}

${FULL_CAPTION}" \
                  -F "parse_mode=HTML")
                HTTP="$RESPONSE"
              else
                echo "::warning::Video >49MB after compression — fallback на sendDocument (нема інлайн прев'ю)"
                RESPONSE=$(curl -sS -o /tmp/tg-resp.json -w "%{http_code}" --connect-timeout 60 --max-time 600 \
                  "https://api.telegram.org/bot$TG_BOT_TOKEN/sendDocument" \
                  -F "chat_id=$CHAT_ID" \
                  -F "document=@/tmp/input.mp4" \
                  -F "caption=${TITLE}

${FULL_CAPTION} (надто велике для inline відео)" \
                  -F "parse_mode=HTML")
                HTTP="$RESPONSE"
              fi
            else
              # Unknown creative type
              echo "→ Unknown creative type ($CRE_TYPE), text-only fallback"
              RESPONSE=$(curl -sS -o /tmp/tg-resp.json -w "%{http_code}" \
                "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" \
                --data-urlencode "text=${TITLE}

${FULL_CAPTION}" \
                -d "parse_mode=HTML")
              HTTP="$RESPONSE"
            fi

            echo "TG response HTTP=$HTTP"
            echo "Body: $(cat /tmp/tg-resp.json)"

            if [ "$HTTP" = "200" ]; then
              MSG_ID=$(jq -r '.result.message_id' /tmp/tg-resp.json)
              CHAT_OUT=$(jq -r '.result.chat.id' /tmp/tg-resp.json)
              echo "✅ Sent! message_id=$MSG_ID"
              curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/complete_autopost_job" \
                -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"job_id\":\"$JOB_ID\",\"pub_id\":\"$PUB_ID\",\"chat_id\":\"$CHAT_OUT\",\"msg_id\":$MSG_ID}"
            else
              ERR=$(jq -r '.description // .error // "Unknown error"' /tmp/tg-resp.json | head -c 500)
              echo "❌ Fail: $ERR"
              curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/fail_autopost_job" \
                -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -nc --arg jid "$JOB_ID" --arg pid "$PUB_ID" --arg err "HTTP $HTTP: $ERR" '{job_id:$jid, pub_id:$pid, err_msg:$err}')"
            fi

            # Cleanup
            rm -f /tmp/input.mp4 /tmp/out.mp4 /tmp/thumb.jpg /tmp/photo.bin /tmp/tg-resp.json
          done

          echo ""
          echo "═══ Done processing $JOB_COUNT jobs ═══"
