name: CF Pages Retry
on:
  workflow_dispatch:
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get CF account ID
        id: acc
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          RESP=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5")
          ACC=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "account_id=$ACC" >> $GITHUB_OUTPUT
          echo "Account: $ACC"

      - name: Find Pages project and retry deployment
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: ${{ steps.acc.outputs.account_id }}
        run: |
          set -e
          PROJECTS=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects?per_page=25")
          echo "Projects: $PROJECTS"
          PNAME=$(echo "$PROJECTS" | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; p=[x['name'] for x in r if 'dreamcar-team' in x.get('name','') or 'team.dreamcar.ua' in str(x.get('domains',[]))]; print(p[0] if p else r[0]['name'])")
          echo "Project: $PNAME"

          DEPS=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PNAME/deployments?per_page=5")
          echo "Deployments: $DEPS"
          DEP_ID=$(echo "$DEPS" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Retrying deployment: $DEP_ID"

          RESP=$(curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PNAME/deployments/$DEP_ID/retry")
          echo "Retry response: $RESP"
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('SUCCESS:', d['result'].get('id','?')) if d.get('success') else print('FAILED:', d.get('errors'))"
          echo "$RESP" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"
