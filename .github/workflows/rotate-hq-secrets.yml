name: Rotate HQ secrets → Supabase Edge

# 08.08.2026 (аудит): HQ_CRON_SECRET і HQ_WEBHOOK_SECRET були захардкоджені у ПУБЛІЧНОМУ
# репо (cleanup-storage-orphans, detect-silent-uploads, tg-webhook, міграція 019) → спалені.
# Цей workflow синхронізує НОВІ значення з GH secrets у Supabase Edge env.
# Після ротації: cron-джоби в БД оновлюються SQL-ом, літерали в коді замінені на env.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push secrets to Edge env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW_CRON: ${{ secrets.HQ_CRON_SECRET }}
          NEW_WH: ${{ secrets.HQ_WEBHOOK_SECRET }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          PROJECT_REF="${REF:-wotghlaehnvxyeacznvv}"
          if [ -z "${NEW_CRON:-}" ] || [ -z "${NEW_WH:-}" ]; then
            echo "::error::HQ_CRON_SECRET / HQ_WEBHOOK_SECRET порожні"; exit 1
          fi
          {
            printf 'HQ_CRON_SECRET=%s\n' "$NEW_CRON"
            printf 'DC_CRON_SECRET=%s\n' "$NEW_CRON"
            printf 'HQ_WEBHOOK_SECRET=%s\n' "$NEW_WH"
            printf 'HQ_SECRET=%s\n' "$NEW_WH"
          } > /tmp/rot.env
          supabase secrets set --env-file /tmp/rot.env --project-ref "$PROJECT_REF"
          rm -f /tmp/rot.env
          echo "✓ Edge env оновлено (4 ключі)"
