name: aipost-import-secret
# Copies selected secrets of this repo into AIpost (encrypted in its D1). Values are never printed.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "AIpost origin, e.g. https://aipost.dreamcar.ua"
        required: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: import
        env:
          IMPORT_TOKEN: ${{ secrets.AIPOST_IMPORT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          n=0
          for NAME in ANTHROPIC_API_KEY TG_BOT_TOKEN TG_CHAT_ID; do
            VAL="${!NAME:-}"; [ -z "$VAL" ] && continue
            BODY=$(python3 -c 'import json,os,sys; print(json.dumps({"name":sys.argv[1],"value":os.environ[sys.argv[1]]}))' "$NAME")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/admin/import" -H "content-type: application/json" -H "x-import-token: $IMPORT_TOKEN" --data "$BODY")
            echo "$NAME -> HTTP $CODE"; [ "$CODE" = "200" ] && n=$((n+1))
          done
          echo "imported: $n"; [ "$n" -gt 0 ]
