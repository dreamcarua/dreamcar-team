name: Cowork → TG Notify

# Bridge для one-way push нотифікацій від Cowork-Claude у TG.
#
# Як працює:
# 1. Claude комічу файл `cowork-notify/<timestamp>.json` з {text, type, link}
# 2. Цей workflow тригериться на push у cowork-notify/*.json
# 3. Action читає файл → шле повідомлення у TG через бот @dreamcar_team_bot
# 4. Файл архівується у cowork-notify/archive/ з `[skip ci]` у commit message.
#
# Secrets потрібні у repo Settings → Secrets and variables → Actions:
#   - TG_BOT_TOKEN  (для @dreamcar_team_bot)
#   - TG_CHAT_ID    (chat_id Вадима, число)

on:
  push:
    paths:
      - 'cowork-notify/*.json'
    branches:
      - main

# Запобігаємо race condition між паралельними runs:
# усі завдання у group "cowork-notify" виконуються послідовно (queue, не cancel).
concurrency:
  group: cowork-notify
  cancel-in-progress: false

jobs:
  send-tg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new notify files
        id: files
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'cowork-notify/*.json' 2>/dev/null || true)
          if [ -z "$NEW_FILES" ]; then
            NEW_FILES=$(find cowork-notify -maxdepth 1 -name '*.json' -type f 2>/dev/null || true)
          fi
          if [ -z "$NEW_FILES" ]; then
            echo "No notify files. Exit."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Files to process:"
          echo "$NEW_FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send each notification to TG
        if: steps.files.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FILES: ${{ steps.files.outputs.files }}
        shell: bash
        run: |
          set -e
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::error::Missing TG_BOT_TOKEN or TG_CHAT_ID secrets"
            exit 1
          fi
          NL=$'\n'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "Skip missing: $file"
              continue
            fi
            echo "Processing $file..."
            TEXT=$(jq -r '.text // ""' "$file")
            TYPE=$(jq -r '.type // "info"' "$file")
            LINK=$(jq -r '.link // ""' "$file")
            if [ -z "$TEXT" ]; then
              echo "::warning::Empty text in $file, skip"
              continue
            fi
            case "$TYPE" in
              deploy) EMOJI="🚀" ;;
              task) EMOJI="✅" ;;
              warn) EMOJI="⚠️" ;;
              error) EMOJI="🔴" ;;
              question) EMOJI="❓" ;;
              info|*) EMOJI="🤖" ;;
            esac
            TS=$(date -u +"%H:%M UTC · %d.%m")
            SAFE_TEXT=$(echo "$TEXT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            MSG="${EMOJI} <b>Cowork</b> · ${TS}${NL}${NL}${SAFE_TEXT}"
            if [ -n "$LINK" ] && [ "$LINK" != "null" ]; then
              MSG="${MSG}${NL}${NL}🔗 <a href=\"${LINK}\">Відкрити</a>"
            fi
            HTTP=$(curl -s -o /tmp/tg-resp.txt -w "%{http_code}" \
              "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TG_CHAT_ID" \
              --data-urlencode "text=$MSG" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true")
            if [ "$HTTP" != "200" ]; then
              echo "::error::TG send failed for $file (HTTP $HTTP):"
              cat /tmp/tg-resp.txt
              exit 1
            fi
            echo "✅ Sent: $file"
          done <<< "$FILES"

      - name: Archive sent files
        if: steps.files.outputs.skip != 'true'
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          mkdir -p cowork-notify/archive
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            BASENAME=$(basename "$file")
            git mv "$file" "cowork-notify/archive/$BASENAME"
          done <<< "$FILES"

      - name: Commit archive
        if: steps.files.outputs.skip != 'true'
        run: |
          git config user.name "cowork-notify-bot"
          git config user.email "cowork-bot@dreamcar.ua"
          if git diff --staged --quiet; then
            echo "Nothing to archive."
            exit 0
          fi
          git commit -m "chore: archive cowork-notify files [skip ci]"
          # Retry loop: якщо інший паралельний run встиг запушити раніше — rebase і пробуй знову
          for attempt in 1 2 3 4 5; do
            if git push 2>/tmp/push_err; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed:"
            cat /tmp/push_err
            echo "Rebasing onto origin/main and retrying..."
            git pull --rebase origin main || true
            sleep $((attempt * 2))
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
