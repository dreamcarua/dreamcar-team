name: Auto Cache Bust

# #266 (10.06.2026): після КОЖНОГО push до main що зачіпає frontend файли —
# 1) Bump ?v= параметра у всіх index.html на git SHA
# 2) Cloudflare API purge cache (edge invalidation)
# Цей workflow самостійно НЕ deploy — Cloudflare Pages auto-deploys з main.
# Але він робить cache bust ЗМІНОЮ files = новий commit = новий deploy.

on:
  push:
    branches: [main]
    paths:
      - 'hq/**'
      - 'tasks/**'
      - 'projects/**'
      - 'retention/**'
      - 'dashboard/**'
      - 'brand-book/**'
      - '_headers'
  workflow_dispatch:

concurrency:
  group: auto-cache-bust
  cancel-in-progress: false

jobs:
  bust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ВАЖЛИВО: не реагувати на власні коміти cache-bust (бо нескінченний цикл)
    # Не reагувати тільки на власні auto-generated commits (точна фраза 'auto cache bust v=')
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'auto cache bust v=')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Compute short SHA + timestamp
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          TS=$(date -u +%Y%m%d%H%M)
          VERSION="${TS}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Cache bust version: $VERSION"

      - name: Bump version у script src URLs
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # 16.06.2026 — FULL REPLACE.
          # Раніше pattern match-ив тільки початок (?v=202606151639) а tail
          # (-3052237135-ca00dbad33-...-ead45b7a) лишався у файлі і нескінченно
          # ріс кожного push. Тепер захоплюємо ВЕСЬ tail до next " або &.
          # Patterns:
          #   1) Наша TS+SHA конвенція: ?v=20YYYYMMDDHHMM[-hex-hex-...]
          #   2) Legacy short hash: ?v=20YYYYMMDD[a-z]?
          for f in hq/index.html tasks/index.html projects/index.html retention/index.html dashboard/index.html brand-book/index.html; do
            if [ -f "$f" ]; then
              # 1) Жадібно поглинаємо весь tail [0-9a-f-] до " або & або #
              sed -i -E "s/\?v=20[0-9]{6,8}[a-z]?[-a-f0-9]*/?v=$VERSION/g" "$f"
              echo "Updated $f"
            fi
          done

      - name: Commit version bump
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage всі змінені index.html по одному (skip якщо файл не існує)
          for f in hq/index.html tasks/index.html projects/index.html retention/index.html dashboard/index.html brand-book/index.html; do
            if [ -f "$f" ]; then
              git add "$f" || true
            fi
          done
          # Перевірити чи staging має зміни — якщо ні, тихо вийти
          if git diff --cached --quiet; then
            echo "::notice::No version changes — nothing to commit"
            exit 0
          fi
          git commit -m "🤖 auto cache bust v=$VERSION [skip ci]"
          git push
          echo "::notice::Committed cache bust"

      - name: Cloudflare cache purge (edge invalidation)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CF_API_TOKEN або CF_ZONE_ID не виставлено — пропускаю CF purge"
            exit 0
          fi
          # Purge URL-by-URL для team.dreamcar.ua *index.html
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "files": [
                "https://team.dreamcar.ua/hq/",
                "https://team.dreamcar.ua/hq/index.html",
                "https://team.dreamcar.ua/tasks/",
                "https://team.dreamcar.ua/tasks/index.html",
                "https://team.dreamcar.ua/projects/",
                "https://team.dreamcar.ua/projects/index.html",
                "https://team.dreamcar.ua/retention/",
                "https://team.dreamcar.ua/retention/index.html",
                "https://team.dreamcar.ua/dashboard/",
                "https://team.dreamcar.ua/dashboard/index.html",
                "https://team.dreamcar.ua/brand-book/"
              ]
            }' | tee /tmp/cf-purge.json
          if grep -q '"success":true' /tmp/cf-purge.json; then
            echo "::notice::Cloudflare cache purged"
          else
            echo "::error::CF purge failed:"
            cat /tmp/cf-purge.json
            exit 1
          fi
