name: CF apex redirect
# 25.09.2026 (аудит V15): apex dreamcar.ua/www = 522 (origin down) під час циклу.
# Edge-редірект на Cloudflare: dreamcar.ua, www -> 302 -> audiq7 (query зберігаємо, UTM не втрачаємо).
# 302 тимчасовий (ціль змінюється щоциклу). Ідемпотентно (правило з міткою APEX_AUDIT_V15).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-apex-redirect.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Куди редіректити apex'
        required: false
        default: 'https://audiq7.dreamcar.ua/'
      remove:
        description: 'true = видалити правило (rollback)'
        required: false
        default: 'false'
concurrency:
  group: cf-apex-redirect
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply apex redirect via Cloudflare Rulesets API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          TARGET: ${{ github.event.inputs.target || 'https://audiq7.dreamcar.ua/' }}
          REMOVE: ${{ github.event.inputs.remove || 'false' }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::CF_API_TOKEN missing"; exit 1; }
          test -n "$CF_ZONE_ID" || { echo "::error::CF_ZONE_ID missing"; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          DESC="APEX_AUDIT_V15 dreamcar.ua/www -> audiq7"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          EP=$(curl -sS "${auth[@]}" "$API/zones/$CF_ZONE_ID/rulesets/phases/http_request_dynamic_redirect/entrypoint")
          if ! echo "$EP" | grep -q '"success":true'; then
            EP=$(curl -sS -X PUT "${auth[@]}" "$API/zones/$CF_ZONE_ID/rulesets/phases/http_request_dynamic_redirect/entrypoint" -d '{"rules":[]}')
          fi
          echo "$EP" | grep -q '"success":true' || { echo "::error::dynamic_redirect ruleset unavailable (перевір scope токена: Zone Dynamic Redirect: Edit)"; echo "$EP" | head -c 800; exit 1; }
          RID=$(echo "$EP" | jq -r '.result.id')
          OLD=$(echo "$EP" | jq -r --arg d "$DESC" '(.result.rules // [])[] | select(.description==$d) | .id' | head -n1)
          if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
            curl -sS -X DELETE "${auth[@]}" "$API/zones/$CF_ZONE_ID/rulesets/$RID/rules/$OLD" >/dev/null || true
          fi
          if [ "$REMOVE" = "true" ]; then echo "::notice::rule removed (rollback)"; exit 0; fi

          PAYLOAD=$(jq -n --arg d "$DESC" --arg t "$TARGET" '{description:$d, expression:"(http.host eq \"dreamcar.ua\" or http.host eq \"www.dreamcar.ua\")", action:"redirect", action_parameters:{from_value:{status_code:302, target_url:{value:$t}, preserve_query_string:true}}}')
          RESP=$(curl -sS -X POST "${auth[@]}" "$API/zones/$CF_ZONE_ID/rulesets/$RID/rules" -d "$PAYLOAD")
          if echo "$RESP" | grep -q '"success":true'; then
            echo "::notice::apex redirect set: dreamcar.ua/www -> $TARGET (302)"
          else
            echo "::error::rule create failed:"; echo "$RESP" | head -c 1200; exit 1
          fi
      - name: Verify
        run: |
          for h in dreamcar.ua www.dreamcar.ua; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "https://$h/" || true)
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' -I "https://$h/" || true)
            echo "$h -> HTTP $code Location: $loc"
          done
