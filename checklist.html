<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamCar — Поточні питання</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; padding: 32px 24px; }

  .header { text-align: center; margin-bottom: 36px; }
  .header h1 { font-size: 22px; font-weight: 700; color: #cc0000; letter-spacing: 2px; text-transform: uppercase; }
  .header p { color: #888; font-size: 12px; margin-top: 6px; }

  .breadcrumb { text-align: center; margin-bottom: 28px; }
  .breadcrumb a { color: #555; font-size: 12px; text-decoration: none; }
  .breadcrumb a:hover { color: #aaa; }
  .breadcrumb span { color: #333; margin: 0 8px; }

  .toolbar {
    max-width: 820px; margin: 0 auto 20px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .filter-group { display: flex; gap: 6px; }
  .filter-btn {
    background: #1a1a2e; border: 1px solid #2a2a4a; color: #888;
    font-size: 11px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; font-weight: 600; letter-spacing: 0.5px;
  }
  .filter-btn:hover { border-color: #4a4a8a; color: #ccc; }
  .filter-btn.active { background: #1a0a2a; border-color: #cc0000; color: #ff9999; }
  .filter-btn.active-open  { background: #1a1a0a; border-color: #cc8800; color: #fbbf24; }
  .filter-btn.active-done  { background: #0a2a1a; border-color: #1a7a4a; color: #4ade80; }

  .add-btn {
    margin-left: auto; background: #1a0000; border: 1px solid #cc0000;
    color: #ff9999; font-size: 12px; font-weight: 700; padding: 7px 18px;
    border-radius: 6px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px;
  }
  .add-btn:hover { background: #2a0000; }

  .stats { max-width: 820px; margin: 0 auto 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-pill {
    font-size: 11px; padding: 5px 14px; border-radius: 20px; font-weight: 600;
  }
  .stat-total { background: #1a1a2e; color: #888; border: 1px solid #2a2a4a; }
  .stat-open  { background: #1a1a0a; color: #fbbf24; border: 1px solid #cc8800; }
  .stat-done  { background: #0a2a1a; color: #4ade80; border: 1px solid #1a7a4a; }

  .list { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  .item {
    background: #13131f; border: 1px solid #1e1e2e;
    border-radius: 10px; padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 14px;
    transition: all 0.15s; position: relative;
  }
  .item:hover { border-color: #2a2a4a; }
  .item.done { opacity: 0.55; }

  .item-check {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid #333;
    background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 1px;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .item-check:hover { border-color: #4ade80; }
  .item.done .item-check { background: #1a7a4a; border-color: #1a7a4a; }
  .item-check svg { display: none; }
  .item.done .item-check svg { display: block; }

  .item-body { flex: 1; min-width: 0; }
  .item-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

  .item-title {
    font-size: 13px; font-weight: 700; color: #fff; line-height: 1.4;
  }
  .item.done .item-title { text-decoration: line-through; color: #555; }

  .priority-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
  }
  .p-high   { background: #3a0a0a; color: #ff6666; border: 1px solid #660000; }
  .p-medium { background: #2a1f00; color: #fbbf24; border: 1px solid #664400; }
  .p-low    { background: #0a2a1a; color: #4ade80; border: 1px solid #1a5a30; }
  .p-done   { background: #0a2a1a; color: #4ade80; border: 1px solid #1a7a4a; }

  .owner-badge {
    font-size: 10px; color: #7ab0ff; background: #0a1a44;
    padding: 2px 8px; border-radius: 4px; border: 1px solid #1a3a7a;
  }

  .item-desc { font-size: 11px; color: #777; line-height: 1.6; margin-top: 2px; }
  .item.done .item-desc { color: #444; }

  .item-need { font-size: 11px; color: #aaa; line-height: 1.6; margin-top: 5px; background: rgba(255,255,255,0.03); padding: 5px 8px; border-radius: 5px; border-left: 2px solid #333; }
  .item-need-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }

  .item-actions { display: flex; gap: 6px; flex-shrink: 0; margin-top: 2px; }
  .action-btn {
    background: transparent; border: 1px solid #2a2a4a; color: #555;
    font-size: 11px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
    transition: all 0.15s;
  }
  .action-btn:hover { border-color: #555; color: #aaa; }
  .action-btn.delete:hover { border-color: #cc0000; color: #ff6666; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 100; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #13131f; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 28px; width: 100%; max-width: 560px;
  }
  .modal h2 { font-size: 15px; color: #cc0000; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; background: #0f0f1a; border: 1px solid #2a2a4a;
    color: #fff; font-size: 12px; padding: 9px 12px; border-radius: 6px;
    outline: none; transition: border-color 0.15s; font-family: Arial, sans-serif;
    resize: vertical;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #4455aa; }
  .form-group select option { background: #13131f; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel { background: #1a1a2e; border: 1px solid #2a2a4a; color: #888; font-size: 12px; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
  .btn-cancel:hover { color: #ccc; }
  .btn-save { background: #1a0000; border: 1px solid #cc0000; color: #ff9999; font-size: 12px; font-weight: 700; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
  .btn-save:hover { background: #2a0000; }

  .empty-state { text-align: center; padding: 60px 20px; color: #555; font-size: 13px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }

  @media (max-width: 600px) {
    .item-actions { flex-direction: column; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .add-btn { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="breadcrumb">
  <a href="index.html">← DreamCar.ua</a>
  <span>/</span>
  <span style="color:#888;">Поточні питання</span>
</div>

<div class="header">
  <h1>📋 Поточні питання</h1>
  <p>Відкриті задачі та питання команди · Зміни зберігаються автоматично</p>
</div>

<div class="stats">
  <div class="stat-pill stat-total" id="stat-total">Всього: 0</div>
  <div class="stat-pill stat-open"  id="stat-open">Відкрито: 0</div>
  <div class="stat-pill stat-done"  id="stat-done">Виконано: 0</div>
</div>

<div class="toolbar">
  <div class="filter-group">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Всі</button>
    <button class="filter-btn" data-filter="open" onclick="setFilter('open', this)">Відкриті</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Виконані</button>
  </div>
  <button class="add-btn" onclick="openModal()">＋ Додати питання</button>
</div>

<div class="list" id="list"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Нове питання</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Назва *</label>
      <input type="text" id="f-title" placeholder="Наприклад: Маркетинг-планування">
    </div>
    <div class="form-group">
      <label>Поточний стан</label>
      <textarea id="f-desc" rows="2" placeholder="Що зараз відбувається..."></textarea>
    </div>
    <div class="form-group">
      <label>Що потрібно зробити</label>
      <textarea id="f-need" rows="2" placeholder="Конкретна дія або рішення..."></textarea>
    </div>
    <div class="form-group">
      <label>Відповідальний</label>
      <input type="text" id="f-owner" placeholder="Давід, Вадим, Артем...">
    </div>
    <div class="form-group">
      <label>Пріоритет</label>
      <select id="f-priority">
        <option value="high">🔴 Критично</option>
        <option value="medium" selected>🟡 До проекту #17</option>
        <option value="low">🟢 На майбутнє</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
      <button class="btn-save" onclick="saveItem()">Зберегти</button>
    </div>
  </div>
</div>

<div style="text-align:center; margin-top:48px; color:#333; font-size:11px;">
  DreamCar.ua — Поточні питання · Квітень 2026 · Конфіденційно
</div>

<script>
const STORAGE_KEY = 'dreamcar_checklist_v1';

const DEFAULT_ITEMS = [
  {
    id: 1,
    title: 'Маркетинг-планування',
    desc: 'Поки спільно: Вадим + Артем + Давід. Немає єдиного власника.',
    need: 'Визначити: Давід бере на себе повністю або залишається спільним рішенням.',
    owner: 'Вадим + Давід',
    priority: 'medium',
    done: false
  },
  {
    id: 2,
    title: 'Meta Ads — делегування',
    desc: 'Веде Вадим — забирає стратегічний час засновника.',
    need: 'Знайти підрядника або штатного Ads-спеціаліста; ТЗ і контроль — Давід.',
    owner: 'Давід',
    priority: 'medium',
    done: false
  },
  {
    id: 3,
    title: 'KPI для Вови (TG + TikTok Ads)',
    desc: 'Роль уточнена (Telegram + TikTok Ads), але без вимірюваних цілей.',
    need: 'Давід: прописати KPI і бриф конкретно на проект #17.',
    owner: 'Давід',
    priority: 'high',
    done: false
  },
  {
    id: 4,
    title: 'Регламент пост-проектного звіту Артема',
    desc: 'Немає шаблону пост-проектного звіту, затримки контенту після фіналу.',
    need: 'Давід: шаблон + строки + відповідальність — перший SOP для команди.',
    owner: 'Давід',
    priority: 'high',
    done: false
  },
  {
    id: 5,
    title: 'Онбординг Давіда',
    desc: 'Найнятий ✅. Онбординг в процесі.',
    need: 'Передати контекст попередніх проектів, погодити стиль роботи, старт з #17.',
    owner: 'Вадим',
    priority: 'done',
    done: false
  },
  {
    id: 6,
    title: 'Зовнішній бухгалтер / юрист',
    desc: 'Питання бухобліку та юридичного супроводу вирішується внутрішньо.',
    need: 'Актуально при масштабуванні до 2+ проектів/місяць.',
    owner: 'Вадим',
    priority: 'low',
    done: false
  }
];

let items = [];
let currentFilter = 'all';
let nextId = 100;

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const data = JSON.parse(saved);
    items = data.items || DEFAULT_ITEMS;
    nextId = data.nextId || 100;
  } else {
    items = DEFAULT_ITEMS.map(i => ({...i}));
    nextId = 100;
    save();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, nextId }));
}

function priorityLabel(p) {
  const map = { high: '🔴 Критично', medium: '🟡 До проекту #17', low: '🟢 На майбутнє', done: '✅ Завершено' };
  return map[p] || p;
}
function priorityClass(p) {
  const map = { high: 'p-high', medium: 'p-medium', low: 'p-low', done: 'p-done' };
  return map[p] || 'p-medium';
}

function render() {
  const list = document.getElementById('list');
  const visible = items.filter(i => {
    if (currentFilter === 'open') return !i.done;
    if (currentFilter === 'done') return i.done;
    return true;
  });

  const total = items.length;
  const doneCount = items.filter(i => i.done).length;
  const openCount = total - doneCount;
  document.getElementById('stat-total').textContent = `Всього: ${total}`;
  document.getElementById('stat-open').textContent = `Відкрито: ${openCount}`;
  document.getElementById('stat-done').textContent = `Виконано: ${doneCount}`;

  if (visible.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">✓</div><div>${
      currentFilter === 'done' ? 'Виконаних питань ще немає' :
      currentFilter === 'open' ? 'Всі питання вирішено!' : 'Список порожній'
    }</div></div>`;
    return;
  }

  list.innerHTML = visible.map(item => `
    <div class="item ${item.done ? 'done' : ''}" id="item-${item.id}">
      <div class="item-check" onclick="toggleDone(${item.id})" title="${item.done ? 'Відмітити як відкрите' : 'Відмітити як виконане'}">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <polyline points="2,6 5,9 10,3" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="item-body">
        <div class="item-top">
          <span class="item-title">${escHtml(item.title)}</span>
          <span class="priority-badge ${priorityClass(item.priority)}">${priorityLabel(item.priority)}</span>
          ${item.owner ? `<span class="owner-badge">${escHtml(item.owner)}</span>` : ''}
        </div>
        ${item.desc ? `<div class="item-desc">${escHtml(item.desc)}</div>` : ''}
        ${item.need ? `<div class="item-need"><div class="item-need-label">Що потрібно</div>${escHtml(item.need)}</div>` : ''}
      </div>
      <div class="item-actions">
        <button class="action-btn" onclick="openModal(${item.id})">Ред.</button>
        <button class="action-btn delete" onclick="deleteItem(${item.id})">✕</button>
      </div>
    </div>
  `).join('');
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toggleDone(id) {
  const item = items.find(i => i.id === id);
  if (item) {
    item.done = !item.done;
    save();
    render();
  }
}

function deleteItem(id) {
  if (!confirm('Видалити це питання?')) return;
  items = items.filter(i => i.id !== id);
  save();
  render();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
  });
  if (filter === 'all')  btn.className = 'filter-btn active';
  if (filter === 'open') btn.className = 'filter-btn active-open';
  if (filter === 'done') btn.className = 'filter-btn active-done';
  render();
}

function openModal(id) {
  document.getElementById('modal-title').textContent = id ? 'Редагувати питання' : 'Нове питання';
  document.getElementById('edit-id').value = id || '';
  if (id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    document.getElementById('f-title').value = item.title;
    document.getElementById('f-desc').value = item.desc || '';
    document.getElementById('f-need').value = item.need || '';
    document.getElementById('f-owner').value = item.owner || '';
    document.getElementById('f-priority').value = item.priority || 'medium';
  } else {
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-need').value = '';
    document.getElementById('f-owner').value = '';
    document.getElementById('f-priority').value = 'medium';
  }
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Введіть назву питання'); return; }

  const id = document.getElementById('edit-id').value;
  const data = {
    title,
    desc: document.getElementById('f-desc').value.trim(),
    need: document.getElementById('f-need').value.trim(),
    owner: document.getElementById('f-owner').value.trim(),
    priority: document.getElementById('f-priority').value
  };

  if (id) {
    const item = items.find(i => i.id == id);
    if (item) Object.assign(item, data);
  } else {
    items.push({ id: nextId++, ...data, done: false });
  }
  save();
  render();
  closeModal();
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

load();
render();
</script>
</body>
</html>
