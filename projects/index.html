:root {
  --bg: #0a0a0a;
  --bg-2: #141414;
  --line: #1a1a1a;
  --steel: #2a2a2a;
  --white: #fff;
  --ash: #888;
  --red: #E30613;
  --red-soft: #FF6A7A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: 'JetBrains Mono', 'Manrope', system-ui, sans-serif;
  min-height: 100vh;
  /* body padding-top керує global-header.js */
}

/* Topbar — статичний у normal flow */
.topbar {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.brand-mark {
  display: flex; align-items: baseline; gap: 8px;
  text-decoration: none; color: #fff;
  font-family: 'Oswald', sans-serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.05em;
}
.brand-mark .red { color: var(--red); }
.brand-mark .meta {
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
}
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.filter-btn, .icon-btn {
  padding: 8px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.15s;
  border-radius: 6px;
}
.filter-btn:hover { border-color: var(--red); }
.user-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: rgba(74,222,128,0.1);
  border: 1px solid rgba(74,222,128,0.3);
  color: #10B981;
  font-size: 11px;
  border-radius: 6px;
  letter-spacing: 0.1em;
}

/* Login gate */
.login-gate {
  position: fixed;
  inset: 60px 0 0 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.login-card {
  max-width: 420px; width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--steel);
  border-radius: 16px;
  padding: 40px 32px;
  text-align: center;
}
.login-card .lock { font-size: 48px; margin-bottom: 20px; opacity: 0.6; }
.login-card h1 {
  font-family: 'Oswald', sans-serif;
  font-size: 24px;
  letter-spacing: 0.02em;
  margin-bottom: 8px;
}
.login-card h1 .red { color: var(--red); }
.login-card p { color: var(--ash); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
.login-btn {
  display: block; width: 100%;
  padding: 12px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.1em;
  cursor: pointer;
  margin-bottom: 10px;
  text-transform: uppercase;
  text-decoration: none;
  text-align: center;
}
.login-btn:hover { background: #ff1a1a; }
.login-btn.ghost { background: transparent; border: 1px solid var(--steel); color: var(--white); }
.login-btn.ghost:hover { border-color: var(--red); }
.login-status {
  font-size: 11px;
  color: var(--ash);
  margin-top: 16px;
  letter-spacing: 0.1em;
}
.login-status.error { color: var(--red-soft); }

  /* === Sprint 1 UX — Mobile breakpoints (768px tablet, 480px phone) === */

<script type="module">
const SUPABASE_URL = 'https://wotghlaehnvxyeacznvv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvdGdobGFlaG52eHllYWN6bnZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MDc4NjgsImV4cCI6MjA5NDE4Mzg2OH0.Se-y1WawsdSkMLXj7G_O-Kq-jVfjUOBD3KJOvemCR3A';

let supabase = null;
window.appState = { authUser: null, publicUser: null };

function setStatus(msg, cls) {
  const el = document.getElementById('loginStatus');
  if (el) { el.textContent = msg; el.className = 'login-status' + (cls ? ' ' + cls : ''); }
}

(async () => {
  try {
    setStatus('Завантажую SDK…');
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true, storage: window.dcStorage }
    });
    window.supabase = supabase;

    // SSO bridge від HQ — парсимо #sso=base64(json)
    try {
      const ssoMatch = location.hash.match(/#sso=([^&]+)/);
      if (ssoMatch) {
        setStatus('Приймаю сесію з HQ…');
        const decoded = JSON.parse(atob(decodeURIComponent(ssoMatch[1])));
        if (decoded.access_token && decoded.refresh_token) {
          await supabase.auth.setSession({
            access_token: decoded.access_token,
            refresh_token: decoded.refresh_token,
          });
        }
        history.replaceState(null, '', location.pathname + location.search);
      }
    } catch (e) { console.warn('[sso]', e); }

    setStatus('Перевіряю сесію…');
    await checkAuth();
    supabase.auth.onAuthStateChange(() => checkAuth().catch(e => setStatus('Auth: ' + e.message, 'error')));
  } catch (e) {
    setStatus('❌ ' + e.message, 'error');
  }
})();

async function checkAuth() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (session && session.user) {
    window.appState.authUser = session.user;
    let pu = null;
    try {
      const rpc = await supabase.rpc('resolve_user_by_auth', { p_auth_id: session.user.id });
      pu = (rpc.data && rpc.data[0]) || null;
    } catch (_) {}
    if (!pu) {
      const { data: directPu } = await supabase.from('users')
        .select('id,name,email,role,tg_chat_id')
        .eq('auth_id', session.user.id).maybeSingle();
      pu = directPu;
    }
    window.appState.publicUser = pu || null;
    if (!pu) {
      setStatus('⚠ Профіль не знайдено для ' + session.user.email + '. Звернися до CEO.', 'error');
      document.getElementById('loginGate').style.display = 'flex';
      return;
    }
    // Logged in
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('signOutBtn').style.display = 'inline-flex';
    document.getElementById('authChip').innerHTML =
      `<span class="user-chip">✓ ${(pu.name || pu.email).toUpperCase().slice(0, 16)}</span>`;
    // Initialize projects view (app-projects-app.js attaches listeners)
    window.dispatchEvent(new CustomEvent('dcp-ready'));
  } else {
    document.getElementById('loginGate').style.display = 'flex';
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('signOutBtn').style.display = 'none';
    document.getElementById('authChip').innerHTML = '';
    setStatus('Готово до входу.');
  }
}

document.getElementById('loginGoogle').onclick = async () => {
  if (!supabase) { setStatus('SDK ще не завантажився…', 'error'); return; }
  setStatus('Перенаправляю на Google…');
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/projects/' }
  });
  if (error) setStatus('OAuth: ' + error.message, 'error');
};
document.getElementById('loginTelegram').onclick = () => {
  setStatus('Перенаправляю на TG через HQ…');
  window.location.href = '/hq/?next=' + encodeURIComponent('/projects/');
};
document.getElementById('signOutBtn').onclick = async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.reload();
};
</script>
