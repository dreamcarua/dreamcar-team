<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Cockpit Vadym</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
/* DreamCar brand (sync assets/brand-tokens.css v3.9.2) */
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Archivo+Black&display=swap');
:root{color-scheme:dark;
 --bg:#0A0A0A;--coal:#141414;--card:#1F1F1F;--steel:#2A2A2A;--line:#2A2A2A;--line2:#3A3A3A;
 --text:#FFF;--bone:#DDD;--muted:#8A8A8A;
 --red:#E30613;--red-deep:#B8050F;--red-glow:#FF1A2B;
 --ok:#10B981;--ok2:#34D399;--warn:#F59E0B;--danger:#DC2626;--info:#3B82F6;--link:#60A5FA;
 --fdisplay:'Oswald','Bebas Neue',sans-serif;--fbody:'Manrope',sans-serif;--fmono:'JetBrains Mono',monospace;--faccent:'Archivo Black',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fbody);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 80px}
h1{font-family:var(--fdisplay);font-weight:700;font-size:27px;letter-spacing:.02em;margin:0 0 3px;text-transform:uppercase}
h2{font-family:var(--fdisplay);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--bone);margin:24px 0 10px}
.grp{font-family:var(--faccent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:36px 0 6px;padding:14px 0 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;scroll-margin-top:62px}
.grp::before{content:'';width:22px;height:3px;background:var(--red);border-radius:2px;box-shadow:0 0 8px rgba(227,6,19,.6)}
.sub{color:var(--muted);font-size:12.5px}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;margin-top:14px;background:linear-gradient(180deg,var(--bg) 82%,rgba(10,10,10,0));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;font-size:12px;color:var(--bone);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;transition:border-color .12s}
.nav a:hover{border-color:var(--red)}
.pb{float:right;display:inline-flex;gap:4px}
.pb button{background:var(--card);border:1px solid var(--line);color:var(--bone);font-size:11px;border-radius:8px;padding:3px 9px;cursor:pointer;font-family:var(--fbody)}
.pb button.on{border-color:var(--red);color:#fff}
.dlbtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--red);color:#fff;text-decoration:none;border-radius:4px;padding:10px 17px;font-family:var(--faccent);font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:background .12s,transform .12s}
.dlbtn:hover{background:var(--red-deep);transform:translateY(-1px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .15s,transform .15s;animation:fade .45s ease both}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .lab{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.card .big{font-family:var(--fmono);font-size:25px;font-weight:700;margin-top:4px;color:var(--text)}.card .big small{font-family:var(--fbody);font-size:12px;font-weight:500;color:var(--muted)}
.card .meta{font-size:11px;color:var(--muted);margin-top:3px}
.card .spk{display:block;width:100%;height:30px;margin-top:8px}
.delta{font-family:var(--fmono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.up{background:rgba(16,185,129,.15);color:var(--ok2)}.down{background:rgba(220,38,38,.16);color:#F87171}.flat{background:rgba(255,255,255,.06);color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cbox h4{font-family:var(--fdisplay);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;font-size:13px;color:var(--bone)}.cbox .cw{position:relative;height:160px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:fade .45s ease both}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:none}
.corr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.crow .p{font-size:13px;font-weight:600}.crow .bar{height:7px;border-radius:6px;background:var(--steel);margin:7px 0 5px;position:relative}
.crow .bar i{position:absolute;top:0;bottom:0;border-radius:6px}.crow .t{font-size:11.5px;color:var(--muted)}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.rec .v{font-family:var(--fmono);font-size:22px;font-weight:700;color:var(--text)}.rec .l{font-size:11px;color:var(--muted);margin-top:2px}
.ai{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:2px 16px 14px}
.ai h4{font-family:var(--fdisplay);text-transform:uppercase;font-size:14px;margin:14px 0 5px;color:var(--bone)}.ai p{margin:4px 0}.ai ul{margin:4px 0;padding-left:20px}.ai li{margin:3px 0}
.fl{display:inline-block;padding:2px 8px;border-radius:999px;font-family:var(--fmono);font-size:10px;font-weight:600;letter-spacing:.04em}
.fl-high{background:rgba(220,38,38,.16);color:#F87171}.fl-low{background:rgba(245,158,11,.16);color:#FBBF24}.fl-critical{background:var(--danger);color:#fff}
details{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 4px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:10px 12px;list-style:none}
.rd{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-top:6px;background:var(--card);animation:fade .45s ease both}
.rd .sc{font-family:var(--fmono);font-size:38px;font-weight:700;line-height:1;min-width:66px;text-align:center;padding-top:2px}
.rd .nm{font-family:var(--fdisplay);text-transform:uppercase;letter-spacing:.02em;font-size:16px;font-weight:600}.rd .mt{font-size:12px;color:var(--muted);margin-top:4px}
.rd-green{border-color:rgba(16,185,129,.4)}.rd-green .sc{color:var(--ok2)}
.rd-amber{border-color:rgba(245,158,11,.4)}.rd-amber .sc{color:var(--warn)}
.rd-red{border-color:rgba(220,38,38,.45)}.rd-red .sc{color:#F87171}
.rd ul{margin:4px 0 0;padding-left:18px}.rd li{font-size:12px;margin:2px 0}
.al{background:rgba(220,38,38,.16);color:#F87171;border-radius:8px;padding:4px 9px;font-size:11.5px;margin-top:6px;display:inline-block}
.rem{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#93C5FD;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-top:10px}
.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-top:10px}
.lt{margin:8px 0}.lt .row{font-size:12.5px;display:flex;justify-content:space-between}
.lt .b{height:7px;background:var(--steel);border-radius:6px;position:relative;margin-top:4px}
.lt .b i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.lt .b s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text)}
.lt2{margin:11px 0;border-bottom:1px solid var(--line);padding-bottom:9px}.lt2:last-child{border-bottom:none;padding-bottom:0}
.lt2 .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;gap:8px}
.lt2 .spk{display:block;width:100%;height:40px;margin-top:5px}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
ul.tight{margin:6px 0 0;padding-left:18px;font-size:12.5px}ul.tight li{margin:2px 0}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style></head><body><div class="wrap">
<h1>🫀 Health Cockpit <span style="color:var(--red)">Vadym</span></h1><div class="sub" id="sub">Завантаження…</div>
<a class="dlbtn" href="#" onclick="window.open('report.html'+location.hash);return false">⬇️ Звіт для лікаря (PDF)</a>
<nav class="nav"><a href="#g-today">🔝 Сьогодні</a><a href="#g-sleep">😴 Сон</a><a href="#g-stress">🧠 Стрес</a><a href="#g-heart">❤️ Серце</a><a href="#g-fit">🏃 Форма</a><a href="#g-ins">🔍 Інсайти</a><a href="#g-trend">📈 Тренди</a><a href="#g-ref">📚 Довідка</a></nav>
<div id="root"></div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function spark(vals,col){vals=(vals||[]).map(num).filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return '';const w=200,h=34,mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;const pts=vals.map((v,i)=>((i/(vals.length-1))*w).toFixed(1)+','+(h-3-((v-mn)/rng)*(h-6)).toFixed(1));const ly=pts[pts.length-1].split(',')[1];return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="'+(w-1.5)+'" cy="'+ly+'" r="2.3" fill="'+col+'"/></svg>';}
function delta(cur,prev,good){cur=num(cur);prev=num(prev);if(cur==null||prev==null||!prev)return '<span class="delta flat">—</span>';const dp=(cur-prev)/prev*100;const better=good==='lower'?cur<prev:cur>prev;const cls=Math.abs(dp)<1.5?'flat':(better?'up':'down');const ar=dp>0?'▲':(dp<0?'▼':'•');return '<span class="delta '+cls+'">'+ar+' '+Math.abs(dp).toFixed(0)+'%</span>';}
function kc(lab,val,unit,sub,d,sp){return '<div class="card"><div class="lab"><span>'+lab+'</span>'+(d||'')+'</div><div class="big">'+val+'<small> '+(unit||'')+'</small></div><div class="meta">'+(sub||'')+'</div>'+(sp||'')+'</div>';}
function grp(t,id){return '<div class="grp"'+(id?' id="'+id+'"':'')+'>'+t+'</div>';}
function flagBadge(fl){if(!fl||fl==='normal')return '<span class="sub">норма</span>';const m={high:'вище',low:'нижче',critical:'критично'};return '<span class="fl fl-'+fl+'">'+(m[fl]||fl)+'</span>';}
function labRow(r){const ref=(r.ref_low!=null||r.ref_high!=null)?((r.ref_low!=null?f(r.ref_low,2):'')+'–'+(r.ref_high!=null?f(r.ref_high,2):'')):'';const val=r.value!=null?('<b>'+f(r.value,2)+'</b> '+esc(r.unit||'')):esc(r.value_text||'—');return '<tr><td>'+esc(r.raw_name)+'</td><td>'+val+'</td><td class="sub">'+ref+'</td><td>'+flagBadge(r.flag)+'</td></tr>';}
function readiness(rd){
 if(!rd)return '';
 const r=rd.recovery||rd, ld=rd.load||{};
 if(r.score==null)return '';
 const sc=num(r.score);const cls=sc>=75?'rd-green':(sc>=55?'rd-amber':'rd-red');
 let mt='😴 Сон '+f(r.sleep,1)+' год · 📈 HRV '+f(r.hrv)+'/'+f(r.hrv_base)+' · ❤️ нічний пульс '+f(r.rhr)+'/'+f(r.rhr_base);
 const al=(r.alerts||[]);const t100=(r.to100||[]);
 let h='<div class="rd '+cls+'"><div class="sc">'+sc+'</div><div style="flex:1"><div class="nm">🌙 Відновлення: '+esc(r.status)+' <span class="sub" style="font-weight:400">(за ніч · фіксується зранку)</span></div><div class="mt">'+mt+'</div>';
 if(al.length)h+='<div class="al">⚠️ '+al.map(esc).join('; ')+'</div>';
 if(t100.length){h+='<div class="mt" style="margin-top:7px"><b>🎯 Щоб відновлення ближче до 100:</b></div><ul>';for(const a of t100.slice(0,3))h+='<li>'+esc(a.text)+(a.gain?' <span class="sub">(≈ +'+a.gain+')</span>':'')+'</li>';h+='</ul>';}
 h+='</div></div>';
 const acwr=ld.acwr!=null?num(ld.acwr):null;
 const lvlcol=ld.level==='висока'?'#E30613':(ld.level==='низька'?'#F59E0B':'#10B981');
 const stp=num(ld.steps)||0, goal=num(ld.steps_goal)||8000; const pct=Math.min(100,stp/goal*100);
 let lh='<div class="rd" style="background:var(--card);margin-top:10px"><div style="flex:1"><div class="nm">⚡ Денне навантаження <span class="sub" style="font-weight:400">(зростає протягом дня)</span></div>';
 lh+='<div class="mt">👟 '+f(stp)+' / '+f(goal)+' кроків · 🔥 '+f(ld.active)+' ккал'+(ld.exercise!=null?' · 🏋️ '+f(ld.exercise)+' хв трен.':'')+'</div>';
 lh+='<div class="b" style="height:8px;background:#2A2A2A;border-radius:6px;position:relative;margin-top:8px;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:'+pct+'%;background:#10B981"></i></div>';
 lh+='<div class="mt">Навантаження 7д:28д <b style="color:'+lvlcol+'">'+(acwr!=null?acwr:'—')+' '+esc(ld.level||'')+'</b> · '+esc(ld.note||'')+'</div>';
 lh+='</div></div>';
 return h+lh;
}
function illnessBanner(il){
 if(!il||!il.level||il.level==='низький')return '';
 const sig=(il.signals||[]).map(esc).join(', ');
 return '<div class="warn">🌡 <b>Раннє попередження ('+esc(il.level)+'):</b> '+esc(il.note)+(sig?' — '+sig:'')+'</div>';
}
function strainBlock(wh){
 if(!wh||!wh.strain||wh.strain.strain==null)return '';
 const s=wh.strain, sc=wh.strain_coach||{}, bal=wh.balance||{};
 const v=num(s.strain); const cls=v>=14?'rd-red':(v>=10?'rd-amber':'rd-green');
 let h='<h2>⚡ Навантаження сьогодні (Strain 0–21)</h2><div class="rd '+cls+'"><div class="sc">'+f(v,1)+'</div><div style="flex:1"><div class="nm">'+esc(s.level)+' <span class="sub" style="font-weight:400">/ 21 · сер. 7д '+f(s.avg7,1)+'</span></div>';
 if(sc.target_low!=null)h+='<div class="mt">🎯 ціль під відновлення: <b>'+f(sc.target_low)+'–'+f(sc.target_high)+'</b> · '+esc(sc.advice||'')+'</div>';
 if(bal.status)h+='<div class="mt">⚖️ 7д баланс: strain '+f(bal.avg_strain,1)+' vs recovery '+f(bal.avg_recovery)+' — '+esc(bal.status)+'</div>';
 h+='</div></div>';
 return h;
}
function hydrationBlock(D){
 const w=D.water||{}, a=D.adherence||{};
 if(w.today==null && a.pct==null)return '';
 let h='<h2>💧 Гідратація та адгезія</h2><div class="cards">';
 if(w.today!=null)h+=kc('Вода сьогодні',f(w.today),'мл','ціль '+f(w.target||2000),num(w.today)>=1500?'<span class="delta up">ок</span>':'<span class="delta down">мало</span>');
 if(w.avg7!=null)h+=kc('Вода сер. 7д',f(w.avg7),'мл/день',num(w.avg7)>=1500?'добре':'повна картина за тиждень логів','');
 if(a.pct!=null){const collecting=num(a.pct)<30;h+=kc('Адгезія добавок',f(a.pct),'%','7 днів · за TG-кнопками',collecting?'<span class="delta flat">збираємо дані</span>':(num(a.pct)>=80?'<span class="delta up">добре</span>':'<span class="delta down">підтягни</span>'));}
 h+='</div>';return h;
}
function remindersBlock(rem){
 if(!rem||!rem.length)return '';
 const rs=rem.slice().sort((a,b)=>(a.days??999)-(b.days??999));
 const top=rs.slice(0,4);
 let h='<h2>🗓 Найближчі контролі</h2><div class="panel"><table><tbody>';
 for(const r of top){const dc=r.days<=7?'#F87171':(r.days<=30?'#FBBF24':'#8A8A8A');
  h+='<tr><td>'+esc(r.title)+'</td><td class="sub" style="white-space:nowrap">'+esc(r.due||'')+'</td><td style="text-align:right;white-space:nowrap"><span class="delta flat" style="color:'+dc+'">'+(r.days>0?('через '+f(r.days)+' дн'):'сьогодні')+'</span></td></tr>';}
 h+='</tbody></table>';
 if(rs.length>top.length)h+='<div style="padding:0 14px 10px"><a href="#g-ref" class="sub" style="color:#93C5FD;text-decoration:none">усі '+rs.length+' → календар контролів</a></div>';
 h+='</div>';return h;
}
function allReminders(rem){
 if(!rem||!rem.length)return '';
 const rs=rem.slice().sort((a,b)=>(a.days??999)-(b.days??999));
 let h='<h2>🗓 Календар контролів</h2><div class="panel"><table><tbody>';
 for(const r of rs)h+='<tr><td class="sub" style="white-space:nowrap">'+esc(r.due||'')+'</td><td>'+esc(r.title)+'</td><td class="sub" style="white-space:nowrap">'+(r.days>0?'через '+r.days+' дн':'сьогодні')+'</td></tr>';
 h+='</tbody></table></div>';return h;
}
function resilienceBlock(o){
 if(!o)return '';const rz=o.resilience;
 if(!rz||!rz.level||rz.level==='немає даних')return '';
 const idx=num(rz.index); const cls=idx>=70?'rd-green':(idx>=55?'rd-amber':'rd-red');
 return '<h2>🧬 Стійкість до стресу (14 днів)</h2><div class="rd '+cls+'"><div class="sc">'+idx+'</div><div style="flex:1"><div class="nm">'+esc(rz.level)+'</div><div class="mt">🌙 нічне відновлення '+f(rz.night_recovery)+'/100 · 🔋 денне '+f(rz.day_recovery_min)+' хв · 🌡 стрес-навантаження '+f(rz.stress_load_pct)+'%</div><div class="mt">'+esc(rz.note||'')+'</div></div></div>';
}
function trendsBlock(t){
 if(!t)return '';
 const rec=(t.recovery||[]).map(x=>x.v), str=(t.strain||[]).map(x=>x.v);
 const hasRec=rec.filter(v=>v!=null).length>=2, hasStr=str.filter(v=>v!=null).length>=2;
 if(!hasRec&&!hasStr)return '';
 let h='<h2>📈 Тренд відновлення й навантаження (14 днів)</h2><div class="cards">';
 if(hasRec)h+=kc('Відновлення сер.',f(t.rec_avg),'/100','остання '+f(rec[rec.length-1])+' · 14 днів',num(t.rec_avg)>=70?'<span class="delta up">добре</span>':'<span class="delta flat">—</span>',spark(rec,'#34D399'));
 if(hasStr)h+=kc('Strain сер.',f(t.strain_avg,1),'/21','остання '+f(str[str.length-1],1)+' · 14 днів','',spark(str,'#F59E0B'));
 h+='</div>';return h;
}
function moodBlock(m){
 if(!m||!num(m.n))return '';
 const v=num(m.last); const col=v>=0.15?'#10B981':(v>-0.15?'#F59E0B':'#E30613');
 return '<h2>🙂 Настрій (State of Mind)</h2><div class="cards">'+kc('Останній',esc(m.label||''),'','сер.7д '+f(m.avg7,2)+' · '+f(m.n)+' записів','<span class="delta flat" style="color:'+col+'">'+(v>=0?'+':'')+f(v,2)+'</span>',spark(m.series,'#A855F7'))+'</div>';
}
function stressBlock(o,wh){
 const ds=o&&o.daytime_stress; if(!ds||!(num(ds.n)>0))return '';
 const ss=(wh&&wh.stress_score)||{};

 if(s.dsup!=null)h+=kc('Подвійна опора',f(s.dsup,1),'%','норма ~20–40','');
 h+=kc('Сходи',f(s.flights),'/день','','');
 h+='</div>';
 h+='<h2>👂 Слух та активність (сер. 30 дн)</h2><div class="cards">';
 h+=kc('Гучність навушників',f(s.hp_audio),'дБ',num(s.hp_audio)<80?'безпечно ✅':'високо ⚠️','');
 h+=kc('Шум середовища',f(s.env_audio),'дБ','','');
 h+=kc('Денне світло',f(s.daylight),'хв/день',num(s.daylight)>=40?'добре':'мало — більше зранку','');
 h+=kc('Час стоячи',f(s.stand_min),'хв/день','','');
 h+='</div>';return h;
}
function nutrition(nn){
 if(!nn||(nn.kcal==null&&nn.protein==null&&nn.carbs==null&&nn.fat==null&&nn.fiber==null))return '';
 let h='<h2>🍽 Харчування (сер. 30 дн)</h2><div class="cards">';
 if(nn.kcal!=null)h+=kc('Калорії',f(nn.kcal),'ккал','','');
 if(nn.protein!=null)h+=kc('Білок',f(nn.protein),'г','','');
 if(nn.carbs!=null)h+=kc('Вуглеводи',f(nn.carbs),'г','','');
 if(nn.fat!=null)h+=kc('Жири',f(nn.fat),'г','','');
 if(nn.fiber!=null)h+=kc('Клітковина',f(nn.fiber),'г','','');
 h+='</div>';return h;
}
function historyBlock(hist){
 if(!hist||!hist.length)return '';
 let h='<h2>🧬 Анамнез та вакцинація</h2><div class="panel"><table><tbody>';
 for(const x of hist)h+='<tr><td><b>'+esc(x.title)+'</b><br><span class="sub">'+esc(x.body||'')+'</span></td></tr>';
 h+='</tbody></table></div>';return h;
}
function render(D){
 const k=D.kpi||{},co=D.corr||{},rc=D.records||{},mon=D.monthly||[],wk=D.workouts||{},cov=D.coverage||[],labs=D.labs||{},meds=D.meds||[],img=D.imaging||[],rem=D.reminders||[];
 const ser=c=>mon.map(r=>num(r[c]));
 const lastD=(cov||[]).map(c=>c.last).filter(Boolean).sort().pop();
 const todayStr=new Date().toISOString().slice(0,10);
 const fresh=lastD===todayStr?'🟢 дані за сьогодні':'🟠 останні дані: '+(lastD||'—');
 document.getElementById('sub').innerHTML=fresh+' · оновлено '+new Date(D.generated_at).toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'})+' · <span class="sub">'+f(k.total)+' замірів з '+(k.since||'')+'</span>';
 let h='';
 h+=grp('🔝 СЬОГОДНІ','g-today');
 h+=illnessBanner(D.illness);
 h+=readiness(D.readiness);
 h+=strainBlock(D.whoop);
 h+=stressBlock(D.oura,D.whoop);
 h+=hydrationBlock(D);
 h+=remindersBlock(rem);
 h+=grp('😴 СОН','g-sleep');
 h+=sleepBlock(D);
 h+=grp('🧠 СТРЕС І СТІЙКІСТЬ (14 ДНІВ)','g-stress');
 h+=resilienceBlock(D.oura);
 h+=trendsBlock(D.trends);
 h+=contributorsBlock(D.oura);
 h+=moodBlock(D.mood);
 h+=grp('❤️ СЕРЦЕ · ДОВГОЛІТТЯ · АНАЛІЗИ','g-heart');
 h+=ageBlock(D.oura,D.whoop);
 h+=cvRisk(D.cv);
 h+=bpBlock(D.bp);
 h+=labsBlock(labs,rem);
 h+=labTrendsBlock(D.lab_trends);
 h+=grp('🏃 ФОРМА І АКТИВНІСТЬ','g-fit');
 h+=formBlock(D.form);
 h+=zone2Block(D.zone2);
 h+=workoutsBlock(wk);
 h+=workoutZones(D.whoop);
 h+=strengthCard(D.strength);
 h+=bodyComp(D.body);
 h+=streaksBlock(D.streaks,D.sleep_window);
 h+=grp('🔍 ЩО ВПЛИВАЄ НА ТЕБЕ','g-ins');
 h+=insightsBlock(D.oura,D.whoop);
 h+=aiBlock(D.insights,D.insights_history);
 h+=grp('📈 ДОВГОСТРОКОВІ ТРЕНДИ','g-trend');
 h+='<h2>Огляд · 90 днів <span class="sub" style="text-transform:none;letter-spacing:0">(графік — помісячна динаміка)</span></h2><div class="cards">';
 h+=kc('Пульс спокою',f(k.rhr_90),'уд/хв','зараз '+f(k.rhr_last),delta(k.rhr_90,k.rhr_prev,'lower'),spark(ser('resting_hr'),'#E30613'));
 h+=kc('HRV',f(k.hrv_90),'мс','',delta(k.hrv_90,k.hrv_prev,'higher'),spark(ser('hrv_ms'),'#3B82F6'));
 h+=kc('VO₂max',f(k.vo2_180,1),'','180 дн','',spark(ser('vo2max'),'#A855F7'));
 h+=kc('Сон',f(k.sleep_90,1),'год','норма 7-9',delta(k.sleep_90,k.sleep_prev,'higher'),spark(ser('sleep_hours'),'#22D3EE'));
 h+=kc('Кроки',f(k.steps_90),'/день','',delta(k.steps_90,k.steps_prev,'higher'),spark(ser('steps'),'#10B981'));
 h+=kc('Активні ккал',f(k.act_90),'/день','','',spark(ser('active_kcal'),'#EC4899'));
 h+=kc('Тренування',f(k.ex_90),'хв/день','','',spark(ser('exercise_min'),'#22D3EE'));
 h+=kc('Вага',f(k.w_last,1),'кг','','',spark(ser('weight_kg'),'#F59E0B'));
 h+='</div>';
 h+='<h2>Тренди (помісячно)<span class="pb" id="pb"><button data-m="12">1р</button><button data-m="36">3р</button><button data-m="0" class="on">Усе</button></span></h2><div class="charts" id="charts"></div>';
 let ce='<h2>Звʼязки та рекорди</h2><details><summary>Показати звʼязки показників і рекорди</summary><div style="padding:6px 8px"><div class="corr">';
 const CD=[['hrv_rhr','HRV ↔ Пульс спокою'],['sleep_hrv','Сон ↔ HRV'],['sleep_rhr','Сон ↔ Пульс'],['ex_rhr','Тренування ↔ Пульс'],['vo2_rhr','VO₂max ↔ Пульс'],['day_sleep','Світло ↔ Сон']];
 for(const [key,lab] of CD){const r=num(co[key]);if(r==null)continue;const w=Math.min(100,Math.abs(r)*100);const pos=r>=0;const col=pos?'#3B82F6':'#E30613';const strong=Math.abs(r)>=0.3;ce+='<div class="crow"><div class="p">'+lab+' <span style="color:'+(strong?'#3B82F6':'#8A8A8A')+'">r='+r.toFixed(2)+'</span></div><div class="bar"><i style="left:'+(pos?'50%':(50-w/2)+'%')+';width:'+(w/2)+'%;background:'+col+'"></i><span style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3A3A3A"></span></div><div class="t">'+(strong?'виражений звʼязок':'слабкий')+' · 180 дн</div></div>';}
 ce+='</div><div class="recs" style="margin-top:10px">';
 ce+='<div class="rec"><div class="v">'+f(rc.rhr_min)+'</div><div class="l">мін. пульс спокою</div></div>';
 ce+='<div class="rec"><div class="v">'+f(rc.hrv_max)+'</div><div class="l">пік HRV</div></div>';
 ce+='<div class="rec"><div class="v">'+f(rc.vo2_max,1)+'</div><div class="l">пік VO₂max</div></div>';
 ce+='<div class="rec"><div class="v">'+f(rc.steps_max)+'</div><div class="l">рекорд кроків</div></div>';
 ce+='<div class="rec"><div class="v">'+f(rc.d10k)+'</div><div class="l">днів ≥10k кроків</div></div>';
 ce+='<div class="rec"><div class="v">'+f(rc.dex30)+'</div><div class="l">днів трен. ≥30хв</div></div>';
 ce+='</div></div></details>';
 h+=ce;
 h+=grp('📚 ДОВІДКА','g-ref');
 h+=secondary(D.secondary);
 h+=nutrition(D.nutrition);
 h+=historyBlock(D.history);
 if(meds.length){h+='<h2>💊 Препарати та добавки</h2><div class="panel"><table><thead><tr><th>Назва</th><th>Графік</th><th>Призначення</th></tr></thead><tbody>';for(const m of meds)h+='<tr><td><b>'+esc(m.name)+'</b></td><td class="sub">'+esc(m.schedule||'')+'</td><td class="sub">'+esc(m.purpose||'')+'</td></tr>';h+='</tbody></table></div>';}
 if(img.length){h+='<h2>🩻 Обстеження та висновки</h2><div class="panel"><table><tbody>';for(const j of img)h+='<tr><td class="sub" style="white-space:nowrap;vertical-align:top">'+esc(j.d||'')+'</td><td><b>'+esc(j.title||'')+'</b><br><span class="sub">'+esc(j.body||'')+'</span></td></tr>';h+='</tbody></table></div>';}
 h+=allReminders(rem);
 h+='<h2>Що відстежується ('+cov.length+')</h2><details><summary>Показати реєстр</summary><table><tbody>';for(const c of cov){h+='<tr><td>'+esc(c.name_uk||'')+'</td><td>'+f(c.days)+' дн</td><td class="sub">'+(c.last||'')+'</td></tr>';}h+='</tbody></table></details>';
 document.getElementById('root').innerHTML=h;
 const defs=[['resting_hr','Пульс спокою','#E30613'],['hrv_ms','HRV','#3B82F6'],['vo2max','VO₂max','#A855F7'],['sleep_hours','Сон','#22D3EE'],['weight_kg','Вага','#F59E0B'],['steps','Кроки','#10B981'],['active_kcal','Активні ккал','#EC4899'],['walking_speed','Швидкість ходи','#94A3B8']];
 let chs=[];
 const draw=mm=>{const host=document.getElementById('charts');host.innerHTML='';chs.forEach(c=>c.destroy());chs=[];
  for(const [code,name,col] of defs){const vals=mm.map(r=>num(r[code]));if(vals.every(v=>v==null))continue;const box=document.createElement('div');box.className='cbox';box.innerHTML='<h4>'+name+'</h4><div class="cw"><canvas></canvas></div>';host.appendChild(box);chs.push(new Chart(box.querySelector('canvas'),{type:'line',data:{labels:mm.map(r=>r.m),datasets:[{data:vals,borderColor:col,backgroundColor:col+'14',fill:true,tension:.25,pointRadius:0,borderWidth:2,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,color:'#8A8A8A',font:{size:9}},grid:{display:false}},y:{ticks:{color:'#8A8A8A',font:{size:9}},grid:{color:'#2A2A2A'}}}}}));}};
 draw(mon);
 document.querySelectorAll('#pb button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#pb button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const n=parseInt(b.dataset.m,10);draw(n?mon.slice(-n):mon);};});
}
(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 if(!t){document.getElementById('sub').innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 fetch(API+'?k='+encodeURIComponent(t)).then(r=>r.json()).then(D=>{
   if(!D||D.error){document.getElementById('sub').innerHTML='<div class="msg">Невірний токен або немає даних.</div>';return;}
   render(D);
 }).catch(e=>{document.getElementById('sub').innerHTML='<div class="msg">Помилка завантаження: '+e+'</div>';});
})();
</script></body></html>
