<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Cockpit</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1a1d21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:21px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin:26px 0 10px}
.sub{color:#6b7280;font-size:12.5px}
.dlbtn{display:inline-block;margin-top:10px;background:#1f3a5f;color:#fff;text-decoration:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:13px 15px}
.card .lab{color:#6b7280;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.card .big{font-size:23px;font-weight:650;margin-top:3px}.card .big small{font-size:12px;font-weight:500;color:#6b7280}
.card .meta{font-size:11px;color:#6b7280;margin-top:2px}
.card .spk{display:block;width:100%;height:30px;margin-top:8px}
.delta{font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;white-space:nowrap}
.up{background:#e6f4ea;color:#1a7f37}.down{background:#fde8e8;color:#b42318}.flat{background:#eef0f2;color:#6b7280}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cbox{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:11px 13px}
.cbox h4{margin:0 0 2px;font-size:13px}.cbox .cw{position:relative;height:160px}
.panel{background:#fff;border:1px solid #e6e8eb;border-radius:13px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 14px;border-bottom:1px solid #f0f1f3;font-size:13px}
th{color:#6b7280;font-weight:600;font-size:11px;text-transform:uppercase}tr:last-child td{border-bottom:none}
.corr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.crow{background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:11px 13px}
.crow .p{font-size:13px;font-weight:600}.crow .bar{height:7px;border-radius:6px;background:#eef0f2;margin:7px 0 5px;position:relative}
.crow .bar i{position:absolute;top:0;bottom:0;border-radius:6px}.crow .t{font-size:11.5px;color:#6b7280}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rec{background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:11px;text-align:center}
.rec .v{font-size:20px;font-weight:650}.rec .l{font-size:11px;color:#6b7280;margin-top:2px}
.ai{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:2px 16px 14px}
.ai h4{font-size:14px;margin:14px 0 5px}.ai p{margin:4px 0}.ai ul{margin:4px 0;padding-left:20px}.ai li{margin:3px 0}
.fl{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
.fl-high{background:#fde8e8;color:#b42318}.fl-low{background:#fef0e2;color:#b54708}.fl-critical{background:#b42318;color:#fff}
details{margin-top:8px;background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:0 4px}
summary{cursor:pointer;color:#6b7280;font-size:12.5px;padding:9px 12px;list-style:none}
.rd{display:flex;gap:14px;align-items:flex-start;border:1px solid #e6e8eb;border-radius:14px;padding:14px 16px;margin-top:6px}
.rd .sc{font-size:34px;font-weight:700;line-height:1;min-width:64px;text-align:center;padding-top:4px}
.rd .nm{font-size:15px;font-weight:650}.rd .mt{font-size:12px;color:#6b7280;margin-top:3px}
.rd-green{background:#eaf7ee;border-color:#bfe3c9}.rd-amber{background:#fdf4e8;border-color:#f3d9b0}.rd-red{background:#fdeaea;border-color:#f3c0c0}
.rd ul{margin:4px 0 0;padding-left:18px}.rd li{font-size:12px;margin:2px 0}
.al{background:#fde8e8;color:#b42318;border-radius:8px;padding:4px 8px;font-size:11.5px;margin-top:5px;display:inline-block}
.rem{background:#eef2ff;border:1px solid #cdd6ff;color:#3538cd;border-radius:11px;padding:9px 13px;font-size:12.5px;margin-top:8px}
.warn{background:#fff4ec;border:1px solid #f3d9b0;color:#b54708;border-radius:11px;padding:9px 13px;font-size:12.5px;margin-top:8px}
.lt{margin:8px 0}.lt .row{font-size:12.5px;display:flex;justify-content:space-between}
.lt .b{height:7px;background:#eef0f2;border-radius:6px;position:relative;margin-top:4px}
.lt .b i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.lt .b s{position:absolute;top:-2px;bottom:-2px;width:2px;background:#1a1d21}
.lt2{margin:11px 0;border-bottom:1px solid #f0f1f3;padding-bottom:9px}.lt2:last-child{border-bottom:none;padding-bottom:0}
.lt2 .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;gap:8px}
.lt2 .spk{display:block;width:100%;height:40px;margin-top:5px}
.msg{padding:40px 16px;text-align:center;color:#6b7280}
ul.tight{margin:6px 0 0;padding-left:18px;font-size:12.5px}ul.tight li{margin:2px 0}
</style></head><body><div class="wrap">
<h1>🫀 Health Cockpit</h1><div class="sub" id="sub">Завантаження…</div>
<a class="dlbtn" href="#" onclick="window.open('report.html'+location.hash);return false">⬇️ Звіт для лікаря (PDF)</a>
<div id="root"></div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function spark(vals,col){vals=(vals||[]).map(num).filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return '';const w=200,h=34,mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;const pts=vals.map((v,i)=>((i/(vals.length-1))*w).toFixed(1)+','+(h-3-((v-mn)/rng)*(h-6)).toFixed(1));const ly=pts[pts.length-1].split(',')[1];return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="'+(w-1.5)+'" cy="'+ly+'" r="2.3" fill="'+col+'"/></svg>';}
function delta(cur,prev,good){cur=num(cur);prev=num(prev);if(cur==null||prev==null||!prev)return '<span class="delta flat">—</span>';const dp=(cur-prev)/prev*100;const better=good==='lower'?cur<prev:cur>prev;const cls=Math.abs(dp)<1.5?'flat':(better?'up':'down');const ar=dp>0?'▲':(dp<0?'▼':'•');return '<span class="delta '+cls+'">'+ar+' '+Math.abs(dp).toFixed(0)+'%</span>';}
function kc(lab,val,unit,sub,d,sp){return '<div class="card"><div class="lab"><span>'+lab+'</span>'+(d||'')+'</div><div class="big">'+val+'<small> '+(unit||'')+'</small></div><div class="meta">'+(sub||'')+'</div>'+(sp||'')+'</div>';}
function flagBadge(fl){if(!fl||fl==='normal')return '<span class="sub">норма</span>';const m={high:'вище',low:'нижче',critical:'критично'};return '<span class="fl fl-'+fl+'">'+(m[fl]||fl)+'</span>';}
function labRow(r){const ref=(r.ref_low!=null||r.ref_high!=null)?((r.ref_low!=null?f(r.ref_low,2):'')+'–'+(r.ref_high!=null?f(r.ref_high,2):'')):'';const val=r.value!=null?('<b>'+f(r.value,2)+'</b> '+esc(r.unit||'')):esc(r.value_text||'—');return '<tr><td>'+esc(r.raw_name)+'</td><td>'+val+'</td><td class="sub">'+ref+'</td><td>'+flagBadge(r.flag)+'</td></tr>';}
function readiness(rd){
 if(!rd)return '';
 const r=rd.recovery||rd, ld=rd.load||{};
 if(r.score==null)return '';
 const sc=num(r.score);const cls=sc>=75?'rd-green':(sc>=55?'rd-amber':'rd-red');
 let mt='😴 Сон '+f(r.sleep,1)+' год · 📈 HRV '+f(r.hrv)+'/'+f(r.hrv_base)+' · ❤️ нічний пульс '+f(r.rhr)+'/'+f(r.rhr_base);
 const al=(r.alerts||[]);const t100=(r.to100||[]);
 let h='<div class="rd '+cls+'"><div class="sc">'+sc+'</div><div style="flex:1"><div class="nm">🌙 Відновлення: '+esc(r.status)+' <span class="sub" style="font-weight:400">(за ніч · фіксується зранку)</span></div><div class="mt">'+mt+'</div>';
 if(al.length)h+='<div class="al">⚠️ '+al.map(esc).join('; ')+'</div>';
 if(t100.length){h+='<div class="mt" style="margin-top:7px"><b>🎯 Щоб відновлення ближче до 100:</b></div><ul>';for(const a of t100.slice(0,3))h+='<li>'+esc(a.text)+(a.gain?' <span class="sub">(≈ +'+a.gain+')</span>':'')+'</li>';h+='</ul>';}
 h+='</div></div>';
 const acwr=ld.acwr!=null?num(ld.acwr):null;
 const lvlcol=ld.level==='висока'?'#b42318':(ld.level==='низька'?'#b54708':'#1a7f37');
 const stp=num(ld.steps)||0, goal=num(ld.steps_goal)||8000; const pct=Math.min(100,stp/goal*100);
 let lh='<div class="rd" style="background:#fff;margin-top:10px"><div style="flex:1"><div class="nm">⚡ Денне навантаження <span class="sub" style="font-weight:400">(зростає протягом дня)</span></div>';
 lh+='<div class="mt">👟 '+f(stp)+' / '+f(goal)+' кроків · 🔥 '+f(ld.active)+' ккал'+(ld.exercise!=null?' · 🏋️ '+f(ld.exercise)+' хв трен.':'')+'</div>';
 lh+='<div class="b" style="height:8px;background:#eef0f2;border-radius:6px;position:relative;margin-top:8px;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:'+pct+'%;background:#1a7f37"></i></div>';
 lh+='<div class="mt">Навантаження 7д:28д <b style="color:'+lvlcol+'">'+(acwr!=null?acwr:'—')+' '+esc(ld.level||'')+'</b> · '+esc(ld.note||'')+'</div>';
 lh+='</div></div>';
 return h+lh;
}
function illnessBanner(il){
 if(!il||!il.level||il.level==='низький')return '';
 const sig=(il.signals||[]).map(esc).join(', ');
 return '<div class="warn">🌡 <b>Раннє попередження ('+esc(il.level)+'):</b> '+esc(il.note)+(sig?' — '+sig:'')+'</div>';
}
function strainCard(s){
 if(!s||s.recovery==null)return '';
 const pct=Math.min(100,num(s.pct)||0);
 let h='<h2>⚡ Ціль навантаження сьогодні</h2><div class="panel" style="padding:12px 15px">';
 h+='<div style="font-size:13.5px"><b>'+esc(s.level||'')+'</b> <span class="sub">· під відновлення '+f(s.recovery)+'/100</span></div>';
 h+='<div class="sub" style="margin-top:5px">Активність '+f(s.done_kcal)+' / '+f(s.target_kcal)+' ккал · Тренування '+f(s.done_min)+' / '+f(s.target_min)+' хв</div>';
 h+='<div class="b" style="height:8px;background:#eef0f2;border-radius:6px;position:relative;margin-top:8px;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:'+pct+'%;background:#1a7f37"></i></div></div>';
 return h;
}
function whoopBlocks(wh){
 if(!wh)return '';
 let h='';
 const s=wh.strain, sc=wh.strain_coach, bal=wh.balance;
 if(s&&s.strain!=null){
   const v=num(s.strain); const cls=v>=14?'rd-red':(v>=10?'rd-amber':'rd-green');
   h+='<h2>⚡ Strain 0–21 (WHOOP-стиль)</h2><div class="rd '+cls+'"><div class="sc">'+f(v,1)+'</div><div style="flex:1"><div class="nm">'+esc(s.level)+' <span class="sub" style="font-weight:400">· сер. 7д '+f(s.avg7,1)+'</span></div>';
   if(sc)h+='<div class="mt">🎯 ціль сьогодні: '+f(sc.target_low)+'–'+f(sc.target_high)+' · '+esc(sc.advice)+'</div>';
   if(bal&&bal.status)h+='<div class="mt">⚖️ 7д: strain '+f(bal.avg_strain,1)+' / recovery '+f(bal.avg_recovery)+' — '+esc(bal.status)+'</div>';
   h+='</div></div>';
 }
 let cards='';
 const sn=wh.sleep_need;
 if(sn&&sn.need!=null)cards+=kc('Потреба сну',f(sn.need,1),'год','отримав '+f(sn.last_sleep,1)+' · '+f(sn.performance_pct)+'%',num(sn.performance_pct)>=90?'<span class="delta up">ок</span>':'<span class="delta down">недобір</span>');
 const wa=wh.whoop_age;
 if(wa&&wa.whoop_age!=null)cards+=kc('WHOOP Age',f(wa.whoop_age),'р','pace '+f(wa.pace,2)+' · хроно '+wa.chrono_age,num(wa.delta)>0?'<span class="delta down">+'+f(wa.delta)+'р</span>':'<span class="delta up">'+f(wa.delta)+'р</span>');
 const ss=wh.stress_score;
 if(ss&&ss.score!=null)cards+=kc('Стрес',f(ss.score),'/3',esc(ss.label),num(ss.score)>=2?'<span class="delta down">'+esc(ss.label)+'</span>':'<span class="delta up">'+esc(ss.label)+'</span>');
 const se=wh.sleep_efficiency;
 if(se&&se.efficiency_pct!=null)cards+=kc('Ефективність сну',f(se.efficiency_pct),'%',esc(se.note),num(se.efficiency_pct)>=85?'<span class="delta up">ок</span>':'');
 if(cards)h+='<h2>🔴 WHOOP-показники</h2><div class="cards">'+cards+'</div>';
 if(sn&&num(sn.from_debt)>0)h+='<div class="sub" style="margin-top:4px">Потреба сну '+f(sn.need,1)+' год = базові 7.5 + борг '+f(sn.from_debt,1)+' + навантаження '+f(sn.from_strain,1)+'.</div>';
 if(wa&&wa.drivers)h+='<div class="sub" style="margin-top:4px">WHOOP Age драйвери (років): сон +'+f(wa.drivers['сон'],1)+' · регулярність +'+f(wa.drivers['регулярність'],1)+' · кроки +'+f(wa.drivers['кроки'],1)+' · VO₂max '+f(wa.drivers.VO2max,1)+' · пульс '+f(wa.drivers['пульс'],1)+'.</div>';
 const wz=wh.workout_zones;
 if(wz&&wz.z1!=null&&wz.n!==0){
   const seg=(v,c)=>num(v)>0?'<span style="height:12px;width:'+num(v)+'%;background:'+c+'"></span>':'';
   h+='<h2>🎽 Пульсові зони — '+esc(wz.type||'')+' '+esc(wz.date||'')+'</h2><div class="panel" style="padding:12px 15px">';
   h+='<div style="display:flex;border-radius:6px;overflow:hidden;height:12px;background:#eef0f2">'+seg(wz.z1,'#93c5fd')+seg(wz.z2,'#1a7f37')+seg(wz.z3,'#f5a623')+seg(wz.z4,'#f97316')+seg(wz.z5,'#b42318')+'</div>';
   h+='<div class="sub" style="margin-top:6px">Z1 '+f(wz.z1)+'% · Z2 '+f(wz.z2)+'% · Z3 '+f(wz.z3)+'% · Z4 '+f(wz.z4)+'% · Z5 '+f(wz.z5)+'% · <b>Zone2+ '+f(wz.zone2_plus)+'%</b></div></div>';
 }
 const bi=wh.behavior_insights;
 if(Array.isArray(bi)&&bi.length){
   h+='<h2>🔬 Behavior Insights (вплив звичок на відновлення)</h2><ul class="tight">';
   for(const x of bi)h+='<li>'+esc(x.text)+'</li>';
   h+='</ul>';
 }
 return h;
}
function ouraBlocks(o){
 if(!o)return '';
 let h='';
 const rz=o.resilience;
 if(rz&&rz.level&&rz.level!=='немає даних'){
   const idx=num(rz.index); const cls=idx>=70?'rd-green':(idx>=55?'rd-amber':'rd-red');
   h+='<h2>🧬 Стійкість до стресу (Resilience)</h2><div class="rd '+cls+'"><div class="sc">'+idx+'</div><div style="flex:1"><div class="nm">'+esc(rz.level)+' <span class="sub" style="font-weight:400">(14 днів)</span></div><div class="mt">🌙 нічне відновлення '+f(rz.night_recovery)+'/100 · 🔋 денне '+f(rz.day_recovery_min)+' хв · 🌡 стрес-навантаження '+f(rz.stress_load_pct)+'%</div><div class="mt">'+esc(rz.note||'')+'</div></div></div>';
 }
 const ds=o.daytime_stress;
 if(ds&&num(ds.n)>0){
   const seg=(v,c)=>num(v)>0?'<span style="height:12px;width:'+num(v)+'%;background:'+c+'"></span>':'';
   h+='<h2>🌡 Денний стрес та відновлення <span class="sub" style="text-transform:none;letter-spacing:0">(сьогодні)</span></h2><div class="panel" style="padding:12px 15px">';
   h+='<div style="font-size:13.5px"><b>рівень: '+esc(ds.level)+'</b> <span class="sub">· 🔴 '+f(ds.stress_min)+' хв стресу · 🟢 '+f(ds.recover_min)+' хв відновлення · 🏃 '+f(ds.active_min)+' хв рух</span></div>';
   h+='<div style="display:flex;border-radius:6px;overflow:hidden;margin-top:9px;height:12px;background:#eef0f2">'+seg(ds.restored_pct,'#1a7f37')+seg(ds.relaxed_pct,'#8bc34a')+seg(ds.engaged_pct,'#f5a623')+seg(ds.stressed_pct,'#b42318')+'</div>';
   h+='<div class="sub" style="margin-top:6px">🟢 спокій '+f(ds.restored_pct)+'% · 🟩 розслаблення '+f(ds.relaxed_pct)+'% · 🟧 залученість '+f(ds.engaged_pct)+'% · 🟥 стрес '+f(ds.stressed_pct)+'%</div></div>';
 }
 let cards='';
 const ch=o.chronotype;
 if(ch&&ch.type)cards+=kc('Хронотип',esc(ch.type),'',esc(ch.suggest||''),'');
 const ha=o.heart_age;
 if(ha&&ha.heart_age)cards+=kc('Вік серця',f(ha.heart_age),'р','хронологічно '+ha.chrono_age+' р',num(ha.delta)>0?'<span class="delta down">+'+f(ha.delta)+'р</span>':'<span class="delta up">'+f(ha.delta)+'р</span>');
 const tb=o.nighttime_breathing;
 if(tb&&tb.avg30!=null)cards+=kc('Нічне дихання',f(tb.avg30,1),'/год',esc(tb.flag||''),num(tb.avg30)>5?'<span class="delta down">стежити</span>':'<span class="delta up">ок</span>',spark((tb.series||[]).slice().reverse(),'#0891b2'));
 const td=o.temp_deviation;
 if(td&&td.deviation!=null)cards+=kc('Температура',(num(td.deviation)>=0?'+':'')+f(td.deviation,2),'°C','відхилення від норми',td.elevated?'<span class="delta down">підвищена</span>':'<span class="delta up">норма</span>',spark((td.series||[]).map(x=>x.dev),'#b54708'));
 const rt=o.restorative;
 if(rt&&rt.min!=null)cards+=kc('Відновлення вдень',f(rt.min),'хв',esc(rt.quality||''),num(rt.min)>=180?'<span class="delta up">ок</span>':'<span class="delta down">мало</span>');
 if(cards)h+='<h2>🫀 Розширені показники</h2><div class="cards">'+cards+'</div>';
 if(ha&&ha.factors)h+='<div class="sub" style="margin-top:5px">Вік серця, вплив (років): LDL +'+f(ha.factors.LDL,1)+' · гомоцистеїн +'+f(ha.factors['гомоцистеїн'],1)+' · non-HDL +'+f(ha.factors.non_HDL,1)+' · VO₂max '+f(ha.factors.VO2max,1)+' · пульс '+f(ha.factors['пульс_спокою'],1)+'. '+esc(ha.note||'')+'</div>';
 const rcz=o.readiness_contributors;
 if(Array.isArray(rcz)&&rcz.length){
   h+='<h2>📊 Внески у Відновлення</h2><div class="panel" style="padding:10px 14px">';
   for(const c of rcz){const sc=num(c.score);const col=sc>=75?'#1a7f37':(sc>=55?'#f5a623':'#b42318');
     h+='<div class="lt"><div class="row"><span>'+esc(c.name)+' <span class="sub">'+esc(c.val)+'</span></span><span><b>'+f(sc)+'</b></span></div><div class="b"><i style="width:'+Math.min(100,sc)+'%;background:'+col+'"></i></div></div>';}
   h+='</div>';
 }
 const dz=o.discoveries;
 if(Array.isArray(dz)&&dz.length){
   h+='<h2>🔍 Відкриття (звʼязки на твоїх даних)</h2><ul class="tight">';
   for(const x of dz)h+='<li>'+esc(x.text)+'</li>';
   h+='</ul>';
 }
 return h;
}
function hydrationBlock(D){
 const w=D.water||{}, a=D.adherence||{};

(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 if(!t){document.getElementById('sub').innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 fetch(API+'?k='+encodeURIComponent(t)).then(r=>r.json()).then(D=>{
   if(!D||D.error){document.getElementById('sub').innerHTML='<div class="msg">Невірний токен або немає даних.</div>';return;}
   render(D);
 }).catch(e=>{document.getElementById('sub').innerHTML='<div class="msg">Помилка завантаження: '+e+'</div>';});
})();
</script></body></html>
