<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Cockpit</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1a1d21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:21px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin:26px 0 10px}
.sub{color:#6b7280;font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:13px 15px}
.card .lab{color:#6b7280;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.card .big{font-size:23px;font-weight:650;margin-top:3px}.card .big small{font-size:12px;font-weight:500;color:#6b7280}
.card .meta{font-size:11px;color:#6b7280;margin-top:2px}
.delta{font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;white-space:nowrap}
.up{background:#e6f4ea;color:#1a7f37}.down{background:#fde8e8;color:#b42318}.flat{background:#eef0f2;color:#6b7280}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cbox{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:11px 13px}
.cbox h4{margin:0 0 2px;font-size:13px}.cbox .cw{position:relative;height:160px}
.panel{background:#fff;border:1px solid #e6e8eb;border-radius:13px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 14px;border-bottom:1px solid #f0f1f3;font-size:13px}
th{color:#6b7280;font-weight:600;font-size:11px;text-transform:uppercase}tr:last-child td{border-bottom:none}
.corr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.crow{background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:11px 13px}
.crow .p{font-size:13px;font-weight:600}.crow .bar{height:7px;border-radius:6px;background:#eef0f2;margin:7px 0 5px;position:relative}
.crow .bar i{position:absolute;top:0;bottom:0;border-radius:6px}.crow .t{font-size:11.5px;color:#6b7280}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rec{background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:11px;text-align:center}
.rec .v{font-size:20px;font-weight:650}.rec .l{font-size:11px;color:#6b7280;margin-top:2px}
.ai{background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:2px 16px 14px}
.ai h4{font-size:14px;margin:14px 0 5px}.ai p{margin:4px 0}.ai ul{margin:4px 0;padding-left:20px}.ai li{margin:3px 0}
.fl{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
.fl-high{background:#fde8e8;color:#b42318}.fl-low{background:#fef0e2;color:#b54708}.fl-critical{background:#b42318;color:#fff}
details{margin-top:8px;background:#fff;border:1px solid #e6e8eb;border-radius:13px;padding:0 4px}
summary{cursor:pointer;color:#6b7280;font-size:12.5px;padding:9px 12px;list-style:none}
.rd{display:flex;gap:14px;align-items:flex-start;border:1px solid #e6e8eb;border-radius:14px;padding:14px 16px;margin-top:6px}
.rd .sc{font-size:34px;font-weight:700;line-height:1;min-width:64px;text-align:center;padding-top:4px}
.rd .nm{font-size:15px;font-weight:650}.rd .mt{font-size:12px;color:#6b7280;margin-top:3px}
.rd-green{background:#eaf7ee;border-color:#bfe3c9}.rd-amber{background:#fdf4e8;border-color:#f3d9b0}.rd-red{background:#fdeaea;border-color:#f3c0c0}
.rd ul{margin:4px 0 0;padding-left:18px}.rd li{font-size:12px;margin:2px 0}
.al{background:#fde8e8;color:#b42318;border-radius:8px;padding:4px 8px;font-size:11.5px;margin-top:5px;display:inline-block}
.rem{background:#eef2ff;border:1px solid #cdd6ff;color:#3538cd;border-radius:11px;padding:9px 13px;font-size:12.5px;margin-top:8px}
.lt{margin:8px 0}.lt .row{font-size:12.5px;display:flex;justify-content:space-between}
.lt .b{height:7px;background:#eef0f2;border-radius:6px;position:relative;margin-top:4px}
.lt .b i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.lt .b s{position:absolute;top:-2px;bottom:-2px;width:2px;background:#1a1d21}
.msg{padding:40px 16px;text-align:center;color:#6b7280}
ul.tight{margin:6px 0 0;padding-left:18px;font-size:12.5px}ul.tight li{margin:2px 0}
</style></head><body><div class="wrap">
<h1>🫀 Health Cockpit</h1><div class="sub" id="sub">Завантаження…</div>
<div id="root"></div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function delta(cur,prev,good){cur=num(cur);prev=num(prev);if(cur==null||prev==null||!prev)return '<span class="delta flat">—</span>';const dp=(cur-prev)/prev*100;const better=good==='lower'?cur<prev:cur>prev;const cls=Math.abs(dp)<1.5?'flat':(better?'up':'down');const ar=dp>0?'▲':(dp<0?'▼':'•');return '<span class="delta '+cls+'">'+ar+' '+Math.abs(dp).toFixed(0)+'%</span>';}
function kc(lab,val,unit,sub,d){return '<div class="card"><div class="lab"><span>'+lab+'</span>'+(d||'')+'</div><div class="big">'+val+'<small> '+(unit||'')+'</small></div><div class="meta">'+(sub||'')+'</div></div>';}
function flagBadge(fl){if(!fl||fl==='normal')return '<span class="sub">норма</span>';const m={high:'вище',low:'нижче',critical:'критично'};return '<span class="fl fl-'+fl+'">'+(m[fl]||fl)+'</span>';}
function labRow(r){const ref=(r.ref_low!=null||r.ref_high!=null)?((r.ref_low!=null?f(r.ref_low,2):'')+'–'+(r.ref_high!=null?f(r.ref_high,2):'')):'';const val=r.value!=null?('<b>'+f(r.value,2)+'</b> '+esc(r.unit||'')):esc(r.value_text||'—');return '<tr><td>'+esc(r.raw_name)+'</td><td>'+val+'</td><td class="sub">'+ref+'</td><td>'+flagBadge(r.flag)+'</td></tr>';}
function readiness(rd){
 if(!rd||rd.score==null)return '';
 const sc=num(rd.score);const cls=sc>=75?'rd-green':(sc>=55?'rd-amber':'rd-red');
 const acwr=rd.acwr!=null?num(rd.acwr):null;
 const loadtxt=acwr==null?'—':(acwr>1.4?acwr+' ⚠️ висока':(acwr<0.8?acwr+' низька':acwr+' оптим.'));
 let mt='😴 '+f(rd.sleep,1)+' год · 📈 HRV '+f(rd.hrv)+'/'+f(rd.hrv_base)+' · ❤️ пульс '+f(rd.rhr)+'/'+f(rd.rhr_base)+' · 🏋️ '+loadtxt;
 const dr=(rd.drivers||[]);const al=(rd.alerts||[]);const t100=(rd.to100||[]);
 let h='<div class="rd '+cls+'"><div class="sc">'+sc+'</div><div style="flex:1"><div class="nm">Готовність дня: '+esc(rd.status)+'</div><div class="mt">'+mt+'</div>';
 if(dr.length)h+='<div class="mt">'+dr.map(esc).join(' · ')+'</div>';
 if(al.length)h+='<div class="al">⚠️ '+al.map(esc).join('; ')+'</div>';
 if(t100.length){h+='<div class="mt" style="margin-top:7px"><b>🎯 Щоб ближче до 100:</b></div><ul>';for(const a of t100.slice(0,3))h+='<li>'+esc(a.text)+(a.gain?' <span class="sub">(≈ +'+a.gain+')</span>':'')+'</li>';h+='</ul>';}
 h+='</div></div>';
 return h;
}
function cvRisk(cv){
 if(!cv||!cv.level)return '';
 const col=cv.level==='низький'?'#1a7f37':(cv.level==='помірний'?'#b54708':'#b42318');
 let h='<h2>❤️‍🩹 Кардіо-ризик — <span style="color:'+col+'">'+esc(cv.level)+'</span></h2><div class="corr">';
 h+='<div class="crow"><div class="p" style="color:#b42318">⚠️ Фактори ризику</div><ul class="tight">'+(cv.risks||[]).map(x=>'<li>'+esc(x.n)+'</li>').join('')+'</ul></div>';
 h+='<div class="crow"><div class="p" style="color:#1a7f37">✅ Захисні фактори</div><ul class="tight">'+(cv.protective||[]).map(x=>'<li>'+esc(x.n)+'</li>').join('')+'</ul></div>';
 h+='</div><div class="sub" style="margin-top:6px">'+esc(cv.note||'')+'</div>';
 return h;
}
function labTrendsBlock(lt){
 if(!lt||!lt.length)return '';
 let rows='';for(const m of lt){const s=m.series||[];if(s.length<2)continue;const a=s[0],b=s[s.length-1];const ar=num(b.v)>num(a.v)?'▲':(num(b.v)<num(a.v)?'▼':'→');rows+='<tr><td>'+esc(m.nm)+'</td><td>'+f(a.v,2)+' → <b>'+f(b.v,2)+'</b> '+esc(m.unit||'')+' '+ar+'</td></tr>';}
 if(!rows)return '';
 return '<h2>📉 Динаміка аналізів</h2><div class="panel"><table><tbody>'+rows+'</tbody></table></div>';
}
function formBlock(fm){
 if(!fm||fm.vo2==null)return '';
 let h='<h2>🏃 Форма (аеробна)</h2><div class="cards">';
 h+=kc('VO₂max',f(fm.vo2,1),'мл/кг/хв',esc(fm.vo2_cat||''),'');
 if(fm.hr_recovery!=null)h+=kc('Відновлення пульсу',f(fm.hr_recovery),'уд/хв',num(fm.hr_recovery)>=25?'відмінно ✅':'ок','');
 h+=kc('Тренування',f(fm.exercise_min_30d),'хв/день','30 дн','');
 h+=kc('Тренувань',f(fm.workouts_30d),'/30 дн','','');
 h+='</div>';return h;
}
function sleepQ(sq){
 if(!sq||sq.avg==null)return '';
 const reg=num(sq.regularity);
 let h='<h2>😴 Якість сну (30 дн)</h2><div class="cards">';
 h+=kc('Тривалість',f(sq.avg,1),'год',num(sq.avg)>=7?'добре':'нижче норми','');
 h+=kc('Регулярність',f(reg),'/100',reg>=70?'стабільно ✅':'нестабільно — лягати в той самий час','');
 if(sq.deep!=null)h+=kc('Глибокий сон',f(sq.deep,1),'год','','');
 if(sq.rem!=null)h+=kc('REM',f(sq.rem,1),'год','','');
 h+='</div>';
 if(sq.deep==null&&sq.rem==null)h+='<div class="sub">Стадії сну зʼявляться, коли увімкнеш детальний експорт сну в Health Auto Export.</div>';
 return h;
}
function secondary(s){
 if(!s)return '';
 let h='<h2>🚶 Мобільність та хода (сер. 30 дн)</h2><div class="cards">';
 h+=kc('Швидкість ходьби',f(s.walking_speed,2),'км/год',num(s.walking_speed)>=4?'добре':'норма','');
 h+=kc('Стійкість ходи',f(s.steadiness,1),'%',num(s.steadiness)>=85?'OK ✅':'спостерігати','');
 if(s.step_length!=null)h+=kc('Довжина кроку',f(s.step_length),'см','','');
 if(s.asym!=null)h+=kc('Асиметрія ходи',f(s.asym,1),'%',num(s.asym)<=3?'добре':'спостерігати','');
 if(s.dsup!=null)h+=kc('Подвійна опора',f(s.dsup,1),'%','норма ~20–40','');
 h+=kc('Сходи',f(s.flights),'/день','','');
 h+='</div>';
 h+='<h2>👂 Слух та активність (сер. 30 дн)</h2><div class="cards">';
 h+=kc('Гучність навушників',f(s.hp_audio),'дБ',num(s.hp_audio)<80?'безпечно ✅':'високо ⚠️','');
 h+=kc('Шум середовища',f(s.env_audio),'дБ','','');
 h+=kc('Денне світло',f(s.daylight),'хв/день',num(s.daylight)>=40?'добре':'мало — більше зранку','');
 h+=kc('Час стоячи',f(s.stand_min),'хв/день','','');
 h+='</div>';return h;
}
function nutrition(nn){
 if(!nn||(nn.kcal==null&&nn.protein==null&&nn.water==null))return '';
 let h='<h2>🍽 Харчування (сер. 30 дн)</h2><div class="cards">';
 if(nn.kcal!=null)h+=kc('Калорії',f(nn.kcal),'ккал','','');
 if(nn.protein!=null)h+=kc('Білок',f(nn.protein),'г','','');
 if(nn.carbs!=null)h+=kc('Вуглеводи',f(nn.carbs),'г','','');
 if(nn.fat!=null)h+=kc('Жири',f(nn.fat),'г','','');
 if(nn.fiber!=null)h+=kc('Клітковина',f(nn.fiber),'г','','');
 if(nn.water!=null)h+=kc('Вода',f(nn.water),'мл','','');
 h+='</div>';return h;
}
function lipidTrack(labs){
 const find=nm=>{const r=(labs.results||[]).find(x=>x.raw_name===nm);return r?num(r.value):null;};
 const items=[['Холестерин загальний',find('Холестерин загальний'),190],['ЛПНЩ (LDL)',find('ЛПНЩ (LDL)'),115],['Не-HDL',find('Не-HDL холестерин'),130]];
 let h='';
 for(const [nm,val,tgt] of items){if(val==null)continue;const over=val>tgt;const fill=Math.min(100,val/(tgt*1.5)*100);const tl=tgt/(tgt*1.5)*100;
  h+='<div class="lt"><div class="row"><span>'+nm+'</span><span><b>'+f(val)+'</b> / ціль &lt;'+tgt+' '+(over?'<span class="fl fl-high">+'+f(val-tgt)+'</span>':'<span class="fl" style="background:#e6f4ea;color:#1a7f37">ок</span>')+'</span></div><div class="b"><i style="width:'+fill+'%;background:'+(over?'#b42318':'#1a7f37')+'"></i><s style="left:'+tl+'%"></s></div></div>';}
 return h?('<div class="panel" style="padding:10px 14px"><div class="sub" style="margin-bottom:4px">🎯 Ліпідні цілі (PTL/PTDL)</div>'+h+'</div>'):'';
}
function render(D){
 const k=D.kpi||{},co=D.corr||{},rc=D.records||{},mon=D.monthly||[],wk=D.workouts||[],cov=D.coverage||[],labs=D.labs||{},meds=D.meds||[],img=D.imaging||[],rem=D.reminders||[];
 document.getElementById('sub').innerHTML='Дані Apple Health · <b>'+f(k.total)+'</b> замірів · з '+(k.since||'')+' · оновлено '+new Date(D.generated_at).toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'});
 let h='';
 h+=readiness(D.readiness);
 if(rem.length){h+='<div class="rem">🔔 '+rem.map(r=>esc(r.title)+' — '+(r.days>0?('через '+r.days+' дн'):'сьогодні')).join(' · ')+'</div>';}
 if(D.insights&&D.insights.body){h+='<h2>🤖 AI-аналіз та рекомендації</h2><div class="ai">'+D.insights.body+'<div class="sub" style="margin-top:8px">згенеровано '+(D.insights.at?new Date(D.insights.at).toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'}):'')+'</div></div>';}
 if(labs.results&&labs.results.length){
   const flagged=labs.results.filter(r=>r.flag&&r.flag!=='normal');
   h+='<h2>🧪 Лабораторні аналізи · '+(labs.date||'')+'</h2>';
   h+=lipidTrack(labs);
   if(flagged.length){h+='<div class="panel" style="margin-top:8px"><table><thead><tr><th>Поза нормою</th><th>Значення</th><th>Реф.</th><th></th></tr></thead><tbody>';for(const r of flagged)h+=labRow(r);h+='</tbody></table></div>';}
   h+='<details><summary>Усі показники ('+labs.results.length+')</summary><table><tbody>';for(const r of labs.results)h+=labRow(r);h+='</tbody></table></details>';
 }
 h+=cvRisk(D.cv);
 h+=labTrendsBlock(D.lab_trends);
 h+='<h2>Огляд · 90 днів</h2><div class="cards">';
 h+=kc('Пульс спокою',f(k.rhr_90),'уд/хв','зараз '+f(k.rhr_last),delta(k.rhr_90,k.rhr_prev,'lower'));
 h+=kc('HRV',f(k.hrv_90),'мс','',delta(k.hrv_90,k.hrv_prev,'higher'));
 h+=kc('VO₂max',f(k.vo2_180,1),'','180 дн','');
 h+=kc('Сон',f(k.sleep_90,1),'год','норма 7-9',delta(k.sleep_90,k.sleep_prev,'higher'));
 h+=kc('Кроки',f(k.steps_90),'/день','',delta(k.steps_90,k.steps_prev,'higher'));
 h+=kc('Активні ккал',f(k.act_90),'/день','','');
 h+=kc('Тренування',f(k.ex_90),'хв/день','','');
 h+=kc('Вага',f(k.w_last,1),'кг','','');
 h+='</div>';
 h+=formBlock(D.form);
 h+=sleepQ(D.sleep_q);
 h+=secondary(D.secondary);
 h+=nutrition(D.nutrition);
 h+='<h2>Тренди (помісячно)</h2><div class="charts" id="charts"></div>';
 h+='<h2>Звʼязки показників</h2><div class="corr">';
 const CD=[['hrv_rhr','HRV ↔ Пульс спокою'],['sleep_hrv','Сон ↔ HRV'],['sleep_rhr','Сон ↔ Пульс'],['ex_rhr','Тренування ↔ Пульс'],['vo2_rhr','VO₂max ↔ Пульс'],['day_sleep','Світло ↔ Сон']];
 for(const [key,lab] of CD){const r=num(co[key]);if(r==null)continue;const w=Math.min(100,Math.abs(r)*100);const pos=r>=0;const col=pos?'#2563eb':'#b42318';const strong=Math.abs(r)>=0.3;h+='<div class="crow"><div class="p">'+lab+' <span style="color:'+(strong?'#2563eb':'#9aa0a8')+'">r='+r.toFixed(2)+'</span></div><div class="bar"><i style="left:'+(pos?'50%':(50-w/2)+'%')+';width:'+(w/2)+'%;background:'+col+'"></i><span style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#cbd2d9"></span></div><div class="t">'+(strong?'виражений звʼязок':'слабкий')+'</div></div>';}
 h+='</div>';
 h+='<h2>Рекорди</h2><div class="recs">';
 h+='<div class="rec"><div class="v">'+f(rc.rhr_min)+'</div><div class="l">мін. пульс спокою</div></div>';
 h+='<div class="rec"><div class="v">'+f(rc.hrv_max)+'</div><div class="l">пік HRV</div></div>';
 h+='<div class="rec"><div class="v">'+f(rc.vo2_max,1)+'</div><div class="l">пік VO₂max</div></div>';
 h+='<div class="rec"><div class="v">'+f(rc.steps_max)+'</div><div class="l">рекорд кроків</div></div>';
 h+='<div class="rec"><div class="v">'+f(rc.d10k)+'</div><div class="l">днів ≥10k кроків</div></div>';
 h+='<div class="rec"><div class="v">'+f(rc.dex30)+'</div><div class="l">днів трен. ≥30хв</div></div>';
 h+='</div>';
 if(meds.length){h+='<h2>💊 Препарати та добавки</h2><div class="panel"><table><thead><tr><th>Назва</th><th>Графік</th><th>Призначення</th></tr></thead><tbody>';for(const m of meds)h+='<tr><td><b>'+esc(m.name)+'</b></td><td class="sub">'+esc(m.schedule||'')+'</td><td class="sub">'+esc(m.purpose||'')+'</td></tr>';h+='</tbody></table></div>';}
 if(img.length){h+='<h2>🩻 Обстеження та висновки</h2><div class="panel"><table><tbody>';for(const j of img)h+='<tr><td class="sub" style="white-space:nowrap;vertical-align:top">'+esc(j.d||'')+'</td><td><b>'+esc(j.title||'')+'</b><br><span class="sub">'+esc(j.body||'')+'</span></td></tr>';h+='</tbody></table></div>';}
 if(wk.length){h+='<h2>Останні тренування</h2><div class="panel"><table><thead><tr><th>Дата</th><th>Тип</th><th>Хв</th><th>Км</th><th>Ккал</th></tr></thead><tbody>';for(const w of wk){h+='<tr><td class="sub">'+(w.d||'')+'</td><td>'+esc(w.workout_type||'')+'</td><td>'+f(w.duration_min)+'</td><td>'+f(w.distance_km,1)+'</td><td>'+f(w.active_kcal)+'</td></tr>';}h+='</tbody></table></div>';}
 h+='<h2>Що відстежується ('+cov.length+')</h2><details><summary>Показати реєстр</summary><table><tbody>';for(const c of cov){h+='<tr><td>'+esc(c.name_uk||'')+'</td><td>'+f(c.days)+' дн</td><td class="sub">'+(c.last||'')+'</td></tr>';}h+='</tbody></table></details>';
 document.getElementById('root').innerHTML=h;
 const defs=[['resting_hr','Пульс спокою','#b42318'],['hrv_ms','HRV','#2563eb'],['vo2max','VO₂max','#7c3aed'],['sleep_hours','Сон','#0891b2'],['weight_kg','Вага','#b54708'],['steps','Кроки','#1a7f37'],['active_kcal','Активні ккал','#db2777'],['walking_speed','Швидкість ходи','#475569']];
 const host=document.getElementById('charts');
 for(const [code,name,col] of defs){const vals=mon.map(r=>num(r[code]));if(vals.every(v=>v==null))continue;const box=document.createElement('div');box.className='cbox';box.innerHTML='<h4>'+name+'</h4><div class="cw"><canvas></canvas></div>';host.appendChild(box);new Chart(box.querySelector('canvas'),{type:'line',data:{labels:mon.map(r=>r.m),datasets:[{data:vals,borderColor:col,backgroundColor:col+'14',fill:true,tension:.25,pointRadius:0,borderWidth:2,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{display:false}},y:{ticks:{font:{size:9}},grid:{color:'#f0f1f3'}}}}});}
}
(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 if(!t){document.getElementById('sub').innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 fetch(API+'?k='+encodeURIComponent(t)).then(r=>r.json()).then(D=>{
   if(!D||D.error){document.getElementById('sub').innerHTML='<div class="msg">Невірний токен або немає даних.</div>';return;}
   render(D);
 }).catch(e=>{document.getElementById('sub').innerHTML='<div class="msg">Помилка завантаження: '+e+'</div>';});
})();
</script></body></html>
