</style></head><body><div class="wrap">
<h1>🫀 Health Cockpit <span style="color:var(--red)">Vadym</span></h1><div class="sub" id="sub" role="status" aria-live="polite">Завантаження…</div>
<nav class="nav" aria-label="Розділи"><a href="#g-today">🔝 Сьогодні</a><a href="#g-sleep">😴 Сон</a><a href="#g-stress">🧠 Стрес</a><a href="#g-heart">❤️ Серце</a><a href="#g-fit">🏃 Форма</a><a href="#g-ins">🔍 Інсайти</a><a href="#g-trend">📈 Тренди</a><a href="#g-ref">📚 Довідка</a><a href="#" onclick="window.open('report.html'+location.hash);return false">📄 Звіт лікарю</a></nav>
<div id="root"></div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dmy=s=>{s=String(s==null?'':s);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.split('-').reverse().join('.'):s;};
function spark(vals,col){vals=(vals||[]).map(num).filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return '';const w=200,h=34,mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;const pts=vals.map((v,i)=>((i/(vals.length-1))*w).toFixed(1)+','+(h-3-((v-mn)/rng)*(h-6)).toFixed(1));const ly=pts[pts.length-1].split(',')[1];return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="'+(w-1.5)+'" cy="'+ly+'" r="2.3" fill="'+col+'"/></svg>';}
function delta(cur,prev,good){cur=num(cur);prev=num(prev);if(cur==null||prev==null||!prev)return '<span class="delta flat">—</span>';const dp=(cur-prev)/prev*100;const better=good==='lower'?cur<prev:cur>prev;const cls=Math.abs(dp)<1.5?'flat':(better?'up':'down');const ar=dp>0?'▲':(dp<0?'▼':'•');return '<span class="delta '+cls+'">'+ar+' '+Math.abs(dp).toFixed(0)+'%</span>';}
function kc(lab,val,unit,sub,d,sp){return '<div class="card"><div class="lab"><span>'+lab+'</span>'+(d||'')+'</div><div class="big">'+val+'<small> '+(unit||'')+'</small></div><div class="meta">'+(sub||'')+'</div>'+(sp||'')+'</div>';}
function grp(t,id){return '<div class="grp"'+(id?' id="'+id+'"':'')+'>'+t+'</div>';}
function barSpark(series,target){
 const vals=(series||[]).map(x=>num(x&&x.v)).filter(v=>v!=null&&!isNaN(v));
 if(vals.length<5)return '';
 const w=300,hh=46,mx=Math.max(target+1.5,...vals),n=vals.length,gap=w/n,bw=gap*0.72;
 let bars='';
 vals.forEach((v,i)=>{const bh=Math.max(1.5,v/mx*(hh-6));const col=v>=target?'#10B981':(v>=target-1?'#F59E0B':'#E30613');
  bars+='<rect x="'+(i*gap+(gap-bw)/2).toFixed(1)+'" y="'+(hh-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="'+col+'"/>';});
 const ty=hh-target/mx*(hh-6);
 return '<svg viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" style="display:block;width:100%;height:52px;margin-top:9px" aria-hidden="true">'+bars+'<line x1="0" x2="'+w+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="#FFF" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/></svg>';
}
function flagBadge(fl){if(!fl||fl==='normal')return '<span class="sub">норма</span>';const m={high:'вище',low:'нижче',critical:'критично'};return '<span class="fl fl-'+fl+'">'+(m[fl]||fl)+'</span>';}
function labRow(r){const ref=(r.ref_low!=null||r.ref_high!=null)?((r.ref_low!=null?f(r.ref_low,2):'')+'–'+(r.ref_high!=null?f(r.ref_high,2):'')):'';const val=r.value!=null?('<b>'+f(r.value,2)+'</b> '+esc(r.unit||'')):esc(r.value_text||'—');return '<tr><td>'+esc(r.raw_name)+'</td><td>'+val+'</td><td class="sub">'+ref+'</td><td>'+flagBadge(r.flag)+'</td></tr>';}
function readiness(rd){
 if(!rd)return '';
 const r=rd.recovery||rd, ld=rd.load||{};
 if(r.score==null)return '';
 const sc=num(r.score);const cls=sc>=75?'rd-green':(sc>=55?'rd-amber':'rd-red');
 let staleBanner='';
 if(r.stale){const hh=r.stale_hrs!=null?Math.round(num(r.stale_hrs)):null;
   staleBanner='<div class="warn">⚠️ <b>Дані застарілі'+(hh!=null?' (~'+hh+' год без синку)':'')+'.</b> Apple Health не синкнув нову ніч — нижче показано сон за '+esc(r.sleep_date||'?')+' ('+f(r.sleep,1)+' год), а НЕ сьогоднішній. Відкрий Health Auto Export, щоб оновити.</div>';}
 const nightTxt=r.stale?('сон за '+esc(r.sleep_date||'?')+' · застаріло'):'за ніч · фіксується зранку';
 let mt='😴 Сон '+f(r.sleep,1)+' год · 📈 HRV '+f(r.hrv)+' / база '+f(r.hrv_base)+' · ❤️ нічний мін. пульс '+f(r.rhr)+' / база '+f(r.rhr_base);
 const mode=sc>=75?'🧭 Режим дня: глибока робота зранку — і можна високе навантаження'
   :(sc>=55?'🧭 Режим дня: стандартний — баланс задач, тренування помірне'
   :'🧭 Режим дня: легкий — делегуй, більше пауз, ранній відбій');
 const al=(r.alerts||[]);const t100=(r.to100||[]);
 let h=staleBanner+'<div class="rd '+cls+'"><div class="sc">'+sc+'</div><div style="flex:1"><div class="nm">🌙 Відновлення: '+esc(r.status)+' <span class="sub" style="font-weight:400">('+nightTxt+')</span></div><div class="mt">'+mt+'</div><div class="mode">'+mode+'</div>';
 if(al.length)h+='<div class="al">⚠️ '+al.map(esc).join('; ')+'</div>';
 if(t100.length){h+='<div class="mt" style="margin-top:7px"><b>🎯 Щоб відновлення ближче до 100:</b></div><ul>';for(const a of t100.slice(0,3))h+='<li>'+esc(a.text)+(a.gain?' <span class="sub">(≈ +'+a.gain+')</span>':'')+'</li>';h+='</ul>';}
 h+='</div></div>';
 const acwr=ld.acwr!=null?num(ld.acwr):null;
 const lvlcol=ld.level==='висока'?'#E30613':(ld.level==='низька'?'#F59E0B':'#10B981');
 const noLoad=(ld.steps==null&&ld.active==null&&ld.exercise==null);
 const stp=num(ld.steps)||0, goal=num(ld.steps_goal)||8000; const pct=Math.min(100,stp/goal*100);
 let lh='<div class="rd" style="background:var(--card);margin-top:10px"><div style="flex:1"><div class="nm">⚡ Денне навантаження <span class="sub" style="font-weight:400">(зростає протягом дня)</span></div>';
 const ageH=num(ld.data_age_hrs);
 lh+=noLoad?'<div class="mt sub">Даних за сьогодні ще немає — синк не приносив активність. Це не «0 кроків».</div>'
          :'<div class="mt">👟 '+f(stp)+' / '+f(goal)+' кроків · 🔥 '+f(ld.active)+' ккал'+(ld.exercise!=null?' · 🏋️ '+f(ld.exercise)+' хв трен.':'')
            +(ld.partial&&ld.as_of?' <span class="sub">(станом на '+esc(ld.as_of)+')</span>':'')+'</div>';
 if(ageH!=null&&ageH>3)lh+='<div class="mt" style="color:#FBBF24">⏳ Дані відстають ~'+Math.round(ageH)+' год — це не підсумок дня. Відкрий Health Auto Export на iPhone.</div>';
 lh+='<div class="b" style="height:8px;background:#2A2A2A;border-radius:6px;position:relative;margin-top:8px;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:'+pct+'%;background:#10B981"></i></div>';
 lh+='<div class="mt">Навантаження 7д:28д <b style="color:'+lvlcol+'">'+(acwr!=null?acwr:'—')+' '+esc(ld.level||'')+'</b> · '+esc(ld.note||'')+'</div>';
 lh+='</div></div>';
 return h+lh;
}
function illnessBanner(il){
 if(!il||!il.level||il.level==='низький')return '';
 const sig=(il.signals||[]).map(esc).join(', ');
 return '<div class="warn">🌡 <b>Раннє попередження ('+esc(il.level)+'):</b> '+esc(il.note)+(sig?' — '+sig:'')+'</div>';
}
function strainBlock(wh){
 if(!wh||!wh.strain||wh.strain.strain==null)return '';
 const s=wh.strain, sc=wh.strain_coach||{}, bal=wh.balance||{};
 const v=num(s.strain); const cls=v>=14?'rd-red':(v>=10?'rd-amber':'rd-green');
 let h='<h2>⚡ Навантаження сьогодні (Strain 0–21)</h2><div class="rd '+cls+'"><div class="sc">'+f(v,1)+'</div><div style="flex:1"><div class="nm">'+esc(s.level)+' <span class="sub" style="font-weight:400">/ 21 · сер. 7д '+f(s.avg7,1)+'</span></div>';
 if(sc.target_low!=null)h+='<div class="mt">🎯 ціль під відновлення '+(sc.recovery!=null?'('+f(sc.recovery)+')':'')+': <b>'+f(sc.target_low)+'–'+f(sc.target_high)+'</b> · '+esc(sc.advice||'')+'</div>';
 if(bal.status)h+='<div class="mt">⚖️ 7д баланс: strain '+f(bal.avg_strain,1)+' vs recovery '+f(bal.avg_recovery)+' — '+esc(bal.status)+'</div>';
 h+='</div></div>';
 return h;
}
function hydrationBlock(D){

 if(w.today==null && a.pct==null)return '';
 const hh=new Date().getHours()+new Date().getMinutes()/60;
 const target=num(w.target)||2000;
 const pace=Math.round(target*Math.min(1,Math.max(0,(hh-8)/14))/50)*50;
 const today=num(w.today)||0;

function initSpy(){
 const links=[...document.querySelectorAll('.nav a')];
 const secs=[...document.querySelectorAll('.grp[id]')];
 if(!secs.length||!('IntersectionObserver' in window))return;
 if(window.__spy)window.__spy.disconnect();
 window.__spy=new IntersectionObserver(es=>{
   for(const e of es)if(e.isIntersecting)links.forEach(a=>a.classList.toggle('act',a.getAttribute('href')==='#'+e.target.id));
 },{rootMargin:'-8% 0px -78% 0px'});
 secs.forEach(s=>window.__spy.observe(s));
}
(function(){
 const KEY='hd_cache_v3', TKEY='hd_token';
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 if(t){try{localStorage.setItem(TKEY,t);}catch(e){}}
 else{try{t=localStorage.getItem(TKEY)||'';}catch(e){}}
 const sub=document.getElementById('sub');
 if(!t){sub.innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 let lastOk=0, hadCache=false;
 try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(c&&c.D){hadCache=true;render(c.D,true);}}catch(e){}
 let tries=0;
 function load(){tries++;
  fetch(API+'?k='+encodeURIComponent(t)+'&cb='+Date.now(),{cache:'no-store'}).then(r=>r.json().then(D=>({s:r.status,D:D}))).then(({s,D})=>{
   if(s===401){sub.innerHTML='Невірний токен доступу.';try{localStorage.removeItem(TKEY);}catch(e){}return;}
   if((D&&D.building)||s===503){
     if(!hadCache)sub.innerHTML=tries<5?('Дані збираються… ('+tries+')')
       :'Дані ще збираються. <a href="#" style="color:#93C5FD" onclick="location.reload();return false">оновити зараз</a>';
     if(tries<5)setTimeout(load,3000);return;}
   if(!D||D.error){if(!hadCache)sub.innerHTML=esc((D&&D.error)||'немає даних');return;}
   lastOk=Date.now();tries=0;
   try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),D:D}));}catch(e){}
   // не перемальовуємо, якщо дані не змінились — інакше закриваються розгорнуті блоки
   if(window.__lastGen && D.generated_at===window.__lastGen){
     const el=document.getElementById('sub');
     if(el)el.innerHTML=el.innerHTML.replace(/ · <span class="spin"><\/span> оновлюю…/,'');
     hadCache=true;return;
   }
   window.__lastGen=D.generated_at;
   render(D,false);hadCache=true;
  }).catch(e=>{
   if(tries<5){setTimeout(load,3000);}
   else if(hadCache){const el=document.getElementById('sub');el.innerHTML=el.innerHTML.replace(/<span class="spin"><\/span> оновлюю…/,'📶 офлайн — показую збережене');}
   else sub.innerHTML='Помилка мережі: '+esc(String(e));
  });
 }
 load();
 setInterval(()=>{tries=0;load();},10*60*1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastOk>5*60*1000){tries=0;load();}});
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
})();
