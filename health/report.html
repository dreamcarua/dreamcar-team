<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звіт для лікаря · Health</title>
<style>
*{box-sizing:border-box}
:root{--navy:#1f3a5f;--ink:#1a1d21;--muted:#5b626b;--line:#d9dde1;--red:#c0392b;--green:#1e7e34}
html,body{margin:0;background:#eef1f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.45}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.toolbar a{color:var(--navy);font-size:13px;text-decoration:none}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.page{max-width:820px;margin:16px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px 34px 40px}
h1{font-size:22px;color:var(--navy);margin:0 0 3px}
.sub{color:var(--muted);font-size:12px;margin:1px 0}
h2{font-size:14px;color:var(--navy);margin:22px 0 8px;border-bottom:2px solid var(--navy);padding-bottom:3px}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{text-align:left;padding:5px 8px;border:1px solid var(--line);font-size:12.5px;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600;font-size:11.5px}
tbody tr:nth-child(even){background:#f5f7f9}
.flag-high,.flag-low,.flag-critical{color:var(--red);font-weight:600}
.risk{color:var(--red)}.prot{color:var(--green)}
.note{color:var(--muted);font-size:11.5px;margin-top:6px}
.hl{font-weight:600}
.lab-head th{background:#7a2230}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:11px}
.msg{padding:40px;text-align:center;color:var(--muted)}
@media print{
 .toolbar{display:none}
 html,body{background:#fff}
 .page{max-width:none;margin:0;border:none;border-radius:0;padding:0}
 @page{size:A4;margin:14mm}
 h2{page-break-after:avoid}table{page-break-inside:auto}tr{page-break-inside:avoid}
}
</style></head><body>
<div class="toolbar">
  <a id="back" href="#">← Дашборд</a>
  <button class="btn" onclick="window.print()">⬇️ Завантажити PDF</button>
</div>
<div class="page" id="page"><div class="msg">Завантаження…</div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function refTxt(r){if(r.ref_low!=null&&r.ref_high!=null)return f(r.ref_low,2)+'–'+f(r.ref_high,2);if(r.ref_high!=null)return '<'+f(r.ref_high,2);if(r.ref_low!=null)return '>'+f(r.ref_low,2);return '';}
function flagName(fl){return ({high:'вище',low:'нижче',critical:'критично'})[fl]||'норма';}
function labRow(r){const val=r.value!=null?(f(r.value,2)+' '+esc(r.unit||'')):esc(r.value_text||'—');const cls=(r.flag&&r.flag!=='normal')?'flag-'+r.flag:'';return '<tr><td>'+esc(r.raw_name)+'</td><td class="'+cls+'">'+val+'</td><td>'+refTxt(r)+'</td><td class="'+cls+'">'+flagName(r.flag)+'</td></tr>';}
function render(D){
 const k=D.kpi||{},fm=D.form||{},cv=D.cv||{},labs=D.labs||{},meds=D.meds||[],img=D.imaging||[];
 const gen=(D.generated_at||'').slice(0,10);
 let h='';
 h+='<h1>Підсумок здоровʼя · Health Summary</h1>';
 h+='<div class="sub">Пацієнт: <b>Vadym H.</b> · Стать: чол. · Дата народження: 06.02.1989 · Звіт сформовано: '+gen+'</div>';
 h+='<div class="sub">Джерело: носимі датчики (Apple Watch / iPhone, 90 днів) + лабораторний чекап. Освітня агрегація, не діагноз.</div>';

 h+='<h2>Вітали та форма (90 днів, носимі датчики)</h2><table><thead><tr><th>Показник</th><th>Значення</th><th>Норма / коментар</th></tr></thead><tbody>';
 const vit=[
  ['Пульс спокою (RHR)',f(k.rhr_90)+' уд/хв','добре (&lt;60)'],
  ['HRV (SDNN)',f(k.hrv_90)+' мс','базова варіабельність'],
  ['VO₂max',f(fm.vo2,1)+' мл/кг/хв',esc(fm.vo2_cat||'')],
  ['Відновлення пульсу 1 хв',f(fm.hr_recovery)+' уд','тренованість'],
  ['Сон (сер.)',f(k.sleep_90,1)+' год/ніч','нижче норми (ціль ≥7)'],
  ['Кроки (сер.)',f(k.steps_90)+'/день',''],
  ['Тренувань / хв (30 дн)',f(fm.workouts_30d)+' / '+f(fm.exercise_min_30d)+' хв',''],
  ['Вага',f(k.w_last,1)+' кг','']
 ];
 for(const r of vit)h+='<tr><td>'+r[0]+'</td><td class="hl">'+r[1]+'</td><td>'+r[2]+'</td></tr>';
 h+='</tbody></table>';

 if(cv.level){
  h+='<h2>Серцево-судинний ризик: <span class="risk">'+esc(cv.level)+'</span> ('+(cv.n_risks||0)+' факторів)</h2>';
  h+='<div><span class="risk hl">Фактори:</span> '+(cv.risks||[]).map(x=>esc(x.n)).join('; ')+'</div>';
  h+='<div style="margin-top:4px"><span class="prot hl">Протективні:</span> '+(cv.protective||[]).map(x=>esc(x.n)).join('; ')+'</div>';
 }

 if(labs.results&&labs.results.length){
  const flagged=labs.results.filter(r=>r.flag&&r.flag!=='normal');
  h+='<h2>Лабораторні аналізи — '+esc(labs.lab||'')+' ('+esc(labs.date||'')+')</h2>';
  if(flagged.length){h+='<table><thead class="lab-head"><tr><th>Поза референсом</th><th>Значення</th><th>Референс</th><th>Флаг</th></tr></thead><tbody>';for(const r of flagged)h+=labRow(r);h+='</tbody></table>';}
  h+='<div class="note">Повний список ('+labs.results.length+' показників):</div>';
  h+='<table><thead><tr><th>Показник</th><th>Значення</th><th>Референс</th><th>Стан</th></tr></thead><tbody>';for(const r of labs.results)h+=labRow(r);h+='</tbody></table>';
 }

 if(img.length){h+='<h2>Інструментальні обстеження (заключення)</h2>';for(const j of img){h+='<div style="margin:6px 0"><span class="hl">'+esc(j.title||'')+'</span> <span class="note">('+esc(j.d||'')+')</span><br>'+esc(j.body||'')+'</div>';}}

 if(meds.length){h+='<h2>Призначення / добавки</h2><table><thead><tr><th>Препарат</th><th>Графік</th><th>Призначення</th></tr></thead><tbody>';for(const m of meds)h+='<tr><td class="hl">'+esc(m.name)+'</td><td>'+esc(m.schedule||'')+'</td><td>'+esc(m.purpose||'')+'</td></tr>';h+='</tbody></table>';}

 h+='<div class="foot">Згенеровано особистою системою моніторингу здоровʼя. Не замінює консультацію лікаря. Контроль ліпідограми рекомендовано ~15.09.2026.</div>';
 document.getElementById('page').innerHTML=h;
 document.title='Health_Summary_'+gen;
}
(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 document.getElementById('back').href='index.html'+(t?('#k='+t):'');
 if(!t){document.getElementById('page').innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 fetch(API+'?k='+encodeURIComponent(t)).then(r=>r.json()).then(D=>{
   if(!D||D.error){document.getElementById('page').innerHTML='<div class="msg">Невірний токен або немає даних.</div>';return;}
   render(D);
 }).catch(e=>{document.getElementById('page').innerHTML='<div class="msg">Помилка: '+e+'</div>';});
})();
</script></body></html>
