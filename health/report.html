table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{text-align:left;padding:5px 9px;border:1px solid var(--line);font-size:12.5px;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600;font-size:11.5px}
thead.lh th{background:#7a2230}
tbody tr:nth-child(even){background:#f5f7f9}
table.full td,table.full th{font-size:11.5px;padding:3.5px 8px}
.flag{color:var(--red);font-weight:700}
.okv{color:var(--green);font-weight:600}
.ref{color:var(--muted)}
.hl{font-weight:600}
.risk{color:var(--red)}.prot{color:var(--green)}
.rlab{font-weight:700;font-size:12.5px;margin-bottom:3px}
.two{display:flex;gap:20px}.two>div{flex:1}
.two ul{margin:2px 0;padding-left:16px}.two li{margin:2px 0;font-size:12px}
ol.focus{margin:4px 0 0;padding-left:20px}ol.focus li{margin:4px 0;padding-left:2px}
ol.focus li b{color:var(--red)}
ul.watch{margin:4px 0 0;padding-left:20px}ul.watch li{margin:4px 0}
.note{background:#f5f7f9;border-left:3px solid var(--amber);color:var(--ink);font-size:11.5px;padding:6px 10px;margin-top:8px;border-radius:0 4px 4px 0}
.exam{margin:7px 0;padding-bottom:6px;border-bottom:1px dotted var(--line)}
.exam:last-child{border-bottom:none}.exam>div{color:var(--muted);font-size:12px;margin-top:2px}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:10.5px}
.msg{padding:40px;text-align:center;color:var(--muted)}
@media print{
 .toolbar{display:none}
 html,body{background:#fff;font-size:11pt}

 thead{display:table-header-group}
 .stamp{border-color:#888}

 for(const j of img){if(/печінк|НАЖБП/i.test(j.body||'')){h+='<li><b>'+L.liver+'</b> '+L.liverTxt+'</li>';break;}}
 h+='</ol>';
 if(LANG==='en'){h+='<div class="note">'+L.cvNote+'</div>';}
 else if(cv.note)h+='<div class="note">'+esc(cv.note)+'</div>';

 h+='<h2>'+L.vitalsH+'</h2><table><thead><tr><th style="width:34%">'+L.metric+'</th><th style="width:33%">'+L.value+'</th><th>'+L.refc+'</th></tr></thead><tbody>';
 if(bpS!=null){
   const st=(bpS>=140||bpD>=90)?L.st_high:((bpS>=130||bpD>=85)?L.st_elev:L.st_norm);

   h+=vrow(L.bp, f(bpS)+'/'+f(bpD)+' ('+L.bpLast+(bp.last_at?' '+esc(bp.last_at):'')+')'+(bp.sys7!=null?(' · '+L.bp7+' '+f(bp.sys7)+'/'+f(bp.dia7)):''),
     st+(bp.pp7!=null?(' · '+L.bpPP+' '+f(bp.pp7)+' (30–50)'):'')+' · '+f(bp.n)+' '+L.bpN, cls);
 } else h+=vrow(L.bp,'—',L.bpNone,'');
 h+=vrow(L.rhr, f(k.rhr_last)+' ('+L.now+') · '+f(k.rhr_90)+' ('+L.d90+')', L.lowGood,'');
 if(r.rhr!=null)h+=vrow(L.nmin, f(r.rhr)+' / '+L.base+' '+f(r.rhr_base),'','');
 if(r.hrv!=null)h+=vrow(L.hrv, f(r.hrv)+' ms / '+L.base+' '+f(r.hrv_base)+' · '+f(k.hrv_90)+' ('+L.d90+')', L.hrvBase,'');
 if(k.spo2_30!=null)h+=vrow(L.spo2, f(k.spo2_30,1)+' %', '≥95%', num(k.spo2_30)>=95?'okv':'flag');
 if(k.resp_30!=null)h+=vrow(L.resp, f(k.resp_30,1)+' /min', L.respRef,'');
 if(td.deviation!=null)h+=vrow(L.wtemp,(num(td.deviation)>=0?'+':'')+f(td.deviation,2)+' °C',L.wtempRef, td.elevated?'flag':'okv');
 if(r.sleep!=null)h+=vrow(L.sleepLast, f(r.sleep,1)+' h', L.sleepRef, num(r.sleep)>=7?'okv':'flag');
 if(sq.avg!=null)h+=vrow(L.sleep30, f(sq.avg,1)+' h'+(sd.debt!=null?(' · '+(LANG==='en'?'debt':'борг')+' '+f(sd.debt,1)+' h/14d'):''), L.sleepRef, num(sq.avg)>=7?'okv':'flag');
 if(sq.deep!=null||sq.rem!=null){const dp=sq.avg&&sq.deep!=null?Math.round(num(sq.deep)/num(sq.avg)*100):null;const rp=sq.avg&&sq.rem!=null?Math.round(num(sq.rem)/num(sq.avg)*100):null;
   h+=vrow(L.stages,(sq.deep!=null?(L.deep+' '+f(sq.deep,1)+' h ('+f(dp)+'%)'):'')+(sq.rem!=null?(' · '+L.rem+' '+f(sq.rem,1)+' h ('+f(rp)+'%)'):''),L.stagesRef, dp!=null&&dp<13?'flag':'');}
 if(nb.avg30!=null)h+=vrow(L.breath, f(nb.avg30,1)+' /h', L.breathRef, num(nb.avg30)>5?'flag':'okv');
 h+=vrow(L.weight, f(k.w_last,1)+' kg'+(k.bmi_last!=null?(' · BMI '+f(k.bmi_last,1)):''),'','');
 h+=vrow(L.vo2, f(fm.vo2,1)+' ml/kg/min'+(k.hrmax_30!=null?(' · '+L.hrmax+' '+f(k.hrmax_30)):''), T(fm.vo2_cat||'')+' · '+L.aerobic,'');
 h+=vrow(L.activity, f(k.steps_90)+' '+L.stepsD+' · '+f(fm.exercise_min_30d)+' '+L.exD,'','');
 h+='</tbody></table>';

 // 3. АКТИВНА ТЕРАПІЯ
 if(meds.length){h+='<h2>'+L.thH+' ('+meds.length+')</h2><table><thead><tr><th style="width:34%">'+L.med+'</th><th style="width:20%">'+L.sched+'</th><th>'+L.purp+'</th></tr></thead><tbody>';
  for(const m of meds)h+='<tr><td class="hl">'+esc(m.name)+'</td><td>'+T(m.schedule||'')+'</td><td>'+T(m.purpose||'')+'</td></tr>';
  h+='</tbody></table><div class="note">'+L.monacolin+(a.pct!=null?(' · '+L.adher+' '+f(a.pct)+'%'):'')+'</div>';}

 // 4. ЛАБИ ПОЗА НОРМОЮ
 if(flagged.length){h+='<h2>'+L.labsH+' '+esc(labs.lab||'')+' ('+esc(labs.date||'')+')</h2>';
  h+='<table><thead class="lh"><tr><th>'+L.analyte+'</th><th style="width:22%">'+L.res+'</th><th style="width:20%">'+L.refr+'</th><th style="width:18%">'+L.state+'</th></tr></thead><tbody>';for(const x of flagged)h+=labRow(x);h+='</tbody></table>';
  if(L.labNote)h+='<div class="note">'+L.labNote+'</div>';}

 // 5. СС-РИЗИК
 if(cv.level){h+='<h2>'+L.cvH+' <span class="risk">'+T(cv.level)+'</span></h2>';
  h+='<div class="two"><div><div class="rlab risk">'+L.riskF+'</div><ul>'+(cv.risks||[]).map(x=>'<li>'+T(x.n)+'</li>').join('')+'</ul></div>';
  h+='<div><div class="rlab prot">'+L.protF+'</div><ul>'+(cv.protective||[]).map(x=>'<li>'+T(x.n)+'</li>').join('')+'</ul></div></div>';}

 // 6. ОБСТЕЖЕННЯ
 if(img.length){h+='<h2>'+L.examH+'</h2>';if(L.examNote)h+='<div class="note" style="margin:4px 0 8px">'+L.examNote+'</div>';
  for(const j of img){h+='<div class="exam"><span class="hl">'+T(j.title||'')+'</span> <span class="ref">'+esc(j.d||'')+'</span><div>'+esc(j.body||'')+'</div></div>';}}

 // 7. ПОВНА ЛАБА
 if(labs.results&&labs.results.length){h+='<h2>'+L.labFull+' ('+labs.results.length+')</h2>';
  h+='<table class="full"><thead><tr><th>'+L.analyte+'</th><th style="width:20%">'+L.res+'</th><th style="width:18%">'+L.refr+'</th><th style="width:14%">'+L.state+'</th></tr></thead><tbody>';for(const x of labs.results)h+=labRow(x);h+='</tbody></table>';}

 h+='<div class="foot">'+L.foot+'</div>';
 document.getElementById('page').innerHTML=h;
 document.title=L.fileT+gen;
}
(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 if(t){try{localStorage.setItem('hd_token',t);}catch(e){}}
 else{try{t=localStorage.getItem('hd_token')||'';}catch(e){}}
 document.getElementById('back').href='index.html'+(t?('#k='+t):'');
 document.getElementById('back').textContent=LANG==='en'?'← Dashboard':'← Дашборд';
 document.getElementById('printbtn').textContent=LANG==='en'?'⬇️ Download PDF':'⬇️ Завантажити PDF';
 const sw=document.getElementById('langsw');
 sw.textContent=LANG==='en'?'UA':'EN';
 sw.href='report.html'+(LANG==='en'?'':'?lang=en')+(t?('#k='+t):'');
 const page=document.getElementById('page');
 if(!t){page.innerHTML='<div class="msg">'+(LANG==='en'?'Add token to the link':'Додай токен у посилання')+': <code>#k=…</code></div>';return;}
 let tries=0;
 function load(){
   tries++;
   fetch(API+'?k='+encodeURIComponent(t)+'&cb='+Date.now(),{cache:'no-store'}).then(r=>r.json().then(D=>({s:r.status,D:D}))).then(({s,D})=>{
     if(s===401){page.innerHTML='<div class="msg">'+(LANG==='en'?'Invalid access token.':'Невірний токен доступу. Відкрий звіт через кнопку на дашборді.')+'</div>';return;}
     if((D&&D.building)||s===503){
       page.innerHTML='<div class="msg">'+(LANG==='en'?'Data is being prepared… retrying':'Дані ще збираються… автоматично оновлюю')+' ('+tries+')</div>';
       if(tries<5)setTimeout(load,3000);
       else page.innerHTML='<div class="msg">'+(LANG==='en'?'Temporarily unavailable. Refresh in a minute.':'Дані тимчасово недоступні. Онови сторінку за хвилину.')+'</div>';
       return;
     }
     if(!D||D.error){page.innerHTML='<div class="msg">'+esc((D&&D.error)||'no data')+'</div>';return;}
     render(D);
   }).catch(e=>{
     if(tries<5){page.innerHTML='<div class="msg">'+(LANG==='en'?'Network retry':'Мережа недоступна, повтор')+' ('+tries+')…</div>';setTimeout(load,3000);}
     else page.innerHTML='<div class="msg">'+(LANG==='en'?'Network error: ':'Помилка мережі: ')+esc(String(e))+'</div>';
   });
 }
 load();
})();
</script></body></html>
