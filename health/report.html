<!doctype html><html lang="uk"><head><meta charset="utf-8"><!-- build:2026-07-02T16:00 focus-first -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Медичний підсумок · Health</title>
<style>
*{box-sizing:border-box}
:root{--navy:#1f3a5f;--ink:#1a1d21;--muted:#5b626b;--line:#d5dae0;--red:#b3261e;--redbg:#fbeaea;--green:#1e7e34;--amber:#8a6d1a}
html,body{margin:0;background:#e9edf1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.toolbar a{color:var(--navy);font-size:13px;text-decoration:none;font-weight:600}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.page{max-width:840px;margin:16px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px 34px 38px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:6px}
h1{font-size:21px;color:var(--navy);margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:1px 0}
.stamp{font-family:Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:var(--navy);text-align:right;line-height:1.2;letter-spacing:.05em;border:1.5px solid var(--navy);border-radius:6px;padding:6px 9px}
h2{font-size:14px;color:var(--navy);margin:20px 0 7px;border-bottom:1.5px solid var(--navy);padding-bottom:3px}
h2.crit{color:var(--red);border-color:var(--red)}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{text-align:left;padding:5px 9px;border:1px solid var(--line);font-size:12.5px;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600;font-size:11.5px}
thead.lh th{background:#7a2230}
tbody tr:nth-child(even){background:#f5f7f9}
table.full td,table.full th{font-size:11.5px;padding:3.5px 8px}
.flag{color:var(--red);font-weight:700}
.ref{color:var(--muted)}
.hl{font-weight:600}
.risk{color:var(--red)}.prot{color:var(--green)}
.rlab{font-weight:700;font-size:12.5px;margin-bottom:3px}
.two{display:flex;gap:20px}.two>div{flex:1}
.two ul{margin:2px 0;padding-left:16px}.two li{margin:2px 0;font-size:12px}
ol.focus{margin:4px 0 0;padding-left:20px}ol.focus li{margin:4px 0;padding-left:2px}
ol.focus li b{color:var(--red)}
.note{background:#f5f7f9;border-left:3px solid var(--amber);color:var(--ink);font-size:11.5px;padding:6px 10px;margin-top:8px;border-radius:0 4px 4px 0}
.exam{margin:7px 0;padding-bottom:6px;border-bottom:1px dotted var(--line)}
.exam:last-child{border-bottom:none}.exam>div{color:var(--muted);font-size:12px;margin-top:2px}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:10.5px}
.msg{padding:40px;text-align:center;color:var(--muted)}
@media print{
 .toolbar{display:none}
 html,body{background:#fff;font-size:11pt}
 .page{max-width:none;margin:0;border:none;border-radius:0;padding:0}
 @page{size:A4;margin:13mm}
 h2{page-break-after:avoid}table,.exam,ol.focus{page-break-inside:auto}tr,.exam li{page-break-inside:avoid}
 thead{display:table-header-group}
 .stamp{border-color:#888}
}
</style></head><body>
<div class="toolbar">
  <a id="back" href="#">← Дашборд</a>
  <button class="btn" onclick="window.print()">⬇️ Завантажити PDF</button>
</div>
<div class="page" id="page"><div class="msg">Завантаження…</div></div>
<script>
const API="https://wotghlaehnvxyeacznvv.supabase.co/functions/v1/health-dashboard";
const num=v=>v==null?null:(typeof v==='number'?v:parseFloat(v));
const f=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('uk-UA',{maximumFractionDigits:d});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function refTxt(r){if(r.ref_low!=null&&r.ref_high!=null)return f(r.ref_low,2)+'–'+f(r.ref_high,2);if(r.ref_high!=null)return '<'+f(r.ref_high,2);if(r.ref_low!=null)return '>'+f(r.ref_low,2);return '';}
function flagName(fl){return ({high:'↑ вище',low:'↓ нижче',critical:'‼ критично'})[fl]||'норма';}
function labRow(r){const val=r.value!=null?(f(r.value,2)+' '+esc(r.unit||'')):esc(r.value_text||'—');const cls=(r.flag&&r.flag!=='normal')?'flag':'';return '<tr><td>'+esc(r.raw_name)+'</td><td class="'+cls+'">'+val+'</td><td class="ref">'+refTxt(r)+'</td><td class="'+cls+'">'+flagName(r.flag)+'</td></tr>';}
const findLab=(labs,names)=>{for(const nm of names){const r=(labs.results||[]).find(x=>x.raw_name===nm);if(r)return r;}return null;};
function render(D){
 const k=D.kpi||{},fm=D.form||{},cv=D.cv||{},labs=D.labs||{},meds=D.meds||[],img=D.imaging||[],bp=D.bp||{};
 const gen=(D.generated_at||'').slice(0,10);
 let h='';
 h+='<div class="hd"><div><h1>Медичний підсумок пацієнта</h1>'
   +'<div class="sub">Пацієнт: <b>Vadym H.</b> · чол. · нар. 06.02.1989 (37 р.)</div>'
   +'<div class="sub">Звіт сформовано: '+gen+' · Джерело: носимі датчики (Apple Watch/iPhone) + лабораторний чекап</div></div>'
   +'<div class="stamp">HEALTH<br>SUMMARY</div></div>';

 // 1. КЛІНІЧНИЙ ФОКУС — курований список значущого (без пограничного шуму)
 const flagged=(labs.results||[]).filter(r=>r.flag&&r.flag!=='normal');
 const ldl=findLab(labs,['ЛПНЩ (LDL)']), tc=findLab(labs,['Холестерин загальний']), nonhdl=findLab(labs,['Не-HDL холестерин']), ferr=findLab(labs,['Феритин']);
 h+='<h2 class="crit">Клінічний фокус — активні проблеми</h2><ol class="focus">';
 if(ldl&&num(ldl.value)>115)h+='<li><b>Дисліпідемія (пріоритет №1).</b> LDL '+f(ldl.value,0)+' (ціль &lt;115)'+(tc?', заг. ХС '+f(tc.value,0):'')+(nonhdl?', не-HDL '+f(nonhdl.value,0):'')+'. Терапія: Lipiform, середземноморська дієта, омега-3.</li>';
 for(const x of (cv.risks||[])){if(/LDL|холестерин|не-HDL/i.test(x.n))continue;h+='<li>'+esc(x.n)+'</li>';}
 if(ferr&&ferr.flag==='high')h+='<li><b>Феритин '+f(ferr.value,0)+'</b> (реф &lt;'+f(ferr.ref_high,0)+') — ізольовано підвищений при нормальних CRP/АЛТ; за стійкості — насичення трансферину.</li>';
 for(const j of img){const t=(j.title||'')+' '+(j.body||'');if(/щитопод|тиреоїд|TIRADS/i.test(t)){h+='<li><b>Щитоподібна:</b> TIRADS 2, ТТГ на верхній межі норми — спостереження на автоімунний тиреоїдит (анти-ТПО/ТГ заплановано), консультація ендокринолога.</li>';break;}}
 for(const j of img){if(/печінк|НАЖБП/i.test(j.body||'')){h+='<li><b>Печінка:</b> неоднорідна ехогенність на УЗД — моніторинг (звʼязок з ліпідами/феритином).</li>';break;}}
 h+='</ol>';
 if(cv.note)h+='<div class="note">'+esc(cv.note)+'</div>';

 // 2. АКТИВНА ТЕРАПІЯ
 if(meds.length){h+='<h2>Активна терапія та добавки ('+meds.length+')</h2><table><thead><tr><th style="width:34%">Препарат</th><th style="width:20%">Графік</th><th>Призначення</th></tr></thead><tbody>';for(const m of meds)h+='<tr><td class="hl">'+esc(m.name)+'</td><td>'+esc(m.schedule||'')+'</td><td>'+esc(m.purpose||'')+'</td></tr>';h+='</tbody></table><div class="note">⚠ Lipiform містить монаколін К (природний статин) — врахувати при призначенні статинів, контроль АЛТ/КФК.</div>';}

 // 3. ВІТАЛИ + ТИСК
 h+='<h2>Вітали, тиск і аеробна форма</h2><table><thead><tr><th>Показник</th><th style="width:30%">Значення</th><th>Норма / коментар</th></tr></thead><tbody>';
 const bpTxt=bp.sys_last!=null?(f(bp.sys_last)+'/'+f(bp.dia_last)+' мм рт.ст.'+(bp.sys7!=null?(' · сер.7дн '+f(bp.sys7)+'/'+f(bp.dia7)+' (n='+f(bp.n)+')'):'')):'—';
 const bpNorm=bp.sys_last==null?'ще не вимірювався':(num(bp.sys_last)>=140||num(bp.dia_last)>=90?'високий':(num(bp.sys_last)>=130?'підвищений':'норма'));
 const vit=[
  ['Артеріальний тиск',bpTxt,bpNorm],
  ['Пульс спокою (RHR, 90 дн)',f(k.rhr_90)+' уд/хв','низький — добре'],
  ['HRV (SDNN, 90 дн)',f(k.hrv_90)+' мс','варіабельність ритму'],
  ['VO₂max',f(fm.vo2,1)+' мл/кг/хв',esc(fm.vo2_cat||'')],
  ['Відновлення пульсу за 1 хв',f(fm.hr_recovery)+' уд','тренованість'],
  ['Сон (сер. 90 дн)',f(k.sleep_90,1)+' год/ніч','нижче норми (ціль ≥7)'],
  ['Активність',f(k.steps_90)+' кроків · '+f(fm.exercise_min_30d)+' хв трен./день',''],
  ['Вага',f(k.w_last,1)+' кг','']
 ];
 for(const r of vit)h+='<tr><td>'+r[0]+'</td><td class="hl">'+r[1]+'</td><td class="ref">'+r[2]+'</td></tr>';
 h+='</tbody></table>';

 // 4. ЛАБИ ПОЗА НОРМОЮ
 if(flagged.length){h+='<h2>Лабораторні показники поза референсом — '+esc(labs.lab||'')+' ('+esc(labs.date||'')+')</h2>';
  h+='<table><thead class="lh"><tr><th>Показник</th><th style="width:22%">Значення</th><th style="width:20%">Референс</th><th style="width:18%">Стан</th></tr></thead><tbody>';for(const r of flagged)h+=labRow(r);h+='</tbody></table>';}

 // 5. СС-РИЗИК
 if(cv.level){h+='<h2>Серцево-судинний ризик: <span class="risk">'+esc(cv.level)+'</span></h2>';
  h+='<div class="two"><div><div class="rlab risk">Фактори ризику</div><ul>'+(cv.risks||[]).map(x=>'<li>'+esc(x.n)+'</li>').join('')+'</ul></div>';
  h+='<div><div class="rlab prot">Протективні фактори</div><ul>'+(cv.protective||[]).map(x=>'<li>'+esc(x.n)+'</li>').join('')+'</ul></div></div>';}

 // 6. ОБСТЕЖЕННЯ ТА КОНСУЛЬТАЦІЇ
 if(img.length){h+='<h2>Обстеження та консультації спеціалістів</h2>';for(const j of img){h+='<div class="exam"><span class="hl">'+esc(j.title||'')+'</span> <span class="ref">'+esc(j.d||'')+'</span><div>'+esc(j.body||'')+'</div></div>';}}

 // 7. ПОВНА ЛАБА
 if(labs.results&&labs.results.length){h+='<h2>Повна лабораторна панель ('+labs.results.length+' показників)</h2>';
  h+='<table class="full"><thead><tr><th>Показник</th><th style="width:20%">Значення</th><th style="width:18%">Референс</th><th style="width:14%">Стан</th></tr></thead><tbody>';for(const r of labs.results)h+=labRow(r);h+='</tbody></table>';}

 h+='<div class="foot">Згенеровано особистою системою моніторингу здоровʼя (носимі датчики Apple Watch/iPhone + лабораторні дані). Освітня агрегація, не є медичним діагнозом і не замінює консультацію лікаря. Плановий контроль ліпідограми та розширеної панелі — 15.09.2026.</div>';
 document.getElementById('page').innerHTML=h;
 document.title='Health_Summary_'+gen;
}
(function(){
 let t=location.hash.slice(1); if(t.indexOf('k=')===0)t=t.slice(2);
 document.getElementById('back').href='index.html'+(t?('#k='+t):'');
 const page=document.getElementById('page');
 if(!t){page.innerHTML='<div class="msg">Додай токен у посилання: <code>#k=ТВІЙ_ТОКЕН</code></div>';return;}
 let tries=0;
 function load(){
   tries++;
   fetch(API+'?k='+encodeURIComponent(t)+'&cb='+Date.now(),{cache:'no-store'}).then(r=>r.json().then(D=>({s:r.status,D:D}))).then(({s,D})=>{
     if(s===401){page.innerHTML='<div class="msg">Невірний токен доступу. Відкрий звіт через кнопку на дашборді.</div>';return;}
     if((D&&D.building)||s===503){
       page.innerHTML='<div class="msg">Дані ще збираються… автоматично оновлюю ('+tries+').</div>';
       if(tries<5)setTimeout(load,3000);
       else page.innerHTML='<div class="msg">Дані тимчасово недоступні. Онови сторінку за хвилину.</div>';
       return;
     }
     if(!D||D.error){page.innerHTML='<div class="msg">'+esc((D&&D.error)||'немає даних')+'</div>';return;}
     render(D);
   }).catch(e=>{
     if(tries<5){page.innerHTML='<div class="msg">Мережа недоступна, повтор ('+tries+')…</div>';setTimeout(load,3000);}
     else page.innerHTML='<div class="msg">Помилка мережі: '+esc(String(e))+'</div>';
   });
 }
 load();
})();
</script></body></html>
